/* ---------- welder intake ---------- */
/* With a WPS on the ticket the welder isn't asked what the WPS already
   fixes; the middle three steps collapse to one. */
function stepList(){
  return S.wps
    ? [["Welder",stepWelder],["Coupon",stepCoupon],["Review",stepReview]]
    : [["Welder",stepWelder],["Test",stepTest],["Position",stepPosition],["Machine",stepMachine],["Review",stepReview]];
}
function lastStep(){ return S.step==stepList().length-1; }
function previewBar(){
  return S.preview ? '<div class="nav"><button data-act="exitpreview">'+"\u2039"+' Console</button>'
    + '<div class="title">Welder\'s view — preview</div><div class="spacer"></div></div>' : "";
}
VIEWS.intake = function(){
  var w=S.w;
  var h = previewBar() + '<div class="ticket"><div class="ticket-top"><div>'
    + '<div class="shop">'+esc(CFG.shop)+' &nbsp;·&nbsp; '+esc(CFG.city)+'</div>'
    + '<h1>Weld test ticket<span>Fill this out before you strike an arc. It writes your test record for you.</span></h1>'
    + '</div>'+codeChip()+'</div><div class="perf"></div>'
    + '<div class="ticket-bottom">'+(w.company?esc(w.company)+' · ':'')+fmtDate(w.date)+'</div></div>';
  var steps=stepList();
  h += '<div class="rail">';
  for(var i=0;i<steps.length;i++) h+='<i class="'+(i==S.step?"on":(i<S.step?"done":""))+'"></i>';
  h += '</div>';
  h += steps[S.step][1]();
  var last = lastStep();
  var bb = (S.step>0?'<button class="ghost" data-act="istep-back">Back</button>':'')
    + '<button class="primary" data-act="'+(last?"isend":"istep-next")+'" '+(last&&missing().length?"disabled":"")+'>'+(last?"Send to inspector":"Continue")+'</button>';

};
function fld(label,key,type,ph,req){
  return '<div class="field"><label>'+esc(label)+(req?' <span class="req">*</span>':'')+'</label>'
    + '<input type="'+(type||"text")+'" value="'+esc(S.w[key])+'" data-k="'+key+'" placeholder="'+esc(ph||"")+'"></div>';
}
function stepWelder(){
  var w=S.w;
  return '<h2 class="step">Who is testing?</h2><p class="hint">This goes on the certificate exactly as you type it.</p>'
    + fld("Full legal name","name","text","First M. Last",1)
    + (w.companyId? '<div class="field"><label>Employer</label><input type="text" value="'+esc(w.company)+'" data-k="company"></div>' : fld("Employer","company","text","Company on the certificate"))

function stepTest(){

  h+=wpsCard(S.wps, "Weld to this procedure");
  h+='<div class="field"><label>Weld type <span class="req">*</span></label>'+tiles([{v:"groove",d:"Groove / CJP"},{v:"fillet",d:"Fillet"}],w.weldType,false,"w:weldType")+'</div>';
  h+=productField();
  h+='<div class="field"><label>Process <span class="req">*</span></label>'+tiles(PROCESSES,w.process,false,"w:process")+'</div>';

  h+='<div class="field"><label>Base metal</label>'+tiles(BASE_METALS,w.base,false,"w:base")+'</div>';
  h+=thicknessField()+pipeFields();
  if(w.weldType=="groove") h+='<div class="field"><label>Backing</label>'+tiles([{v:"with",d:"With backing"},{v:"without",d:"No backing"}],w.backing,false,"w:backing")+'</div>';

function productField(){ return '<div class="field"><label>Plate or pipe <span class="req">*</span></label>'+tiles([{v:"plate",d:""},{v:"pipe",d:"or tube"}],S.w.product,false,"w:product")+'</div>'; }
function transferField(){
  return '<div class="field"><label>Transfer mode <span class="req">*</span></label>'
    +tiles([{v:"Spray"},{v:"Globular"},{v:"Short circuit",d:"GMAW-S"},{v:"Pulsed"}],S.w.transfer,false,"w:transfer")
    +(S.w.transfer=="Short circuit"?'<p class="err">Short circuit needs a qualified WPS — check with the inspector.</p>':'')+'</div>';

function thicknessField(){
  var w=S.w, h='<div class="field"><label>'+(w.product=="pipe"?"Wall thickness":"Material thickness")+' <span class="req">*</span></label>'+tiles(THICKNESSES,w.thickness,false,"w:thickness");

/* Uphill or downhill matters on anything vertical, and the record prints
   it. Asked only when the position is vertical and the WPS didn't say. */
function progressionField(){
  var w=S.w; if(!anyVertical(w)) return "";
  if(S.wps&&S.wps.progression) return "";
  return '<div class="field"><label>Vertical progression <span class="req">*</span></label>'
    +tiles([{v:"Uphill",d:"Vertical up"},{v:"Downhill",d:"Vertical down"}],w.progression,false,"w:progression")+'</div>';
}
function positionField(withHeading){
  var w=S.w;
  var list = w.weldType=="fillet"?FILLET_POS:(w.product=="pipe"?GROOVE_PIPE:GROOVE_PLATE);
  var h = withHeading ? '' : '<div class="field"><label>Test position <span class="req">*</span></label>';
  h+='<p style="margin:-2px 0 10px;font-size:.86rem;color:var(--muted)">Welding more than one plate? Tap each position — 3G and 4G, say. Each one gets its own record.</p>';
  h+=tiles(list,posList(w),true,"w:positions");
  h+=posRanges(w,"margin-top:18px");

/* The draft range for each position picked. */
function posRanges(w,style){
  var ps=posList(w); if(!ps.length) return "";
  var lines=ps.map(function(pos){ var r=suggest(Object.assign({},w,{position:pos})).positions; return r ? '<b>'+esc(pos)+'</b> typically qualifies '+esc(r) : ""; }).filter(Boolean);
  if(!lines.length) return "";
  return '<div class="flag" style="'+(style||"")+'"><b>Draft range</b> — if you pass: '+lines.join("; ")+'. The inspector confirms it against the code book before signing.</div>';
}
function stepPosition(){
  return '<h2 class="step">Test position</h2><p class="hint">This decides more of what you get qualified for than anything else on this form.</p>'+positionField(true)+progressionField();
}
/* The one middle step when a WPS is attached. Everything the WPS fixes
   is already on the record; this asks only about the coupon itself. */
function stepCoupon(){
  var w=S.w, p=S.wps, locked=S.lockedPos;
  var h='<h2 class="step">Your coupon</h2><p class="hint">The procedure below is set by your inspector. If what\'s on the rack doesn\'t match it, tell them — don\'t guess.</p>';
  h+=wpsCard(p, "Weld to this procedure");
  if(locked) h+='<div class="card"><h3>Test position'+(posList(w).length>1?'s':'')+'</h3><dl class="kv"><dt>'+(posList(w).length>1?'Plates':'Position')+'</dt><dd>'+esc(posList(w).join(" and "))+' · '+esc(w.product)+'</dd></dl>'
    +posRanges(w,"margin:12px 0 0")+'</div>';
  else h+=productField()+positionField(false);
  h+=progressionField();
  if(w.process=="GMAW"&&!(p&&p.transfer)) h+=transferField();
  h+=thicknessField()+pipeFields();
  // Anything the WPS left blank that the record still needs.
  var fl=FILLERS[w.process]||["Other"], gs=GASES[w.process]||["Other"], dia=DIAMS[w.process]||[];
  var gaps='';
  if(!w.process) gaps+='<div class="field"><label>Process <span class="req">*</span></label>'+tiles(PROCESSES,w.process,false,"w:process")+'</div>';
  if(w.process&&!w.filler) gaps+='<div class="field"><label>'+(w.process=="SMAW"?"Electrode":"Filler")+' classification <span class="req">*</span></label>'+tiles(fl,w.filler,false,"w:filler")+'</div>';
  if(w.filler=="Other"&&!w.fillerOther) gaps+='<div class="field"><input type="text" data-k="fillerOther" value="'+esc(w.fillerOther)+'" placeholder="Type the AWS classification"></div>';
  if(dia.length&&!w.fillerDia) gaps+='<div class="field"><label>'+esc(DIAM_LABEL[w.process]||"Filler diameter")+' <span class="req">*</span></label>'+tiles(dia,w.fillerDia,false,"w:fillerDia")+'</div>';
  if(gs[0]!="None"&&!w.gas) gaps+='<div class="field"><label>Shielding gas <span class="req">*</span></label>'+tiles(gs,w.gas,false,"w:gas")+'</div>';
  if(w.gas&&w.gas!="None"&&w.gas!="Other"&&!w.flow) gaps+='<div class="field"><label>Flow rate</label>'+tiles(FLOWS,w.flow,false,"w:flow")+'</div>';

  h+='<div class="field"><label>Anything the inspector should know</label><textarea data-k="notes" placeholder="Optional">'+esc(w.notes)+'</textarea></div>';

function kv(k,v){ return v?'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>':""; }
function missing(){
  var w=S.w,m=[];
  if(!w.name)m.push("name");
  if(!w.process)m.push("process");
  if(w.process=="GMAW"&&!w.transfer)m.push("transfer mode");
  if(!posList(w).length)m.push("position");
  if(anyVertical(w)&&!w.progression)m.push("uphill or downhill");
  if(w.product=="pipe"&&!w.pipeOD)m.push("pipe OD");
  if(!w.thickness||(w.thickness=="custom"&&!w.thicknessCustom))m.push("thickness");
  if(!w.filler)m.push("filler metal");
  if((DIAMS[w.process]||[]).length && !w.fillerDia)m.push((DIAM_LABEL[w.process]||"filler diameter").toLowerCase());
  if((GASES[w.process]||[])[0]!="None" && !w.gas)m.push("shielding gas");
  return m;
}
/* The welder's answers go back the way the ticket came: as a link,
   sealed to the inspector's key when the ticket brought one. Built when
   the welder taps Send (sealing is async), kept in S.returnLink. */
function buildReturn(){
  var payload={ tid:S.ticketId||"", w:S.w }, t=S.wticket||{};
  var pk=t.pk ? Promise.resolve(t.pk) : (S.preview ? myKeys().then(function(k){ return k.pub; }) : Promise.resolve(null));
  return pk.then(function(key){
    return key ? seal(payload,key).then(function(c){ return linkDir()+"done.html#f="+c; })
               : linkBase()+"#t="+enc(payload);

}

/* Plain-text and printed forms of a WPS. */
function wpsText(p){
  var out=[CFG.shop+" — "+wpsLabel(p)+(p.basis?" ("+p.basis+")":""), p.title||""].filter(Boolean);
  wpsSections(p).forEach(function(sc){
    out.push(""); out.push(sc.title.toUpperCase());

}

function logWelded(key,date){

/* =========================================================
   The PDFs — WPQR and WPS
   Built here with jsPDF instead of the browser's print dialog. A
   phone's print engine lays the page out at its own width and the
   sheet ran long; here every box goes at a fixed spot on a letter
   page, so it is one page on anything, and the result is a file the
   share sheet can take. Both are laid out like the shop's paper forms.
   ========================================================= */
var PDF_SRC=["https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js",
             "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"];
var pdfLoading=null;
function pdfReady(){ return !!(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable); }
/* Started at boot so the library is in hand by the time a button is
   tapped: iOS only opens the share sheet from inside the tap itself. */
function loadPdfLib(){
  if(pdfReady()) return Promise.resolve();
  if(pdfLoading) return pdfLoading;
  function one(src){ return new Promise(function(ok,no){ var s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=function(){ no(new Error(src)); }; document.head.appendChild(s); }); }
  pdfLoading=one(PDF_SRC[0]).then(function(){ return one(PDF_SRC[1]); }).catch(function(e){ pdfLoading=null; throw e; });
  return pdfLoading;
}
/* Hand the file over: the share sheet on a phone (Files, Messages,
   AirPrint...), a new tab on a desktop, a download if neither works. */
function deliverPdf(d,name){
  var blob=d.output("blob"), mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  var url=URL.createObjectURL(blob);
  function download(){ var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  var file=null; try{ file=new File([blob],name,{type:"application/pdf"}); }catch(e){}
  if(mobile && file && navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file],title:name}).catch(function(e){ if(!/Abort/.test(String(e&&e.name))) download(); });
  else if(mobile) download();
  else if(!window.open(url,"_blank")) download();
  setTimeout(function(){ URL.revokeObjectURL(url); },120000);
}
function pdfName(s){ return String(s||"sheet").replace(/[^\w.-]+/g,"_")+".pdf"; }

/* Acceptance-criteria clause numbers on the results table. Only the
   editions checked against a book are filled in; any other edition
   prints the part reference and the inspector writes the clause in. */
/* D1.1:2025 numbers are from McKay's book: 6.23.1 sends coupon visual to
   6.10.1, 6.23.5 sends bends to 6.10.3.3, 6.23.3.2 sends RT to 8.12.2
   except 8.12.2.2. Specimens: face/root Fig. 6.8, side Fig. 6.9. */
var CLAUSES={ "2020":{ visual:"6.10.1", bendTest:"6.10.3.1 and Fig. 6.8", sideTest:"6.10.3.1 and Fig. 6.9", bend:"6.10.3.3", rt:"Clause 6", macro:"Clause 6" },
  "2025":{ visual:"6.10.1", bendTest:"6.10.3.1 and Fig. 6.8", sideTest:"6.10.3.1 and Fig. 6.9", bend:"6.10.3.3", rt:"8.12.2 (not 8.12.2.2)", macro:"6.23.2.2 / 6.23.4" } };
function clauseRefs(code){ code=code||CFG.code; var y=(String(code).match(/20\d\d/)||[])[0];
  return (isD11(code)&&CLAUSES[y])||{ visual:"Clause 6", bendTest:"Clause 6", sideTest:"Clause 6", bend:"Clause 6", rt:"Clause 6", macro:"Clause 6" }; }
function accept(v){ return v=="Pass"?"Acceptable":v=="Fail"?"Unacceptable":""; }

/* ---- page geometry and drawing helpers (points; letter is 612 x 792) ---- */
var PG={ w:612, h:792, m:28, gap:5 };
function dash(v){ return v===""||v==null?"—":String(v); }
function boxCell(on){ return { content:"", box:!!on }; }
function pdfDoc(){ var d=new window.jspdf.jsPDF({unit:"pt",format:"letter"}); d.setFont("helvetica","normal"); d.setTextColor(0); return d; }
/* One bordered table. o: x, w, y, head (one row), body, col (column
   styles), bold (body columns set bold), center (center the value
   cells), parse (extra per-cell hook). Returns the y under it. */
function grid(d,o){
  var bold=o.bold||[0];
  d.autoTable({ startY:o.y, margin:{left:o.x,right:PG.w-o.x-o.w,top:PG.m,bottom:PG.m}, tableWidth:o.w,
    head:o.head?[o.head]:undefined, body:o.body, theme:"grid", pageBreak:"avoid",
    styles:{ font:"helvetica", fontSize:7, cellPadding:{top:1.4,bottom:1.4,left:3,right:3}, lineColor:0, lineWidth:.5, textColor:0, fillColor:false, overflow:"linebreak", valign:"middle" },
    headStyles:{ fontStyle:"bold", fillColor:false, textColor:0, halign:"center" },
    alternateRowStyles:{ fillColor:false },
    columnStyles:o.col||{},
    didParseCell:function(c){
      var i=c.column.index;
      if(c.section=="head"){ if(i==0) c.cell.styles.halign="left"; }
      else if(bold.indexOf(i)>-1){ c.cell.styles.fontStyle="bold"; c.cell.styles.halign="left"; }
      else c.cell.styles.halign=o.center?"center":"left";
      var own=c.cell.raw&&c.cell.raw.styles; if(own) Object.assign(c.cell.styles,own);   // a cell's own styles win
      if(o.parse) o.parse(c);
    },
    didDrawCell:function(c){
      var raw=c.cell.raw; if(!raw) return;
      if(raw.sketch){ drawJoint(d,raw.sketch,c.cell.x,c.cell.y,c.cell.width,c.cell.height); return; }
      if(raw.box===undefined) return;
      var s=6, cx=c.cell.x+c.cell.width/2-s/2, cy=c.cell.y+c.cell.height/2-s/2;
      d.setLineWidth(.6); d.rect(cx,cy,s,s);
      if(raw.box){ d.setLineWidth(1); d.line(cx+1.2,cy+3.2,cx+2.6,cy+4.8); d.line(cx+2.6,cy+4.8,cx+5,cy+1.4); }
    } });
  return d.lastAutoTable.finalY;
}

/* Signature block: an optional contractor line on the left, the
   authorized-by and date lines in the middle, the stamp box on the right. */
function signature(d,y,leftName,leftLabel,midLabel){
  var x=PG.m, W=PG.w-2*PG.m, mid=x+W*.42, stamp=x+W-96;
  d.setLineWidth(.5); d.setDrawColor(0); d.setTextColor(0);

    d.setFont("helvetica","normal"); d.line(x,y+26,x+W*.36,y+26); d.setFontSize(7); d.text(leftLabel, x, y+34);
  }
  d.setFontSize(7);
  d.line(mid,y+26,stamp-14,y+26); d.text((midLabel||"Authorized by")+" — "+[CFG.inspector,CFG.cert].filter(Boolean).join(", "), mid, y+34, {maxWidth:stamp-14-mid});
  d.line(mid,y+52,stamp-14,y+52); d.text("Date", mid, y+60);
  d.setDrawColor(120); d.setLineDashPattern([2,2],0); d.rect(stamp,y,96,62); d.setLineDashPattern([],0);
  d.setTextColor(120); d.text("Inspector stamp", stamp+48, y+56, {align:"center"}); d.setTextColor(0); d.setDrawColor(0);
  return y+64;
}
/* An unverified record prints as a draft, and says so. */
function watermark(d){

/* ---- the WPQR ----
   Laid out on the shop's spreadsheet form, rule for rule: every x and y
   below was measured off the WPQR the shop issues (Arial ≈ Helvetica,
   6.56 pt body, 10.6 pt rows, text sitting on the bottom rule the way a
   spreadsheet prints it). Only the test-results table grows, one row per
   specimen set, and everything under it moves down with it. */
var WQ={ L:77.5, A:172.3, M:315.6, V:361.0, R:373.6, RA:417.5, E:554.2, ROW:10.6, FS:6.56,
  BAR:153, FILL:240, SHADE:242 };
/* Printed form of a value: "-" for nothing, inches as "3/8 in", ranges
   as "1/8 in - 3/4 in", the way the shop writes them. */
function pv(v){
  if(v===""||v==null) return "-";
  return String(v).replace(/(\d)"/g,"$1 in").replace(/ to /g," - ");
}
function pdate(s){ var p=String(s||"").split("-"); return p.length==3 ? (+p[1])+"/"+(+p[2])+"/"+p[0] : String(s||""); }
/* One ruled table at fixed positions. cols: x of every vertical rule.
   rows: { h, fill, size, mid, cells:[ text | {t, c:span, a:"l"|"c"|"r",
   b:bold, fill, size, gap} ] }. A gap cell draws nothing — it is the
   white space between the "actual" and "qualified" halves. A cell too
   long for its box shrinks a little, then wraps and the row grows.
   Returns the y under the last row. */
function ruled(d,o){
  var cols=o.cols, y=o.y, PAD=1.8;
  o.rows.forEach(function(row){
    var ci=0, cells=[], h=row.h||WQ.ROW;
    row.cells.forEach(function(c){
      if(c===null||typeof c!="object") c={t:c};
      var span=c.c||1; cells.push({c:c, x0:cols[ci], x1:cols[ci+span]}); ci+=span;
    });
    cells.forEach(function(k){
      var c=k.c; if(c.gap) return;
      var fs=c.size||row.size||WQ.FS, txt=c.t==null?"":String(c.t), room=k.x1-k.x0-2*PAD;
      d.setFont("helvetica", c.b||row.b ? "bold" : "normal");
      var widest=function(){ return Math.max.apply(null, txt.split("\n").map(function(x){ return d.setFontSize(fs).getTextWidth(x); })); };
      while(fs>WQ.FS*.8 && widest()>room) fs-=.2;
      d.setFontSize(fs);
      k.fs=fs; k.lines=txt.indexOf("\n")>-1 ? txt.split("\n") : d.splitTextToSize(txt, room);
      h=Math.max(h, k.lines.length*fs*1.15+1.6);
    });
    d.setLineWidth(.5); d.setDrawColor(0);
    cells.forEach(function(k){
      var c=k.c; if(c.gap) return;
      var f=c.fill||row.fill; if(f){ d.setFillColor(f); d.rect(k.x0,y,k.x1-k.x0,h,"F"); }
      d.rect(k.x0,y,k.x1-k.x0,h,"S");
    });
    cells.forEach(function(k){
      var c=k.c; if(c.gap||!k.lines) return;
      d.setFont("helvetica", c.b||row.b ? "bold" : "normal"); d.setFontSize(k.fs); d.setTextColor(0);
      var a=c.a||row.a||"l", tx=a=="c"?(k.x0+k.x1)/2:a=="r"?k.x1-PAD:k.x0+PAD;
      var lh=k.fs*1.15, n=k.lines.length;
      var base=row.mid ? y+h/2-(n-1)*lh/2+k.fs*.33 : y+h-1.6-(n-1)*lh;
      k.lines.forEach(function(ln,i){ d.text(ln, tx, base+i*lh, {align:a=="c"?"center":a=="r"?"right":"left"}); });
    });
    y+=h;
  });
  d.setFont("helvetica","normal");
  return y;
}
/* The shop's letterhead: grey rule across the top, logo left, name in the
   brand color and the address and phone centered over the title. */
function formHead(d,title,b){
  var cx=326.5, rgb=hexRgb(b.color);
  d.setFillColor(WQ.BAR); d.rect(57.6,53.5,496.8,11.1,"F");
  if(b.logo){ try{ var pr=d.getImageProperties(b.logo), s=Math.min(94/pr.width,94/pr.height), lw=pr.width*s, lh=pr.height*s;
    d.addImage(b.logo,"PNG",76.7+(94-lw)/2,65.6+(94-lh)/2,lw,lh); }catch(e){} }
  d.setFont("helvetica","bold"); d.setFontSize(13.77); d.setTextColor(rgb[0],rgb[1],rgb[2]);
  d.text(String(b.name||"").toUpperCase(), cx, 89.9, {align:"center"});
  d.setTextColor(0); d.setFontSize(7.21);
  var ly=100.8; [b.address,b.phone].filter(Boolean).forEach(function(t){ d.text(String(t),cx,ly,{align:"center"}); ly+=10.6; });
  d.setFontSize(9.84); d.text(title, cx, 154.8, {align:"center"});
  d.setFont("helvetica","normal");
}
/* Which bend specimens a coupon gets, and the result keys they fill.
   The default follows D1.1:2025 Table 6.12 (plate) and Table 10.12 (pipe); the inspector can
   change it on the record, and that choice is what prints. */
var BEND_SETS={
  rf:{ label:"1 root + 1 face", rows:[["Root bend","bendRootFace1"],["Face bend","bendRootFace2"]] },
  s2:{ label:"2 side", rows:[["Side bend 1","bendSide1"],["Side bend 2","bendSide2"]] },
  rf2:{ label:"2 root + 2 face", rows:[["Root bend 1","bendRootFace1"],["Root bend 2","bendRoot2"],["Face bend 1","bendRootFace2"],["Face bend 2","bendFace2"]] },
  s4:{ label:"4 side", rows:[["Side bend 1","bendSide1"],["Side bend 2","bendSide2"],["Side bend 3","bendSide3"],["Side bend 4","bendSide4"]] } };
/* Table 6.12, plate: 3/8" gets a face and a root, over 3/8" two side bends.

   from top-left, INVOICE and its number/dates top-right, bill-to, the
   lines, totals, and how to pay. A paid invoice says PAID by the total. */
function addrTwo(s){
  var p=parseAddress(s||""); if(!p.Street&&!p.City) return s?[String(s)]:[];
  return [p.Street, cityStateZip(p.City,p.State,p.Zip)].filter(Boolean);
}
function invoicePdf(v){
  var d=pdfDoc(), b=orgBrand(), L=48, R=PG.w-48, W=R-L, y=50, t=invTotals(v), INK=[40,46,52], SOFT=[110,118,126];
  var rgb=hexRgb(b.color);
  // From: logo, name, address, phone, email.
  var tx=L, logoH=0;
  if(b.logo){ try{ var pr=d.getImageProperties(b.logo), lh=58, lw=lh*pr.width/pr.height; if(lw>110){ lw=110; lh=lw*pr.height/pr.width; }
    d.addImage(b.logo,"PNG",L,y-6,lw,lh); tx=L+lw+12; logoH=lh; }catch(e){} }
  d.setFont("helvetica","bold"); d.setFontSize(14); d.setTextColor(rgb[0],rgb[1],rgb[2]);
  fitText(d,b.name||CFG.inspector||"",tx,y+8,R-200-tx,14);
  d.setFont("helvetica","normal"); d.setFontSize(9); d.setTextColor(INK[0],INK[1],INK[2]);
  var from=addrTwo(CFG.address||CFG.city).concat([prPhone(CFG.phone), CFG.email]).filter(Boolean), fy=y+21;
  from.forEach(function(s){ d.text(String(s),tx,fy); fy+=11.5; });
  // INVOICE and its numbers.
  d.setFont("helvetica","bold"); d.setFontSize(24); d.setTextColor(INK[0],INK[1],INK[2]); d.text("INVOICE",R,y+12,{align:"right"});
  var meta=[["Invoice No.",v.no],["Date",fmtDate(v.date)],["Terms",v.terms],["Due",v.terms=="Due on receipt"?"On receipt":fmtDate(dueDate(v))]];
  if(v.project) meta.push(["Job / PO",v.project]);
  var my=y+30; d.setFontSize(9);
  meta.forEach(function(m){ if(!m[1]) return; d.setFont("helvetica","normal"); d.setTextColor(SOFT[0],SOFT[1],SOFT[2]); d.text(m[0],R-92,my,{align:"right"});
    d.setTextColor(INK[0],INK[1],INK[2]); d.setFont("helvetica","bold"); fitText(d,String(m[1]),R,my,84,9,{align:"right"}); my+=12.5; });
  y=Math.max(fy,my,y-6+logoH)+14;
  d.setDrawColor(200); d.setLineWidth(.8); d.line(L,y,R,y); y+=20;

  // Bill to.
  d.setFont("helvetica","bold"); d.setFontSize(8); d.setTextColor(SOFT[0],SOFT[1],SOFT[2]); d.text("BILL TO",L,y);
  y+=14; d.setTextColor(INK[0],INK[1],INK[2]); d.setFontSize(11.5); fitText(d,v.billName||"",L,y,W*.6,11.5); y+=13;
  d.setFont("helvetica","normal"); d.setFontSize(9);
  [v.billContact?"Attn: "+v.billContact:""].concat(addrTwo(v.billAddress),[prPhone(v.billPhone),v.billEmail]).filter(Boolean)
    .forEach(function(s){ d.text(String(s),L,y); y+=11.5; });
  y+=14;

  // The lines.
  var body=(v.lines||[]).map(function(ln){ var q=lineQty(ln); return [String(ln.desc||""), String(+q.toFixed(2)), money(num(ln.rate)), money(lineAmt(ln))]; });
  d.autoTable({ startY:y, margin:{left:L,right:PG.w-R,top:48,bottom:60}, tableWidth:W, head:[["Description","Qty","Rate","Amount"]], body:body, theme:"plain", rowPageBreak:"avoid", showHead:"everyPage",
    styles:{ font:"helvetica", fontSize:9.5, textColor:INK, cellPadding:{top:7,bottom:7,left:8,right:8}, overflow:"linebreak", valign:"top" },
    headStyles:{ fillColor:INK, textColor:255, fontStyle:"bold", fontSize:8.5 },
    columnStyles:{ 1:{cellWidth:44,halign:"right"}, 2:{cellWidth:78,halign:"right"}, 3:{cellWidth:86,halign:"right"} },
    didParseCell:function(c){ if(c.section=="head"&&c.column.index>0) c.cell.styles.halign="right"; },
    didDrawCell:function(c){ if(c.section=="body"){ d.setDrawColor(222); d.setLineWidth(.6); d.line(c.cell.x,c.cell.y+c.cell.height,c.cell.x+c.cell.width,c.cell.y+c.cell.height); } } });
  y=d.lastAutoTable.finalY+14;
  var notes=d.splitTextToSize(String(v.notes||""),W*.55), pay=d.splitTextToSize(String(CFG.payTo||""),W*.55);
  var need=70+Math.max(0,(notes.length+pay.length)*11.5+(notes.length?18:0)+(pay.length?18:0)-50);
  if(y+need>PG.h-60){ d.addPage(); y=60; }

  // Totals, right.
  var tx1=R-170, ty=y;
  function trow(label,val,bold,size){ d.setFont("helvetica",bold?"bold":"normal"); d.setFontSize(size||9.5); d.setTextColor(bold?INK[0]:SOFT[0],bold?INK[1]:SOFT[1],bold?INK[2]:SOFT[2]);
    d.text(label,tx1,ty); d.setTextColor(INK[0],INK[1],INK[2]); d.text(val,R-8,ty,{align:"right"}); ty+=16; }
  if(t.tax){ trow("Subtotal",money(t.sub)); trow("Tax ("+v.taxRate+"%)",money(t.tax)); }
  trow("Total",money(t.total),true);
  if(v.status=="Paid") trow("Paid"+(v.paidDate?" "+fmtDate(v.paidDate):""),"-"+money(t.total));
  d.setDrawColor(INK[0],INK[1],INK[2]); d.setLineWidth(1); d.line(tx1,ty-8,R,ty-8); ty+=6;
  trow("Balance due",money(v.status=="Paid"?0:t.total),true,12);
  if(v.status=="Paid"){
    d.setTextColor(30,130,76); d.setDrawColor(30,130,76); d.setLineWidth(2);
    d.roundedRect(tx1-118,y-14,92,34,4,4,"S"); d.setFont("helvetica","bold"); d.setFontSize(20); d.text("PAID",tx1-72,y+10,{align:"center"});
  }

  // Note and how to pay, left.
  var ly=y; d.setTextColor(INK[0],INK[1],INK[2]);
  function block(title,lines){ if(!lines.length||!lines.join("").trim()) return;
    d.setFont("helvetica","bold"); d.setFontSize(8); d.setTextColor(SOFT[0],SOFT[1],SOFT[2]); d.text(title,L,ly); ly+=12;
    d.setFont("helvetica","normal"); d.setFontSize(9); d.setTextColor(INK[0],INK[1],INK[2]); lines.forEach(function(s){ d.text(s,L,ly); ly+=11.5; }); ly+=8; }
  if(v.status=="Paid") ly=Math.max(ly,y+36);
  block("HOW TO PAY",pay); block("NOTE",notes);

  // Footer.
  d.setFont("helvetica","normal"); d.setFontSize(8.5); d.setTextColor(SOFT[0],SOFT[1],SOFT[2]);
  var foot="Thank you for your business."+(CFG.inspector?"  ·  "+CFG.inspector+(CFG.cert?", "+CFG.cert:""):"");
  var n=d.internal.getNumberOfPages();
  for(var i=1;i<=n;i++){ d.setPage(i); d.setDrawColor(222); d.setLineWidth(.6); d.line(L,PG.h-50,R,PG.h-50); d.text(foot,PG.w/2,PG.h-36,{align:"center"}); }
  d.setTextColor(0);
  return d;
}
/* Email the PDF on screen. A phone has no way to hand Mail an attachment
   and a To address at once, so the share sheet carries the PDF and the
   message, and their address is put on the clipboard to paste in To.
   A computer downloads the PDF and opens a new email to attach it to. */
function emailPdf(){
  var v=S.pdf; if(!v||!v.doc||!v.email) return;
  var m=v.email, blob=v.doc.output("blob"), file=null;
  try{ file=new File([blob],v.name||"invoice.pdf",{type:"application/pdf"}); }catch(e){}
  if(m.to) copy(m.to);
  if(isPhone()&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    toast(m.to?"Pick Mail. Their address is copied — paste it in To.":"Pick Mail in the menu.",{sticky:1,action:"OK",run:function(){}});
    navigator.share({files:[file],title:m.subject,text:m.body}).catch(function(){});
    return;
  }
  var url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=v.name||"invoice.pdf"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },120000);
  setTimeout(function(){ location.href="mailto:"+encodeURIComponent(m.to||"")+"?subject="+encodeURIComponent(m.subject)+"&body="+encodeURIComponent(m.body+"\n\n(Invoice PDF attached.)"); },300);
  toast("The PDF downloaded — attach it to the email that opens.",{sticky:1,action:"OK",run:function(){}});
}

/* ---- the joint sketch on the WPS ----
   Drawn from the WPS fields, not scanned from the book: groove type,
   angle, root opening, root face, backing and joint type set the
   shape, and the symbols (a, R, f, T) match the paper's sketch. The
   numbers live in the table next to it; the picture is the shape. */
function inches(s){ s=String(s||"").trim(); var m=s.match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+)/); if(m) return +m[1]/+m[2]; m=s.match(/\d+(?:\.\d+)?/); return m?+m[0]:0; }
function degrees(s,fb){ var m=String(s||"").match(/\d+(?:\.\d+)?/); return m?+m[0]:fb; }
function poly(d,pts,close){
  var segs=[]; for(var i=1;i<pts.length;i++) segs.push([pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]]);
  d.lines(segs, pts[0][0], pts[0][1], [1,1], "S", !!close);
}
/* quarter-ish arc as short segments, from angle a0 to a1 (radians) */
function arcPts(cx,cy,r,a0,a1,n){ var out=[]; for(var i=0;i<=n;i++){ var a=a0+(a1-a0)*i/n; out.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); } return out; }
function drawJoint(d,p,cx,cy,cw,ch){
  var fillet=(p.weldType||"CJP groove")=="Fillet", g=p.groove||"Single V", jt=p.jointType||"Butt";
  var T=20, L=50, R=inches(p.rootOpening)>0?6:0, f=inches(p.rootFace)>0?5:0;
  var ang=degrees(p.angle,45), half=Math.tan(ang/2*Math.PI/180), full=Math.tan(Math.min(ang,80)*Math.PI/180);
  var backing=p.backing=="With backing";
  d.setLineWidth(.7); d.setDrawColor(0); d.setTextColor(0); d.setFont("helvetica","italic"); d.setFontSize(6.5);
  var tick=function(x,y0,y1,label){ d.setLineWidth(.4); d.line(x,y0,x,y1); d.line(x-2,y0,x+2,y0); d.line(x-2,y1,x+2,y1); d.text(label,x+3,(y0+y1)/2+2); d.setLineWidth(.7); };
  var sym=function(t,x,y){ if(t=="α"){ d.setFont("symbol","normal"); d.text("a",x,y,{align:"center"}); d.setFont("helvetica","italic"); } else d.text(t,x,y,{align:"center"}); };

  if(fillet || jt=="T" || jt=="Corner" || jt=="Lap" || jt=="Edge"){
    /* a base plate with a member standing on it (T, corner) or lying on it (lap) */
    var bw=Math.min(cw-40, 120), bx=cx+(cw-bw)/2-8, bt=cy+ch-14, bb=bt+T*.75;
    if(jt=="Lap"){
      var ov=bw*.4, y2=bt-T*.75;
      poly(d,[[bx,bt],[bx+bw*.7,bt],[bx+bw*.7,bb],[bx,bb]],true);
      poly(d,[[bx+bw*.7-ov,y2],[bx+bw,y2],[bx+bw,bt],[bx+bw*.7-ov,bt]],true);
      var lg=T*.6; d.setLineWidth(.5);
      poly(d,[[bx+bw*.7,bt],[bx+bw*.7+lg,bt],[bx+bw*.7,bt+lg]],true);              // at the lower plate's end, under the overhang
      poly(d,[[bx+bw*.7-ov,y2],[bx+bw*.7-ov-lg,bt],[bx+bw*.7-ov,bt]],true);        // at the upper plate's end, on the lower plate
      sym("leg",bx+bw*.7-ov-lg-9,bt-3); tick(bx+bw+6,y2,bt,"T"); return;
    }
    if(jt=="Edge"){
      var ex=cx+cw/2-T-8, et=cy+12, eb=cy+ch-10;
      poly(d,[[ex,et+6],[ex+T,et+6],[ex+T,eb],[ex,eb]],true); poly(d,[[ex+T+R,et+6],[ex+2*T+R,et+6],[ex+2*T+R,eb],[ex+T+R,eb]],true);
      d.setLineWidth(.5); poly(d,[[ex+T-4,et+6],[ex+T+R+4,et+6],[ex+T+R/2,et]],true);
      tick(ex+2*T+R+6,et+6,eb,"T"); return;
    }
    var corner=jt=="Corner";
    var mx=corner? bx+bw-T : bx+bw/2-T/2, mtop=cy+10, mb=bt-R;    // member: x, top, bottom
    poly(d,[[bx,bt],[bx+bw,bt],[bx+bw,bb],[bx,bb]],true);
    if(fillet || g=="Square"){
      poly(d,[[mx,mtop],[mx+T,mtop],[mx+T,mb],[mx,mb]],true);
      d.setLineWidth(.5); var leg=T*.8;
      poly(d,[[mx,bt],[mx-leg,bt],[mx,bt-leg]],true);
      if(!corner) poly(d,[[mx+T,bt],[mx+T+leg,bt],[mx+T,bt-leg]],true);
      sym("leg",mx-leg-9,bt-3); d.setLineWidth(.7);
    } else if(/Double/.test(g)){
      var h2=((T-f)/2)/full;
      poly(d,[[mx,mtop],[mx+T,mtop],[mx+T,mb-h2],[mx+T/2+f/2,mb],[mx+T/2-f/2,mb],[mx,mb-h2]],true);
      sym("α",mx-8,mb-h2-3); sym("α",mx+T+8,mb-h2-3);
    } else {
      var h1=(T-f)/full;                                             // single bevel, root face on the far side
      poly(d,[[mx,mtop],[mx+T,mtop],[mx+T,mb],[mx+T-f,mb],[mx,mb-h1]],true);
      sym("α",mx-8,mb-h1-2); if(f) sym("f",mx+T+6,mb-1);
    }
    if(R){ sym("R",mx+T+8,bt+1); }
    tick(mx+T+(corner?6:22),mtop,mb,"T"); tick(bx-6,bt,bb,"T"); return;
  }

  /* butt joint: two plates in line, the groove between them */
  var midX=cx+cw/2-10, top=cy+ch/2-T/2+4, bot=top+T, gapL=midX-R/2, gapR=midX+R/2, xl=gapL-L, xr=gapR+L;
  var leftFace, rightFace;                                           // top-to-bottom along the groove
  var vee=function(x,sgn,tanA,dbl){                                  // face for one plate; sgn -1 left, +1 right
    if(dbl){ var h=(T-f)/2; return [[x+sgn*tanA*h,top],[x,top+h],[x,bot-h],[x+sgn*tanA*h,bot]]; }
    return [[x+sgn*tanA*(T-f),top],[x,bot-f],[x,bot]];
  };
  var uface=function(x,sgn){ var r=Math.min(7,(T-f)/2), wall=Math.tan(8*Math.PI/180)*(T-f-r);
    return [[x+sgn*(r+wall),top]].concat(arcPts(x,bot-f-r,r,sgn>0?0:Math.PI,Math.PI/2,6)).concat([[x,bot]]); };
  var square=function(x){ return [[x,top],[x,bot]]; };
  if(g=="Single V"){ leftFace=vee(gapL,-1,half); rightFace=vee(gapR,1,half); }
  else if(g=="Double V"){ leftFace=vee(gapL,-1,half,1); rightFace=vee(gapR,1,half,1); }
  else if(g=="Single bevel"){ leftFace=square(gapL); rightFace=vee(gapR,1,full); }
  else if(g=="Double bevel"){ leftFace=square(gapL); rightFace=vee(gapR,1,full,1); }
  else if(g=="U"){ leftFace=uface(gapL,-1); rightFace=uface(gapR,1); }
  else if(g=="J"){ leftFace=square(gapL); rightFace=uface(gapR,1); }
  else { leftFace=square(gapL); rightFace=square(gapR); }
  poly(d,[[xl,top]].concat(leftFace).concat([[xl,bot]]),true);
  poly(d,[[xr,top]].concat(rightFace).concat([[xr,bot]]),true);
  if(backing){ poly(d,[[gapL-12,bot],[gapR+12,bot],[gapR+12,bot+6],[gapL-12,bot+6]],true); }
  /* symbols */
  if(g!="Square"){ var ax=(g=="Single bevel"||g=="Double bevel"||g=="J")?gapR+6:midX; sym("α",ax,top-3); }
  if(R){ d.setLineWidth(.4); d.line(gapL,bot+(backing?9:3),gapL,bot+(backing?15:9)); d.line(gapR,bot+(backing?9:3),gapR,bot+(backing?15:9)); d.setLineWidth(.7); sym("R",midX,bot+(backing?21:14)); }
  if(f&&!/Double/.test(g)){ sym("f",gapR+(g=="Single bevel"||g=="J"?-6:4)+8,bot-f/2+2); }
  tick(xr+7,top,bot,"T");
  d.setFont("helvetica","normal");
}

/* ---- the WPS ---- */
function wpsPdf(p){
  var groove=(p.weldType||"CJP groove")!="Fillet", cjp=(p.weldType||"CJP groove")=="CJP groove", pjp=p.weldType=="PJP groove";
  var manual=(p.process=="SMAW"||p.process=="GTAW")?"Manual":"Semiautomatic";
  var backMat=p.backing=="With backing"?(p.backingMat||""):"";
  var gasProc=p.process!="SMAW"&&p.process!="FCAW-S";
  var d=pdfDoc(), x=PG.m, W=PG.w-2*PG.m, half=(W-PG.gap)/2, xr=x+half+PG.gap;
  var b=wpsBrand(p), y=letterhead(d,"Welding Procedure Specification (WPS)",b);

  /* header strip: a value line with its label under it, like the paper */
  y=grid(d,{x:x,w:W,y:y,bold:[],body:[
    [dash(b.name),dash(p.no),dash(p.rev),dash(p.date?fmtDate(p.date):"")],
    ["Company Name","WPS No.","Rev. No","Date"],
    [dash(p.contact),{content:dash(p.basis=="Qualified by PQR"?(p.pqr||"PQR"):"Prequalified / "+CFG.code),colSpan:2},dash(p.cvn)],
    ["Company Contact",{content:"Supporting PQR",colSpan:2},"CVN Report"]],
    parse:function(c){
      if(c.row.index%2==0){ c.cell.styles.fontStyle="bold"; c.cell.styles.lineWidth={top:.5,left:.5,right:.5,bottom:0}; c.cell.styles.cellPadding={top:2.5,bottom:0,left:3,right:3}; }
      else { c.cell.styles.fontSize=6; c.cell.styles.lineWidth={top:0,left:.5,right:.5,bottom:.5}; c.cell.styles.cellPadding={top:0,bottom:2,left:3,right:3}; }
    }})+PG.gap;

  var tmx=thickMax(p), metal=function(k,m){ return [k,dash(m),"—",dash(metalGroup(m,tmx))]; };
  var yl=grid(d,{x:x,w:half,y:y,center:1,head:["Base Metals","Specification","Type or Grade","AWS Group No."],
    body:[metal("Base Material",p.base),metal("Welded To",p.baseTo||p.base),metal("Backing Material",backMat),["Other","—","—","—"]]});
  var tr=function(k,v,pw){ return [k,dash(v),dash(pw)]; };
  var yr=grid(d,{x:xr,w:half,y:y,center:1,head:["Base Metal Thickness","As-Welded","With PWHT"],body:[
    tr("CJP Groove Welds", cjp?p.thickRange:"", cjp&&hasPwht(p)?p.thickRange:""),
    tr("CJP Groove Weld w/CVN", cjp&&p.cvn?p.thickRange:"", ""),
    tr("PJP Groove Welds", pjp?p.thickRange:"", pjp&&hasPwht(p)?p.thickRange:""),
    tr("Fillet Welds", groove?"":p.thickRange, !groove&&hasPwht(p)?p.thickRange:""),
    tr("Diameter (If Applicable)", p.diaRange, "")]});
  y=Math.max(yl,yr)+PG.gap;

  var jt=groove ? [p.groove,"groove",p.jointType?p.jointType.toLowerCase()+" joint":""].filter(Boolean).join(" ")
                : "Fillet, "+(p.jointType||"")+(p.filletSize?" — "+p.filletSize:"");
  yl=grid(d,{x:x,w:half,y:y,col:{0:{cellWidth:96}},head:[{content:"Joint Details",colSpan:2}],body:[
    ["Groove Type",dash(jt)],["Groove Angle",dash(groove?p.angle:"")],["Root Opening",dash(groove?p.rootOpening:"")],["Root Face",dash(groove?p.rootFace:"")],
    ["Backing",dash(groove?[p.backing,backMat].filter(Boolean).join(" — "):"")],["Backgouging Method",dash(p.backgouge||"None")],
    ["PWHT Temperature",dash(p.pwhtTemp)],["PWHT Time at Temp.",dash(p.pwhtTime)]]});
  yr=grid(d,{x:xr,w:half,y:y,col:{0:{cellWidth:150}},head:[{content:"Joint Details (Sketch)",colSpan:2}],body:[
    [{content:"",sketch:p,colSpan:2,styles:{minCellHeight:78}}],
    [{content:p.title||"",colSpan:2,styles:{halign:"center",fontStyle:"normal",fontSize:6.5}}],
    ["Pre-Qualified per "+CFG.code, boxCell(p.basis!="Qualified by PQR")],
    ["Pre-Qualified Joint Designation", dash(p.jointDesig)]],
    parse:function(c){ if(c.section=="body"&&c.row.index>0&&c.column.index==1) c.cell.styles.halign="center"; }});
  y=greyBar(d,Math.max(yl,yr)+PG.gap,"Procedure");

  var yL=y, yR=y, lab={0:{cellWidth:110}};
  yL=grid(d,{x:x,w:half,y:yL,col:lab,body:[["Process",dash(p.process)],["Type",manual],["Position",dash(p.positions)],["Progression",dash(p.progression)]]})+PG.gap;
  yL=grid(d,{x:x,w:half,y:yL,col:lab,head:[{content:"Electrical Characteristics",colSpan:2}],body:[
    ["Current Type & Polarity",dash(p.polarity)],["Transfer Mode",dash(p.transfer)],["Amps",dash(p.amps)],["Voltage",dash(p.volts)],
    ["Wire Feed Speed",dash(p.wfs?p.wfs+" ipm":"")],["Travel Speed",dash(p.travel?p.travel+" ipm":"")],["Maximum Heat Input",dash(p.heatInput)],["Power Source",dash(p.powerSource)]]})+PG.gap;
  if(gasProc) yL=grid(d,{x:x,w:half,y:yL,col:lab,head:["Shielding Gas (Composition)",dash(p.gas)],body:[
    ["Flow Rate",dash(p.flow?p.flow+" cfh":"")],["Nozzle Size",dash(p.nozzle)],["Contact Tube to Work Distance",dash(p.ctwd)]]})+PG.gap;

  yR=grid(d,{x:xr,w:half,y:yR,col:lab,head:["Filler Metal (AWS Spec.)",dash(fillerSpecFor(p.filler)||p.fillerSpec)],body:[
    ["AWS Classification",dash(p.filler)],["Electrode Diameter",dash(p.fillerDia)],["Manufacturer Name",dash(p.fillerMfr)],["Supplemental Filler Metal",dash(p.suppFiller||"None")]]})+PG.gap;
  yR=grid(d,{x:xr,w:half,y:yR,bold:[0,2],col:{1:{cellWidth:24},3:{cellWidth:24}},head:[{content:"Technique",colSpan:4}],body:[
    ["Multi Pass",boxCell(p.passes=="Multiple pass"),"Single Pass",boxCell(p.passes=="Single pass")],
    ["Stringer",boxCell(p.bead=="Stringer"||p.bead=="Either"),"Weave",boxCell(p.bead=="Weave"||p.bead=="Either")],
    ["Peening",{content:dash(p.peening||"None"),colSpan:3}],
    ["Interpass Cleaning",{content:dash(p.cleaning),colSpan:3}]]})+PG.gap;
  yR=grid(d,{x:xr,w:half,y:yR,col:lab,head:["Preheat Temperature",dash(p.preheat)],body:[["Preheat Category (Table 5.11)",dash(p.preheatCat)],["Interpass Temperature",dash(p.interpass)]]})+PG.gap;
  y=Math.max(yL,yR);
  if(p.notes) y=grid(d,{x:x,w:W,y:y,bold:[],head:["Notes"],body:[[p.notes]]})+PG.gap;
  // 5.2.1: the Contractor prepares the WPS; the inspector's line is the review.
  signature(d,y,p.companyId?coName(p.companyId):"","Prepared by — Contractor (5.2.1)","Reviewed by");
  if(wpsBlocking(p).length) watermark(d);
  return d;
}

/* Clipboard, with the old select-and-copy for browsers that refuse the API. */
function copy(t){
  function legacy(){ var ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} ta.remove(); }
  try{ navigator.clipboard.writeText(t).catch(legacy); }catch(e){ legacy(); }
}
/* A file to keep: the share sheet on a phone, a download elsewhere. */
function saveFile(blob,name){
  var file=null; try{ file=new File([blob],name,{type:blob.type}); }catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file],title:name}).catch(function(){}); return; }
  var url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },60000);
}
/* A backup is the JSON file, or the same thing as copied text. */
function readBackup(txt){
  txt=String(txt||"").trim(); if(!txt) return null;
  var d=null; if(txt.charAt(0)=="{"){ try{ d=JSON.parse(txt); }catch(e){} } else d=dec(txt);
  return d&&Array.isArray(d.records) ? d : null;
}
function importBackup(d){
  if(!d) return false;

  TABLES.forEach(function(t){ (d[t]||[]).forEach(function(x){ if(x&&x.id) putRow(t,x); }); });
  if(Array.isArray(d.keys)&&d.keys.length){
    var ring=keyRing(), have=ring.map(function(k){ return k.pub; });
    ring=ring.concat(d.keys.filter(function(k){ return k&&k.pub&&have.indexOf(k.pub)<0; }));
    raw.set(ns("keys"),JSON.stringify(ring)); keysReady=null;
  }
  toast("Backup imported — "+d.records.length+" record"+(d.records.length==1?"":"s")+".");

function startIntake(pre,preview,wps){
  S.w=blankW(); S.r=blankR(); S.step=0; S.preview=!!preview; S.wps=wps||null;
  if(pre){ if(pre.companyId){S.w.companyId=pre.companyId;} if(pre.company||pre.companyLabel){S.w.company=pre.company||pre.companyLabel;}
    if(pre.name)S.w.name=pre.name; if(pre.wpsId)S.w.wpsId=pre.wpsId; if(pre.wps||pre.wpsLabel)S.w.wps=pre.wps||pre.wpsLabel;
    if(pre.position){ S.w.position=pre.position; if(/F$/.test(pre.position))S.w.weldType="fillet"; if(["5G","6G","2G+5G"].indexOf(pre.position)>-1)S.w.product="pipe"; }
    if(pre.process)S.w.process=pre.process; }
  if(pre&&pre.positions&&pre.positions.length){ S.w.positions=pre.positions.slice(); S.w.position=pre.positions[0]; if(/F$/.test(S.w.position))S.w.weldType="fillet"; }

/* Only pre-pick what the form has a tile for; anything else stays a
   blank the welder fills. The card still shows the full WPS. */
function prefillFromWps(p){
  var w=S.w;
  if(p.process) w.process=p.process;
  if(p.transfer) w.transfer=p.transfer;
  var fl=FILLERS[w.process]||[], gs=GASES[w.process]||[];
  if(p.filler){ if(fl.indexOf(p.filler)>-1) w.filler=p.filler; else { w.filler="Other"; w.fillerOther=p.filler; } }
  // A WPS may give a range (".045\" to 1/16\"", "30–40"); then the welder picks the one they pulled.
  if(p.fillerDia && (DIAMS[w.process]||[]).some(function(d){return d.v==p.fillerDia})) w.fillerDia=p.fillerDia;
  if(gs[0]=="None") w.gas="None";
  else if(p.gas){ if(gs.indexOf(p.gas)>-1) w.gas=p.gas; else { w.gas="Other"; w.gasOther=p.gas; } }
  if(p.flow && FLOWS.some(function(f){return f.v==String(p.flow)})) w.flow=String(p.flow);
  if(p.base) w.base=p.base;
  if(p.weldType) w.weldType = p.weldType=="Fillet" ? "fillet" : "groove";
  if(p.backing) w.backing = p.backing=="No backing" ? "without" : "with";
  if(p.progression) w.progression=p.progression;
  if(!w.wps) w.wps=wpsLabel(p);
  if(!w.wpsId&&p.id) w.wpsId=p.id;
  if(p.code) w.code=p.code;
  if(!w.thickness&&p.starter&&/3\/8/.test(p.title||"")) w.thickness="0.375";
}

/* ---------- the two links ----------

/* Is there a finished ticket in this text? (#f= sealed, #t= the older
   open kind.) Cheap and sync, so a phone without the key can still tell. */
function isReturn(txt){ return /[#&](f|t)=[A-Za-z0-9\-_]{20,}/.test(String(txt||"")); }
/* Open one: resolves to { tid, w } or null. */
function readReturn(txt){
  var m=String(txt||"").match(/[#&](f|t)=([A-Za-z0-9\-_]+)/);
  if(!m) return Promise.resolve(null);
  var p=m[1]=="f" ? unseal(m[2]).catch(function(){ return "locked"; }) : Promise.resolve(dec(m[2]));
  return p.then(function(d){ return d=="locked" ? d : (d&&d.w&&typeof d.w=="object" ? d : null); });
}
/* Company names as people type them: no case, punctuation or "LLC". */
function coKey(s){ return String(s||"").toLowerCase().replace(/&/g," and ").replace(/\b(llc|inc|co|corp|company|ltd)\b\.?/g,"").replace(/[^a-z0-9]+/g,""); }
/* The company a typed name means, if it's one on file: the same name, or
   one name starting the other ("Weld West" for "Weld West Fabrication"). */
function matchCompany(name){
  var k=coKey(name); if(k.length<3) return null;
  var cs=companies(), hit=cs.filter(function(c){ return coKey(c.name)==k||coKey(c.lhName)==k; })[0];
  if(hit) return hit;
  var near=cs.filter(function(c){ var ck=coKey(c.name); return ck.length>=4&&(ck.indexOf(k)==0||k.indexOf(ck)==0); });
  return near.length==1 ? near[0] : null;
}
/* A welder's link fills in what the inspector already knows: the company
   on file their typed employer means, and their stamp and division from
   their last test with that company. Only on this phone — the welder's
   link never carries the client list. */
function recognize(w){
  var said=[];
  if(!w.companyId&&w.company){ var c=matchCompany(w.company); if(c){ w.companyId=c.id; w.company=c.name; said.push(c.name); } }
  var nk=coKey(w.name);
  var prev=nk ? records().filter(function(r){ return coKey(r.w.name)==nk&&(!w.companyId||r.w.companyId==w.companyId); })
    .sort(function(a,b){ return (b.updated||0)-(a.updated||0); })[0] : null;
  if(prev){
    if(!w.stamp&&prev.w.stamp){ w.stamp=prev.w.stamp; said.push("stamp "+prev.w.stamp); }
    if(!w.division&&prev.w.division) w.division=prev.w.division;
  }
  return said;
}
/* File a welder's answers. Resolves true when it filed (or found) one,

    if(d=="locked"){ toast("That Finished Ticket was locked to a different phone's key. Open it on the phone that sent the Weld Ticket, or import that phone's backup here.",{bad:1}); return true; }
    var base=d.tid?"t"+d.tid:uid(), ps=posList(d.w), many=ps.length>1;
    var ids=many ? ps.map(function(pos){ return base+"-"+pos.replace(/[^A-Za-z0-9]/g,""); }) : [base];
    if(getRow("records",ids[0])){ toast("Already on file — opened it."); openRecord(ids[0]); return true; }
    var w=Object.assign(blankW(),d.w), said=recognize(w);

    });

    S.stack=[]; S.screen="records"; openRecord(ids[0]);

  });
}

function pick(v,group){

  if(group=="tproc"){ S.draft.process=v; render({keepScroll:true}); return; }
  if(group=="wproc"){ var setP=function(o){ o.process=v; }; if(wpsGuard(setP)) return; setP(S.draft); render({keepScroll:true}); return; }
  if(group&&group.slice(0,2)=="d:"){
    var k=group.slice(2), nv=(S.draft[k]===v?"":v);
    var setD=function(o){ o[k]=nv; if(k=="filler"){ var sp=fillerSpecFor(o.filler); if(sp) o.fillerSpec=sp; } };
    if(nv!==""&&wpsGuard(setD)) return;
    setD(S.draft); render({keepScroll:true}); return;
  }
  var w=S.w;

});
document.addEventListener("pointerout", function(e){
  if(e.pointerType!="mouse"||!e.target.closest) return;
  var p=e.target.closest(".mplot"); if(p&&!(e.relatedTarget&&p.contains(e.relatedTarget))) monthTip(null);
});
document.addEventListener("focusin", function(e){
  var b=e.target.closest&&e.target.closest("[data-mcol]"); if(b) monthTip(b);
});
/* Shrink a chosen image to a small PNG data URL for the letterhead. */
function readLogo(file, done){
  var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){
    var max=360, sc=Math.min(1, max/Math.max(img.width,img.height));
    var c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); done(c.toDataURL("image/png"));
  };
  img.onerror=function(){ URL.revokeObjectURL(url); toast("Couldn't read that image."); };
  img.src=url;
}
/* Enter on the first-run form presses the button under it */
document.addEventListener("keydown", function(e){
  if(e.key!="Enter" || S.screen!="onboard" || e.target.tagName!="INPUT") return;
  var b=app.querySelector("button.primary"); if(b){ e.preventDefault(); b.click(); }
});
/* ---------- updates ----------
   GitHub tells phones they may keep the page 10 minutes, and a
   home-screen app can sit on its copy longer. On open and whenever the
   app comes back to the front, ask the server (past every cache) which
   version it has; if it's newer, say so once, and Update loads it fresh.
   Never on a welder's ticket — a reload there would lose their answers. */
var updateSeen="";
function checkForUpdate(){
  if(!hosted()||S.welder||S.screen=="intake") return;
  fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(function(r){ return r.ok?r.text():""; }).then(function(html){
    var m=String(html).match(/var VERSION="([^"]+)"/); if(!m) return;
    var live=m[1];
    if(live==VERSION||live==updateSeen||verNum(live)<=verNum(VERSION)) return;
    updateSeen=live;
    toast("A new version of Weld Sync is ready.",{ action:"Update", sticky:true, run:function(){
      flushSave();
      fetch(location.pathname,{cache:"reload"}).catch(function(){}).then(function(){ location.replace(location.pathname+"?u="+Date.now()); });
    } });
  }).catch(function(){});
}
/* "2026-11-21.11" → a number that orders correctly (.11 after .9). */
function verNum(v){ var m=String(v).match(/^(\d+)-(\d+)-(\d+)\.(\d+)$/); return m ? ((+m[1]*100+ +m[2])*100+ +m[3])*1000+ +m[4] : 0; }
document.addEventListener("visibilitychange",function(){ if(document.visibilityState=="visible") checkForUpdate(); });

/* ---------- swipe to delete ----------
   Drag a row left: past halfway it deletes, a shorter drag leaves the
   Delete button showing. Vertical drags scroll as normal (touch-action:
   pan-y hands only sideways moves to us). A drag never counts as a tap. */
var SWIPE={ el:null, open:null, x0:0, y0:0, dx:0, axis:null, base:0, moved:false };
function swClose(except){ if(SWIPE.open&&SWIPE.open!==except){ SWIPE.open.firstElementChild.nextElementSibling.style.transform=""; SWIPE.open=null; } }
document.addEventListener("pointerdown", function(e){
  var sw=e.target.closest(".sw");
  if(!sw||e.target.closest(".sw-act")){ if(!sw) swClose(null); return; }
  swClose(sw);
  SWIPE.el=sw; SWIPE.x0=e.clientX; SWIPE.y0=e.clientY; SWIPE.dx=0; SWIPE.axis=null; SWIPE.moved=false;
  SWIPE.base=SWIPE.open===sw?-88:0;
});
document.addEventListener("pointermove", function(e){
  var sw=SWIPE.el; if(!sw) return;
  var dx=e.clientX-SWIPE.x0, dy=e.clientY-SWIPE.y0;
  if(!SWIPE.axis){ if(Math.abs(dx)<8&&Math.abs(dy)<8) return; SWIPE.axis=Math.abs(dx)>Math.abs(dy)?"x":"y"; if(SWIPE.axis=="x") sw.classList.add("drag"); }
  if(SWIPE.axis!="x") return;
  SWIPE.moved=true; SWIPE.dx=Math.min(0,SWIPE.base+dx);
  sw.querySelector(".sub").style.transform="translateX("+SWIPE.dx+"px)";
});
function swEnd(){
  var sw=SWIPE.el; SWIPE.el=null; if(!sw||SWIPE.axis!="x") return;
  sw.classList.remove("drag");
  var row=sw.querySelector(".sub"), w=sw.offsetWidth;
  if(SWIPE.dx < -w*.5){
    row.style.transform="translateX(-100%)"; SWIPE.open=null;
    var k=sw.dataset.sw.split(":");
    setTimeout(function(){ removeRow(k[0],k.slice(1).join(":")); render({keepScroll:true}); },180);
  } else if(SWIPE.dx < -40){ row.style.transform="translateX(-88px)"; SWIPE.open=sw; }
  else { row.style.transform=""; if(SWIPE.open===sw) SWIPE.open=null; }
}
document.addEventListener("pointerup", swEnd);
document.addEventListener("pointercancel", swEnd);
/* The click that ends a drag, or a tap on a row whose Delete is showing,
   just closes it. */
document.addEventListener("click", function(e){
  var sw=e.target.closest(".sw");
  if(SWIPE.moved){ SWIPE.moved=false; if(sw){ e.stopPropagation(); e.preventDefault(); } return; }
  if(sw&&SWIPE.open===sw&&!e.target.closest(".sw-act")){ e.stopPropagation(); e.preventDefault(); swClose(null); }
}, true);

function refreshBar(){
  var p=bar.querySelector('button.primary[data-act=pdfrec]'); if(p) p.disabled=!(S.r.verified&&S.r.result);
  var n=bar.querySelector('[data-act=isend]'); if(n) n.disabled=missing().length>0;
}

/* ---------- boot ----------
   #k=…    → a welder opened their Weld Ticket (#new=, the older kind).
   #f=…    → a Finished Ticket (#t=, the older kind). File it if this
             is where the records are; otherwise say where it goes.
   neither → the console, or first-run setup. */
(function(){
  loadPdfLib().catch(function(){});
  carryOver();
  if(/[?&]u=\d/.test(location.search)) history.replaceState(null,"",location.pathname+location.hash);
  var hk=location.hash.match(/[#&](k|new)=([A-Za-z0-9\-_]+)/);
  if(hk){ (hk[1]=="k" ? unpackLink(hk[2]) : Promise.resolve(dec(hk[2]))).then(welderBoot,function(){ welderBoot(null); }); return; }
  if(isReturn(location.hash)){
    var link=location.href;
    history.replaceState(null,"",location.pathname);
    if(setUp()){ takeReturn(link).then(function(ok){ if(!ok) render(); }); return; }
    S.landed={ link:link }; S.screen="landed"; render(); return;
  }
  if(!setUp()){ S.screen="onboard"; S.draft={code:"AWS D1.1:2025"}; render(); return; }
  if(!raw.get(ns("starters"))) addStarters(); else fixStarters();
  myKeys().catch(function(){});
  setTimeout(checkForUpdate,1500);
  fillLogoColors();
  render();
})();
</script>
