function startIntake(pre,preview,wps){
  S.w=blankW(); S.r=blankR(); S.step=0; S.preview=!!preview; S.wps=wps||null;
  if(pre){ if(pre.companyId){S.w.companyId=pre.companyId;} if(pre.company||pre.companyLabel){S.w.company=pre.company||pre.companyLabel;}
    if(pre.name)S.w.name=pre.name; if(pre.wpsId)S.w.wpsId=pre.wpsId; if(pre.wps||pre.wpsLabel)S.w.wps=pre.wps||pre.wpsLabel;
    if(pre.position){ S.w.position=pre.position; if(/F$/.test(pre.position))S.w.weldType="fillet"; if(["5G","6G","2G+5G"].indexOf(pre.position)>-1)S.w.product="pipe"; }
    if(pre.process)S.w.process=pre.process; }
  if(pre&&pre.positions&&pre.positions.length){ S.w.positions=pre.positions.slice(); S.w.position=pre.positions[0]; if(/F$/.test(S.w.position))S.w.weldType="fillet"; }
  S.lockedPos=!!(pre&&pre.position);
  if(wps) prefillFromWps(wps);
  if(pre&&pre.position){ S.w.position=pre.position; if(/F$/.test(pre.position))S.w.weldType="fillet"; }
  S.stack=[]; S.screen="intake"; render();
}
/* Only pre-pick what the form has a tile for; anything else stays a
   blank the welder fills. The card still shows the full WPS. */
function prefillFromWps(p){
  var w=S.w;
  if(p.process) w.process=p.process;
  if(p.transfer) w.transfer=p.transfer;
  var fl=FILLERS[w.process]||[], gs=GASES[w.process]||[];
  if(p.filler){ if(fl.indexOf(p.filler)>-1) w.filler=p.filler; else { w.filler="Other"; w.fillerOther=p.filler; } }
  // A WPS may give a range (".045\" to 1/16\"", "30–40"); then the welder picks the one they pulled.
  if(p.fillerDia && (DIAMS[w.process]||[]).some(function(d){return d.v==p.fillerDia})) w.fillerDia=p.fillerDia;
  if(gs[0]=="None") w.gas="None";
  else if(p.gas){ if(gs.indexOf(p.gas)>-1) w.gas=p.gas; else { w.gas="Other"; w.gasOther=p.gas; } }
  if(p.flow && FLOWS.some(function(f){return f.v==String(p.flow)})) w.flow=String(p.flow);
  if(p.base) w.base=p.base;
  if(p.weldType) w.weldType = p.weldType=="Fillet" ? "fillet" : "groove";
  if(p.backing) w.backing = p.backing=="No backing" ? "without" : "with";
  if(p.progression) w.progression=p.progression;
  if(!w.wps) w.wps=wpsLabel(p);
  if(!w.wpsId&&p.id) w.wpsId=p.id;
  if(p.code) w.code=p.code;
  if(!w.thickness&&p.starter&&/3\/8/.test(p.title||"")) w.thickness="0.375";
}

/* ---------- the two links ----------
   #new=<ticket>   inspector → welder. Prefill, a snapshot of the WPS,
                   and the shop header, so the welder's phone needs
                   nothing else.
   #t=<answers>    welder → inspector. The ticket id and what they
                   filled in. The ticket id is the record id, so the
                   same link pasted twice opens one record, not two. */
function lean(o){
  var out={}; Object.keys(o||{}).forEach(function(k){
    var v=o[k]; if(k=="_demo"||v===""||v==null||(Array.isArray(v)&&!v.length)) return; out[k]=v; });
  return out;
}
/* The ticket carries the inspector's public key, so the welder's phone
   can seal the finished ticket to it. */
function createTicket(btn){
  var d=S.draft, p=wpsById(d.wpsId);
  var t={ id:token(),
    data:lean({ companyId:d.companyId, company:coName(d.companyId), name:d.name,
                wpsId:d.wpsId, wps:wpsLabel(p), position:d.position, positions:(d.positions||[]).length>1?d.positions:null, process:d.process }),
    wps: p ? Object.assign(lean(p), { brand:lean(Object.assign({}, wpsBrand(p), { logo:"" })) }) : null,
    org: lean({ shop:CFG.shop, city:CFG.city, inspector:CFG.inspector, phone:CFG.phone, code:CFG.code }) };
  if(btn){ btn.disabled=true; btn.textContent="Making the ticket…"; }
  myKeys().then(function(k){ t.pk=k.pub; return packLink(t); }).then(function(code){
    t.link=linkDir()+"ticket.html#k="+code; S.ticket=t; go("ticketlink");
  }).catch(function(e){
    if(btn){ btn.disabled=false; btn.textContent="Create link"; }
    toast("Couldn't make the ticket — "+(e&&e.message||e),{bad:1});
  });
}
function sendIntake(btn){
  if(!S.preview&&S.ticketId) raw.set("wq.sent."+S.ticketId, JSON.stringify(S.w));
  if(btn){ btn.disabled=true; btn.textContent="Locking it up…"; }
  buildReturn().then(function(){ S.screen="sent"; render(); }).catch(function(e){
    if(btn){ btn.disabled=false; btn.textContent="Send to inspector"; }
    var er=document.getElementById("senderr"); if(er){ er.textContent="Couldn't finish the ticket — "+(e&&e.message||e)+". Check your signal and try again."; er.style.display="block"; }
  });
}
function welderBoot(t){
  if(!t||!t.id){ S.screen="closed"; S.draft={title:"This link is cut off",msg:"Part of it didn't come through. Ask the inspector to text it again."}; render(); return; }
  CFG=Object.assign({},CFG,t.org||{});   // for this visit only — never saved
  S.welder=true; S.ticketId=t.id; S.wticket=t;
  var done=null; try{ done=JSON.parse(raw.get("wq.sent."+t.id)||"null"); }catch(e){}
  if(done){ S.w=Object.assign(blankW(),done); S.wps=t.wps||null; buildReturn().then(function(){ S.screen="myticket"; render(); }); return; }
  startIntake(t.data||{}, false, t.wps||null);
}
/* Is there a finished ticket in this text? (#f= sealed, #t= the older
   open kind.) Cheap and sync, so a phone without the key can still tell. */
function isReturn(txt){ return /[#&](f|t)=[A-Za-z0-9\-_]{20,}/.test(String(txt||"")); }
/* Open one: resolves to { tid, w } or null. */
function readReturn(txt){
  var m=String(txt||"").match(/[#&](f|t)=([A-Za-z0-9\-_]+)/);
  if(!m) return Promise.resolve(null);
  var p=m[1]=="f" ? unseal(m[2]).catch(function(){ return "locked"; }) : Promise.resolve(dec(m[2]));
  return p.then(function(d){ return d=="locked" ? d : (d&&d.w&&typeof d.w=="object" ? d : null); });
}
/* Company names as people type them: no case, punctuation or "LLC". */
function coKey(s){ return String(s||"").toLowerCase().replace(/&/g," and ").replace(/\b(llc|inc|co|corp|company|ltd)\b\.?/g,"").replace(/[^a-z0-9]+/g,""); }
/* The company a typed name means, if it's one on file: the same name, or
   one name starting the other ("Weld West" for "Weld West Fabrication"). */
function matchCompany(name){
  var k=coKey(name); if(k.length<3) return null;
  var cs=companies(), hit=cs.filter(function(c){ return coKey(c.name)==k||coKey(c.lhName)==k; })[0];
  if(hit) return hit;
  var near=cs.filter(function(c){ var ck=coKey(c.name); return ck.length>=4&&(ck.indexOf(k)==0||k.indexOf(ck)==0); });
  return near.length==1 ? near[0] : null;
}
/* A welder's link fills in what the inspector already knows: the company
   on file their typed employer means, and their stamp and division from
   their last test with that company. Only on this phone — the welder's
   link never carries the client list. */
function recognize(w){
  var said=[];
  if(!w.companyId&&w.company){ var c=matchCompany(w.company); if(c){ w.companyId=c.id; w.company=c.name; said.push(c.name); } }
  var nk=coKey(w.name);
  var prev=nk ? records().filter(function(r){ return coKey(r.w.name)==nk&&(!w.companyId||r.w.companyId==w.companyId); })
    .sort(function(a,b){ return (b.updated||0)-(a.updated||0); })[0] : null;
  if(prev){
    if(!w.stamp&&prev.w.stamp){ w.stamp=prev.w.stamp; said.push("stamp "+prev.w.stamp); }
    if(!w.division&&prev.w.division) w.division=prev.w.division;
  }
  return said;
}
/* File a welder's answers. Resolves true when it filed (or found) one,
   false when there's no test in the text. */
function takeReturn(txt){
  return readReturn(txt).then(function(d){
    if(!d) return false;
    if(d=="locked"){ toast("That Finished Ticket was locked to a different phone's key. Open it on the phone that sent the Weld Ticket, or import that phone's backup here.",{bad:1}); return true; }
    var base=d.tid?"t"+d.tid:uid(), ps=posList(d.w), many=ps.length>1;
    var ids=many ? ps.map(function(pos){ return base+"-"+pos.replace(/[^A-Za-z0-9]/g,""); }) : [base];
    if(getRow("records",ids[0])){ toast("Already on file — opened it."); openRecord(ids[0]); return true; }
    var w=Object.assign(blankW(),d.w), said=recognize(w);
    delete w.positions;
    (many?ps:[w.position]).forEach(function(pos,n){
      var wn=Object.assign({},w,{ position:pos });
      if(many) wn.group=base;
      putRow("records",{ id:ids[n], w:wn, r:blankR(), status:"Awaiting test", updated:Date.now() });
    });
    toast((many?"Filed "+ps.length+" tests — "+ps.join(" and "):"Filed under Test records")+(said.length?" — matched "+said.join(", "):"")+".");
    S.stack=[]; S.screen="records"; openRecord(ids[0]);
    return true;
  });
}
function authErr(msg){ var e=document.getElementById("autherr"); if(e){ e.textContent=msg; e.style.display="block"; } }
function finishOnboard(){
  var d=S.draft;
  if(!d.shop||!d.inspector){ authErr("The company name and your name are needed for the certificate header."); return; }
  CFG=Object.assign({},CFG,{ shop:d.shop, city:d.city||"", inspector:d.inspector, cert:d.cert||"", code:d.code||"AWS D1.1:2025" });
  saveCfg(); addStarters();
  S.stack=[]; S.screen="home"; S.draft={}; render();
}

function pick(v,group){
  if(group=="tpos"){ S.draft.positions=togglePos(S.draft.positions,v); S.draft.position=S.draft.positions[0]||""; render({keepScroll:true}); return; }
  if(group=="tproc"||group=="wproc"){ S.draft.process=v; render({keepScroll:true}); return; }
  if(group&&group.slice(0,2)=="d:"){
    var k=group.slice(2); S.draft[k]=(S.draft[k]===v?"":v);
    if(k=="filler"){ var sp=fillerSpecFor(S.draft.filler); if(sp) S.draft.fillerSpec=sp; }
    render({keepScroll:true}); return;
  }
  var w=S.w;
  if(group=="w:positions"){ w.positions=togglePos(posList(w),v); w.position=w.positions[0]||""; render({keepScroll:true}); return; }
  if(group&&group.slice(0,2)=="w:"){
    var key=group.slice(2);
    w[key]=v;
    if(key=="weldType"||key=="product"){ w.position=""; w.positions=[]; }
    if(key=="process"){ w.filler=""; w.gas=""; w.transfer=""; w.fillerDia=""; w.flow=""; }
  }
  render({keepScroll:true});
}

/* Setting one coupon field can clear the ones that depended on it, the
   same as tapping a tile on the welder's form. */
function coupled(k,v){
  var w=S.w; w[k]=v;
  if(k=="weldType"||k=="product") w.position="";
  if(k=="process"){ w.filler=""; w.fillerOther=""; w.gas=(GASES[v]||[])[0]=="None"?"None":""; w.transfer=""; w.fillerDia=""; w.flow=""; }
  if(k=="wpsId"){ var p=wpsById(v); w.wps=p?wpsLabel(p):""; if(p&&S.screen=="inspect") prefillFromWps(p); }
  if(k=="companyId"){ var c=getRow("companies",v); if(c) w.company=c.name; }
  if(k=="amps") w.ampsAuto=false;
  if(k=="amps"&&v==="") { w.ampsAuto=true; syncAmps(w); }
  if(k=="wfs"||k=="fillerDia"||k=="process"||k=="wpsId") syncAmps(w);
}
function showAmps(){
  var a=app.querySelector('[data-k="amps"]'), n=document.getElementById("ampnote"), src=document.getElementById("ampsrc");
  if(a&&document.activeElement!==a) a.value=S.w.amps;
  if(n) n.textContent=ampsNote(S.w);
  if(src) src.textContent=S.w.ampsAuto?"≈ from wire speed":"";
}
function onField(e){
  var t=e.target;
  if(t.dataset.ad){ var ap=t.dataset.ad.split(":"); S.draft[ap[0]+ap[1]]=t.value; addrCompose(ap[0]); return; }
  if(t.dataset.k){ coupled(t.dataset.k, t.value); autosave(); if(t.dataset.k=="wfs"||t.dataset.k=="amps") showAmps(); if(S.screen=="intake"&&lastStep()) render({keepScroll:true}); else if(t.tagName=="SELECT") render({keepScroll:true}); else refreshBar(); }
  else if(t.dataset.r){ S.r[t.dataset.r]=(t.type=="checkbox")?t.checked:t.value; autosave(); if(t.type=="checkbox"||t.tagName=="SELECT") render({keepScroll:true}); else refreshBar(); }
  else if(t.dataset.d){ S.draft[t.dataset.d]=t.value; if(t.tagName=="SELECT") render({keepScroll:true}); }
  else if(t.dataset.li){ var lp=t.dataset.li.split(":"); var arr=S.draft[lp[0]]||(S.draft[lp[0]]=[]); (arr[+lp[1]]||(arr[+lp[1]]={}))[lp[2]]=t.value; }
  else if(t.dataset.c){ S.draft[t.dataset.c]=t.value; }
}
/* Safari on iOS fires only "change" for select and checkbox, never "input" */
document.addEventListener("input", function(e){
  var t=e.target; if(t.tagName=="SELECT"||t.type=="checkbox") return;
  if(t.type=="tel") reformat(t,e,fmtPhone);
  else if(/:Zip$/.test(t.dataset.ad||"")) reformat(t,e,fmtZip);
  onField(e);
});
document.addEventListener("change", function(e){
  var t=e.target;
  if(t.id=="inspco"){ var ic=getRow("companies",t.value); if(ic){ S.draft.clientCoId=ic.id; S.draft.client=ic.name; if(ic.contact) S.draft.clientContact=ic.contact; if(ic.phone) S.draft.phone=fmtPhone(ic.phone); render({keepScroll:true}); } return; }
  if(t.id=="logofile"&&t.files&&t.files[0]){ readLogo(t.files[0], function(d){ S.draft.logo=d; render({keepScroll:true}); }); return; }
  if(t.id=="impfile"&&t.files&&t.files[0]){ var fr=new FileReader(); fr.onload=function(){ if(!importBackup(readBackup(fr.result))) document.getElementById("imperr").style.display="block"; }; fr.readAsText(t.files[0]); return; }
  if(t.id=="cologofile"&&t.files&&t.files[0]){ readLogo(t.files[0], function(d){ S.draft.logo=d; logoColor(d).then(function(col){ S.draft.lhLogoColor=col; render({keepScroll:true}); }); }); return; }
  if(t.tagName=="SELECT"||t.type=="checkbox") onField(e);
  else if(S.screen=="inspect"&&t.dataset.k&&/^(amps|volts|wfs|flow|thicknessCustom|pipeOD)$/.test(t.dataset.k)){ var wd2=document.getElementById("wpsdiff"); if(wd2) wd2.innerHTML=wpsDiffCard(); }
  else if(S.screen=="wpsedit"&&t.dataset.d&&/^(amps|volts|wfs|travel|flow|preheat|base|positions|pwhtTemp|filler|fillerDia|gas|angle|rootOpening)$/.test(t.dataset.d)) render({keepScroll:true});
});
/* Shrink a chosen image to a small PNG data URL for the letterhead. */
function readLogo(file, done){
  var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){
    var max=360, sc=Math.min(1, max/Math.max(img.width,img.height));
    var c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); done(c.toDataURL("image/png"));
  };
  img.onerror=function(){ URL.revokeObjectURL(url); toast("Couldn't read that image."); };
  img.src=url;
}
/* Enter on the first-run form presses the button under it */
document.addEventListener("keydown", function(e){
  if(e.key!="Enter" || S.screen!="onboard" || e.target.tagName!="INPUT") return;
  var b=app.querySelector("button.primary"); if(b){ e.preventDefault(); b.click(); }
});
/* ---------- updates ----------
   GitHub tells phones they may keep the page 10 minutes, and a
   home-screen app can sit on its copy longer. On open and whenever the
   app comes back to the front, ask the server (past every cache) which
   version it has; if it's newer, say so once, and Update loads it fresh.
   Never on a welder's ticket — a reload there would lose their answers. */
var updateSeen="";
function checkForUpdate(){
  if(!hosted()||S.welder||S.screen=="intake") return;
  fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(function(r){ return r.ok?r.text():""; }).then(function(html){
    var m=String(html).match(/var VERSION="([^"]+)"/); if(!m) return;
    var live=m[1];
    if(live==VERSION||live==updateSeen||verNum(live)<=verNum(VERSION)) return;
    updateSeen=live;
    toast("A new version of Weld Sync is ready.",{ action:"Update", sticky:true, run:function(){
      flushSave();
      fetch(location.pathname,{cache:"reload"}).catch(function(){}).then(function(){ location.replace(location.pathname+"?u="+Date.now()); });
    } });
  }).catch(function(){});
}
/* "2026-11-21.11" → a number that orders correctly (.11 after .9). */
function verNum(v){ var m=String(v).match(/^(\d+)-(\d+)-(\d+)\.(\d+)$/); return m ? ((+m[1]*100+ +m[2])*100+ +m[3])*1000+ +m[4] : 0; }
document.addEventListener("visibilitychange",function(){ if(document.visibilityState=="visible") checkForUpdate(); });

/* ---------- swipe to delete ----------
   Drag a row left: past halfway it deletes, a shorter drag leaves the
   Delete button showing. Vertical drags scroll as normal (touch-action:
   pan-y hands only sideways moves to us). A drag never counts as a tap. */
var SWIPE={ el:null, open:null, x0:0, y0:0, dx:0, axis:null, base:0, moved:false };
function swClose(except){ if(SWIPE.open&&SWIPE.open!==except){ SWIPE.open.firstElementChild.nextElementSibling.style.transform=""; SWIPE.open=null; } }
document.addEventListener("pointerdown", function(e){
  var sw=e.target.closest(".sw");
  if(!sw||e.target.closest(".sw-act")){ if(!sw) swClose(null); return; }
  swClose(sw);
  SWIPE.el=sw; SWIPE.x0=e.clientX; SWIPE.y0=e.clientY; SWIPE.dx=0; SWIPE.axis=null; SWIPE.moved=false;
  SWIPE.base=SWIPE.open===sw?-88:0;
});
document.addEventListener("pointermove", function(e){
  var sw=SWIPE.el; if(!sw) return;
  var dx=e.clientX-SWIPE.x0, dy=e.clientY-SWIPE.y0;
  if(!SWIPE.axis){ if(Math.abs(dx)<8&&Math.abs(dy)<8) return; SWIPE.axis=Math.abs(dx)>Math.abs(dy)?"x":"y"; if(SWIPE.axis=="x") sw.classList.add("drag"); }
  if(SWIPE.axis!="x") return;
  SWIPE.moved=true; SWIPE.dx=Math.min(0,SWIPE.base+dx);
  sw.querySelector(".sub").style.transform="translateX("+SWIPE.dx+"px)";
});
function swEnd(){
  var sw=SWIPE.el; SWIPE.el=null; if(!sw||SWIPE.axis!="x") return;
  sw.classList.remove("drag");
  var row=sw.querySelector(".sub"), w=sw.offsetWidth;
  if(SWIPE.dx < -w*.5){
    row.style.transform="translateX(-100%)"; SWIPE.open=null;
    var k=sw.dataset.sw.split(":");
    setTimeout(function(){ removeRow(k[0],k.slice(1).join(":")); render({keepScroll:true}); },180);
  } else if(SWIPE.dx < -40){ row.style.transform="translateX(-88px)"; SWIPE.open=sw; }
  else { row.style.transform=""; if(SWIPE.open===sw) SWIPE.open=null; }
}
document.addEventListener("pointerup", swEnd);
document.addEventListener("pointercancel", swEnd);
/* The click that ends a drag, or a tap on a row whose Delete is showing,
   just closes it. */
document.addEventListener("click", function(e){
  var sw=e.target.closest(".sw");
  if(SWIPE.moved){ SWIPE.moved=false; if(sw){ e.stopPropagation(); e.preventDefault(); } return; }
  if(sw&&SWIPE.open===sw&&!e.target.closest(".sw-act")){ e.stopPropagation(); e.preventDefault(); swClose(null); }
}, true);

function refreshBar(){
  var p=bar.querySelector('button.primary[data-act=pdfrec]'); if(p) p.disabled=!(S.r.verified&&S.r.result);
  var n=bar.querySelector('[data-act=isend]'); if(n) n.disabled=missing().length>0;
}

/* ---------- boot ----------
   #k=…    → a welder opened their Weld Ticket (#new=, the older kind).
   #f=…    → a Finished Ticket (#t=, the older kind). File it if this
             is where the records are; otherwise say where it goes.
   neither → the console, or first-run setup. */
(function(){
  loadPdfLib().catch(function(){});
  carryOver();
  if(/[?&]u=\d/.test(location.search)) history.replaceState(null,"",location.pathname+location.hash);
  var hk=location.hash.match(/[#&](k|new)=([A-Za-z0-9\-_]+)/);
  if(hk){ (hk[1]=="k" ? unpackLink(hk[2]) : Promise.resolve(dec(hk[2]))).then(welderBoot,function(){ welderBoot(null); }); return; }
  if(isReturn(location.hash)){
    var link=location.href;
    history.replaceState(null,"",location.pathname);
    if(setUp()){ takeReturn(link).then(function(ok){ if(!ok) render(); }); return; }
    S.landed={ link:link }; S.screen="landed"; render(); return;
  }
  if(!setUp()){ S.screen="onboard"; S.draft={code:"AWS D1.1:2025"}; render(); return; }
  if(!raw.get(ns("starters"))) addStarters(); else fixStarters();
  myKeys().catch(function(){});
  setTimeout(checkForUpdate,1500);
  fillLogoColors();
  render();
})();
</script>
