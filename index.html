<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16212B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weld Sync">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Weld Sync</title>
<style>
:root{
  --ink:#16212B; --panel:#1E2B36; --panel2:#263644; --line:#3A4C5C;
  --paper:#E9ECEE; --muted:#93A5B3; --arc:#7FB8FF; --gold:#D8A527;
  --slag:#C0533A; --ok:#57A773; --r:10px;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* The page is a column: a scrolling content area and a footer bar that
   never floats. A fixed bar over a scrolling document drifts and hides
   the bottom of forms on iPhone home-screen apps; this doesn't. */
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#app{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:44rem;margin:0 auto;padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px 40px}

/* nav */
.nav{display:flex;align-items:center;gap:10px;padding:14px 0 6px;min-height:52px}
.nav button{background:none;border:0;color:var(--arc);font:inherit;font-size:.95rem;padding:6px 2px;cursor:pointer}
.nav .title{flex:1;text-align:center;font-size:.95rem;color:var(--muted)}
.nav .spacer{width:56px}

/* ticket header */
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:6px 0 20px;overflow:hidden}
.ticket-top{padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.shop{font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
.ticket h1{font-size:1.45rem;line-height:1.15;margin:2px 0 0;font-weight:650;letter-spacing:-.01em}
.ticket h1 span{display:block;font-weight:400;font-size:.92rem;color:var(--muted);letter-spacing:0;margin-top:6px}
.code-chip{flex:none;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:6px 9px;font-size:.72rem;line-height:1.25;text-align:center}
.perf{height:0;border-top:2px dashed var(--line);position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:1px solid var(--line)}
.perf::before{left:-9px}.perf::after{right:-9px}
.ticket-bottom{padding:12px 18px 16px;font-size:.85rem;color:var(--muted)}

/* home menu */
.menu{display:grid;gap:10px;margin:0 0 22px}
.mi{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--paper);font:inherit;text-align:left;width:100%;cursor:pointer}
.mi .ic{flex:none;width:40px;height:40px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.mi b{display:block;font-size:1.02rem;font-weight:600}
.mi span{color:var(--muted);font-size:.85rem}
.mi .go{margin-left:auto;color:var(--muted)}
.mi.hero{background:linear-gradient(180deg,#24455F,#1E3448);border-color:#3C6789}
.mi.hero .ic{background:rgba(127,184,255,.16)}

/* generic */
h2.step{font-size:1.18rem;margin:0 0 4px;font-weight:600}
p.hint{margin:0 0 18px;color:var(--muted);font-size:.9rem}
.field{margin:0 0 18px}
.field>label{display:block;font-size:.9rem;margin-bottom:7px;color:#C6D2DB}
.req{color:var(--gold)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],select,textarea{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--paper);
  border-radius:8px;padding:13px 12px;font-size:17px;font-family:inherit}
textarea{min-height:76px;resize:vertical}
/* iOS gives a date box a built-in width that won't shrink; in a two-up
   row it pushed into the field beside it. */
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;min-height:50px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--arc);outline-offset:1px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
.tiles.wide{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:12px 8px;font:inherit;font-size:.95rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:54px;justify-content:center;text-align:center}
.tile small{color:var(--muted);font-size:.72rem;line-height:1.2}
.tile[aria-pressed=true]{border-color:var(--arc);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--arc)}
.tile[aria-pressed=true] small{color:#B9D5F5}
.tile .g1{stroke:var(--muted);stroke-width:2;fill:none}
.tile .g2{stroke:var(--arc);stroke-width:3;fill:none;stroke-linecap:round}
.tile[aria-pressed=true] .g1{stroke:#C6D2DB}

.bar{flex:none;background:var(--ink);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .inner{max-width:44rem;margin:0 auto;display:flex;gap:10px}
button.primary{flex:2;background:var(--arc);color:#0D1720;border:0;border-radius:8px;padding:15px;font:inherit;font-weight:650;font-size:17px;cursor:pointer}
button.ghost{flex:1;background:transparent;color:var(--paper);border:1px solid var(--line);border-radius:8px;padding:15px;font:inherit;font-size:17px;cursor:pointer}
button.primary:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card h3{margin:0 0 12px;font-size:1rem;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.flag{border-left:3px solid var(--gold);background:rgba(216,165,39,.08);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.9rem;margin:0 0 16px}
.flag b{color:var(--gold);font-weight:600}
.check{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px;cursor:pointer;font-size:.92rem}
.check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--arc)}
.res{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.seg{display:flex;gap:6px;flex:none}
.seg button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:8px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed=true]{color:#0D1720;font-weight:650}
.seg button.p[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.seg button.f[aria-pressed=true]{background:var(--slag);border-color:var(--slag);color:#fff}
.linkbox{background:#0F1820;border:1px solid var(--line);border-radius:8px;padding:11px;font-size:.72rem;word-break:break-all;color:var(--muted);max-height:90px;overflow:auto;margin-bottom:12px}
.sub{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:14px;font:inherit;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px}
.sub b{display:block;font-size:1rem;font-weight:600}
.sub span{color:var(--muted);font-size:.84rem}
.sub .go{margin-left:auto;color:var(--muted);flex:none}
.pill{font-size:.72rem;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);flex:none}
.pill.ok{color:var(--ok);border-color:rgba(87,167,115,.5)}
.pill.no{color:var(--slag);border-color:rgba(192,83,58,.5)}
.pill.wait{color:var(--gold);border-color:rgba(216,165,39,.5)}
.mini{background:none;border:0;color:var(--arc);font:inherit;font-size:.88rem;padding:6px 0;cursor:pointer;text-decoration:underline}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin:26px 0 0;line-height:1.6}
.err{color:var(--slag);font-size:.85rem;margin-top:6px}
.empty{text-align:center;color:var(--muted);font-size:.92rem;padding:28px 10px}
.rail{display:flex;gap:5px;margin:0 0 22px}
.rail i{flex:1;height:4px;background:var(--line);border-radius:2px}
.rail i.on{background:var(--arc)}.rail i.done{background:#4a6f93}
#toast{display:none;position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:44rem;margin:0 auto;background:var(--panel2);border:1px solid var(--line);color:var(--paper);padding:12px 16px;border-radius:8px;font-size:.9rem;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.4);align-items:center;gap:12px}
#toast.bad{background:var(--slag);border-color:var(--slag);color:#fff}
#toast span{flex:1}
#toast button{background:none;border:0;color:var(--arc);font:inherit;font-weight:650;padding:4px 2px;cursor:pointer}
/* Swipe a row left for Delete, the way Messages and Mail do it. */
.sw{position:relative;overflow:hidden;border-radius:8px;margin-bottom:8px}
.sw>.sub{margin:0;position:relative;z-index:1;touch-action:pan-y;transition:transform .22s ease;will-change:transform}
.sw.drag>.sub{transition:none}
.sw-act{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;justify-content:flex-end;background:var(--slag);border-radius:8px}
.sw-act button{width:88px;background:none;border:0;color:#fff;font:inherit;font-weight:650;font-size:.95rem;cursor:pointer}
.wps-card{border-color:#3C6789;background:linear-gradient(180deg,#22405A,#1E3448)}
.wps-card h3{display:flex;align-items:center;gap:8px}
.wps-card h3 small{font-weight:400;color:var(--muted);font-size:.8rem}
.wps-card .kv dd{color:#EAF2FA}
.code-in{letter-spacing:.35em;text-align:center;font-size:26px!important;font-variant-numeric:tabular-nums}
.signin{margin-top:8vh}
.lhead{display:flex;gap:6px;font-size:.7rem;color:var(--muted);margin-bottom:4px;padding:0 2px}
.lrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.lrow input,.lrow select{padding:8px 6px;font-size:14px;min-width:0;flex:1}
.pdfframe{width:100%;height:calc(100vh - 230px);height:calc(100dvh - 230px);min-height:420px;border:1px solid var(--line);border-radius:8px;background:#fff}
/* The PDF preview: every page drawn to the screen's width, whole page in
   view; zoom widens the pages and the box scrolls both ways. */
.pdfzoom{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
.pdfzoom button{background:var(--panel2);border:1px solid var(--line);color:var(--paper);border-radius:6px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.pdfzoom button[aria-pressed=true]{border-color:var(--arc);color:var(--arc)}
.pdfpages{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:8px;background:#55606b;padding:8px}
.pdfpages canvas{display:block;background:#fff;margin:0 auto 8px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pdfpages canvas:last-child{margin-bottom:0}

</style>
</head>
<body>
<div id="app"><div class="wrap" id="view"></div></div>
<div class="bar" id="bar"></div>
<div id="toast"></div>
<script>
/* =========================================================
   Weld Sync — inspector side + welder ticket links
   One page, no server. The inspector's data lives on this phone.
   A ticket goes out as a link with everything the welder needs in
   it; the welder's answers come back as a link the same way.
   ========================================================= */

var VERSION="2026-11-21.14";

/* ---------- storage ----------
   Everything is in localStorage on this device. Export a backup from
   Settings now and then — there is no other copy. */
var mem={};
var raw={ get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},
          set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},
          del:function(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}} };
function ns(k){ return "wq.local."+k; }
var db={
  get:function(k,d){ try{ var v=JSON.parse(raw.get(ns(k))||"null"); return v===null?d:v; }catch(e){ return d; } },
  set:function(k,v){ raw.set(ns(k), JSON.stringify(v)); }
};
function hosted(){ return /^https?:/.test(location.origin||""); }
function linkBase(){ return hosted() ? location.origin+location.pathname : ""; }
/* The folder the app is served from; the two link pages sit beside it. */
function linkDir(){ return hosted() ? location.origin+location.pathname.replace(/[^\/]*$/,"") : ""; }

/* ---------- the link codec ----------
   A link carries its data after the #, which never leaves the phone that
   opens it (browsers don't send it to the server). Both links are
   deflated so they run about half as long. The finished ticket is also
   sealed to the inspector's key: ECDH P-256 with a one-time key from the
   welder's phone, AES-GCM over the data. Only the inspector's phone —
   or a backup of it — can open it. */
function b64u(u8){ var s=""; for(var i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(str){ var b=String(str).replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="="; var r=atob(b), u=new Uint8Array(r.length); for(var i=0;i<r.length;i++) u[i]=r.charCodeAt(i); return u; }
function joinBytes(list){ var n=0; list.forEach(function(a){ n+=a.length; }); var u=new Uint8Array(n), o=0; list.forEach(function(a){ u.set(a,o); o+=a.length; }); return u; }
/* Older phones (iOS before 16.4) lack the built-in compressor; they get
   pako from the CDN instead. */
var pakoLoading=null;
function loadPako(){
  if(window.pako) return Promise.resolve(window.pako);
  if(pakoLoading) return pakoLoading;
  pakoLoading=new Promise(function(ok,no){ var sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js";
    sc.onload=function(){ ok(window.pako); }; sc.onerror=function(){ pakoLoading=null; no(new Error("pako")); }; document.head.appendChild(sc); });
  return pakoLoading;
}
function streamThrough(u8,ts){ var w=ts.writable.getWriter(); w.write(u8); w.close(); return new Response(ts.readable).arrayBuffer().then(function(b){ return new Uint8Array(b); }); }
function deflate(str){
  var u8=new TextEncoder().encode(str);
  if(window.CompressionStream){ try{ return streamThrough(u8,new CompressionStream("deflate-raw")); }catch(e){} }
  return loadPako().then(function(pk){ return pk.deflateRaw(u8); });
}
function inflate(u8){
  var done=function(b){ return new TextDecoder().decode(b); };
  if(window.DecompressionStream){ try{ return streamThrough(u8,new DecompressionStream("deflate-raw")).then(done); }catch(e){} }
  return loadPako().then(function(pk){ return done(pk.inflateRaw(u8)); });
}
function packLink(obj){ return deflate(JSON.stringify(obj)).then(b64u); }
function unpackLink(str){ return Promise.resolve().then(function(){ return inflate(unb64u(str)); }).then(JSON.parse); }

/* The inspector's key pair, made once and kept with the data (and in
   backups). Older pairs are kept too, so a backup restored over a newer
   phone still opens tickets sealed to either. */
var EC={ name:"ECDH", namedCurve:"P-256" };
function keyRing(){ try{ return JSON.parse(raw.get(ns("keys"))||"[]"); }catch(e){ return []; } }
var keysReady=null;
function myKeys(){
  if(keysReady) return keysReady;
  var ring=keyRing();
  keysReady = ring.length ? Promise.resolve(ring[0]) : crypto.subtle.generateKey(EC,true,["deriveKey"]).then(function(kp){
    return Promise.all([crypto.subtle.exportKey("raw",kp.publicKey),crypto.subtle.exportKey("jwk",kp.privateKey)]);
  }).then(function(x){
    var k={ pub:b64u(new Uint8Array(x[0])), priv:x[1], made:Date.now() };
    raw.set(ns("keys"),JSON.stringify([k].concat(keyRing()))); return k;
  });
  keysReady.catch(function(){ keysReady=null; });
  return keysReady;
}
function aesFrom(priv,pubRaw){
  return crypto.subtle.importKey("raw",pubRaw,EC,false,[]).then(function(pub){
    return crypto.subtle.deriveKey({name:"ECDH",public:pub},priv,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  });
}
function seal(obj,pubB64){
  var eph, ephRaw, iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.generateKey(EC,true,["deriveKey"]).then(function(kp){ eph=kp; return crypto.subtle.exportKey("raw",kp.publicKey); })
    .then(function(r){ ephRaw=new Uint8Array(r); return aesFrom(eph.privateKey,unb64u(pubB64)); })
    .then(function(key){ return deflate(JSON.stringify(obj)).then(function(z){ return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,z); }); })
    .then(function(ct){ return b64u(joinBytes([ephRaw,iv,new Uint8Array(ct)])); });
}
function unseal(str){
  var u=unb64u(str), ephRaw=u.slice(0,65), iv=u.slice(65,77), ct=u.slice(77);
  var ring=keyRing();
  function tryKey(n){
    if(n>=ring.length) return Promise.reject(new Error("no key opens it"));
    return crypto.subtle.importKey("jwk",ring[n].priv,EC,false,["deriveKey"])
      .then(function(priv){ return aesFrom(priv,ephRaw); })
      .then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct); })
      .catch(function(){ return tryKey(n+1); });
  }
  return tryKey(0).then(function(z){ return inflate(new Uint8Array(z)); }).then(JSON.parse);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function token(){ var a=new Uint8Array(12); (window.crypto||window.msCrypto).getRandomValues(a);
  var s=""; for(var i=0;i<a.length;i++) s+=(a[i]%36).toString(36); return s; }
/* Opened from the home screen, not a browser tab. On an iPhone the two
   keep separate storage, so a link tapped in Messages lands in Safari
   where none of the inspector's records are. */
function standalone(){ return !!(navigator.standalone || (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)); }

/* ---------- settings ---------- */
var CFG = Object.assign({ shop:"", city:"", address:"", phone:"", logo:"", inspector:"", cert:"", code:"AWS D1.1:2025" }, db.get("cfg",{}));
/* The editions the app knows. The clause numbers on the printed WPQR
   come from CLAUSES, keyed by the year in this string. */
var EDITIONS=["AWS D1.1:2020","AWS D1.1:2025","AWS D1.3:2018","AWS D1.4:2018"];
/* Only D1.1 ranges are drafted. Other codes print blank ranges the
   inspector fills from the book — never a D1.1 number on a D1.3 form. */
function isD11(code){ return /D1\.1/.test(code||CFG.code||""); }
function recCode(w){ return (w&&w.code)||CFG.code; }
function editionSelect(attr,cur){
  var list=EDITIONS.indexOf(cur)>-1||!cur ? EDITIONS : EDITIONS.concat([cur]);
  return '<select '+attr+'>'+list.map(function(e){return '<option '+(e==cur?"selected":"")+'>'+esc(e)+'</option>';}).join("")+'</select>';
}
function saveCfg(){ db.set("cfg",CFG); }
function setUp(){ return !!CFG.shop; }

/* The signed-in version kept a mirror of the account on the phone,
   under wq.<org id>.*. The first time this version opens, carry that
   mirror over so nothing on the phone is left behind. */
function carryOver(){
  if(raw.get(ns("cfg"))) return;
  var org=null, keys=[];
  try{ for(var i=0;i<localStorage.length;i++) keys.push(localStorage.key(i)); }catch(e){ return; }
  keys.forEach(function(k){
    var m=k.match(/^wq\.profile\.(.+)$/); if(!m||org) return;
    try{ var c=JSON.parse(raw.get(k)); if(c&&c.org){ org=c.org;
      CFG={ shop:org.name||"", city:org.city||"", address:org.address||"", phone:org.phone||"", logo:org.logo||"",
            code:org.code||"AWS D1.1:2025", inspector:(c.profile&&c.profile.name)||"", cert:(c.profile&&c.profile.cert)||"" }; } }catch(e){}
  });
  if(!org) return;
  TABLES.forEach(function(t){
    var v=raw.get("wq."+org.id+"."+t); if(v) raw.set(ns(t), v);
  });
  saveCfg();
}

/* ---------- whose letterhead ----------
   Every PDF prints under a brand: the org's (the inspection company),
   or, for a client who wants their records in their own binder, that
   client's. Branding sits on the company row; a record or a WPS says
   which one to use. The certification block always names the org as
   the tester, whichever letterhead is on top. */
var BRAND_RED="#C8102E";
function orgBrand(){ return { name:CFG.shop, address:CFG.address||CFG.city, phone:prPhone(CFG.phone), logo:CFG.logo, color:BRAND_RED, own:true }; }
/* A client's name prints in the color they picked, else the main color
   of their logo, else black — never the inspection company's red. */
/* The color box used to start on the inspection company's red, so a
   saved red that is exactly that default was never really picked. */
function pickedColor(c){ var v=String(c.lhColor||""); return v&&v.toLowerCase()!=BRAND_RED.toLowerCase() ? v : ""; }
function companyColor(c){ return pickedColor(c) || c.lhLogoColor || "#000000"; }

/* The main color in a logo: the commonest saturated color, ignoring
   white, black and greys. "" when the logo has hardly any color. */
function logoColor(dataUrl){
  return new Promise(function(ok){
    if(!dataUrl){ ok(""); return; }
    var img=new Image();
    img.onload=function(){
      var n=64, sc=Math.min(1,n/Math.max(img.width,img.height)), cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
      var cx=cv.getContext("2d"); cx.drawImage(img,0,0,cv.width,cv.height);
      var px=cx.getImageData(0,0,cv.width,cv.height).data, ink=0, bins={};
      for(var i=0;i<px.length;i+=4){
        var r=px[i],g=px[i+1],b=px[i+2],a=px[i+3]; if(a<128) continue;
        var mx=Math.max(r,g,b), mn=Math.min(r,g,b); if(mx>240&&mn>240) continue;   // paper
        ink++;
        if(mx<40||(mx-mn)<40) continue;                                            // black, grey
        var k=(r>>5)+","+(g>>5)+","+(b>>5), e=bins[k]||(bins[k]={n:0,r:0,g:0,b:0}); e.n++; e.r+=r; e.g+=g; e.b+=b;
      }
      var best=null; Object.keys(bins).forEach(function(k){ if(!best||bins[k].n>best.n) best=bins[k]; });
      if(!best||best.n<Math.max(4,ink*.04)){ ok(""); return; }
      var hx=function(v){ v=Math.round(v/best.n); return (v<16?"0":"")+v.toString(16); };
      ok(("#"+hx(best.r)+hx(best.g)+hx(best.b)).toUpperCase());
    };
    img.onerror=function(){ ok(""); };
    img.src=dataUrl;
  });
}

/* Phone numbers the way the shop writes them: 801-555-0142, a leading 1
   dropped, anything past ten digits as an extension. */
function fmtPhone(v){
  var d=String(v||"").replace(/\D/g,""); if(d.length==11&&d.charAt(0)=="1") d=d.slice(1);
  var x=""; if(d.length>10){ x=" x"+d.slice(10); d=d.slice(0,10); }
  if(d.length<4) return d+x;
  if(d.length<7) return d.slice(0,3)+"-"+d.slice(3)+x;
  return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6)+x;
}
/* For printing a phone typed before the formatting existed: only a value
   that is clearly a number gets reshaped; "see office" prints as typed. */
function prPhone(v){ var t=String(v||""), n=t.replace(/\D/g,"").length; return n>=10&&!/[a-wyz]/i.test(t.replace(/ext/i,"")) ? fmtPhone(t) : t; }

/* Reformat a field as it's typed and put the caret back after the same
   number of digits. Backspacing over a dash deletes the digit before it,
   or the dash would just come back. */
function reformat(t,e,fn){
  var old=t.dataset.prev||"", v=t.value, pos=t.selectionStart==null?v.length:t.selectionStart;
  if(e&&e.inputType=="deleteContentBackward"&&v.replace(/\D/g,"")==old.replace(/\D/g,"")&&v.length<old.length){
    var before=v.slice(0,pos).replace(/\D/g,"").length;
    var digits=v.replace(/\D/g,""); digits=digits.slice(0,Math.max(0,before-1))+digits.slice(before);
    v=digits; pos=Math.max(0,before-1);
  } else pos=v.slice(0,pos).replace(/\D/g,"").length;
  var out=fn(v); t.value=out; t.dataset.prev=out;
  var i=0, seen=0; while(i<out.length&&seen<pos){ if(/\d/.test(out.charAt(i))) seen++; i++; }
  try{ if(document.activeElement===t) t.setSelectionRange(i,i); }catch(er){}
}

/* ---------- addresses ----------
   Street, city, state and ZIP as their own fields; the one-line forms the
   PDFs print are put together from them: "1680 W 1600 S, Springville,
   UT 84663". Each address block names where its parts live (a prefix on

var STATES=["AL","AK","AZ","AR","CA","CO","CT","DE","DC","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];

function cityStateZip(c,st,z){ return [c,[st,z].filter(Boolean).join(" ")].filter(Boolean).join(", "); }
/* Best-effort split of "1680 W 1600 S - Springville Utah 84663" or
   "Street, City, ST ZIP" into parts. */
function parseAddress(str){
  var out={Street:"",City:"",State:"",Zip:""}, t=String(str||"").trim(); if(!t) return out;
  var z=t.match(/\b(\d{5})(?:-(\d{4}))?\s*$/); if(z){ out.Zip=z[1]+(z[2]?"-"+z[2]:""); t=t.slice(0,z.index).trim().replace(/,$/,""); }
  var low=t.toLowerCase(), names=Object.keys(STATE_NAMES).sort(function(a,b){return b.length-a.length});
  for(var i=0;i<names.length;i++){ var n=names[i]; if(low.slice(-n.length)==n&&(low.length==n.length||/[\s,]/.test(low.charAt(low.length-n.length-1)))){ out.State=STATE_NAMES[n]; t=t.slice(0,t.length-n.length).trim(); break; } }
  if(!out.State){ var m=t.match(/[\s,]([A-Za-z]{2})$/); if(m&&STATES.indexOf(m[1].toUpperCase())>-1){ out.State=m[1].toUpperCase(); t=t.slice(0,m.index).trim(); } }
  t=t.replace(/[,\-–]\s*$/,"").trim();
  var parts=t.split(/\s*(?:,|\s[-–]\s)\s*/).filter(Boolean);
  if(parts.length>=2){ out.City=parts.pop(); out.Street=parts.join(", "); }
  else if(out.State&&!/\d/.test(t)) out.City=t; else out.Street=t;
  return out;
}

  else { parts=parseAddress(d[cf.line]||""); if(cf.cityLine&&!parts.City&&d[cf.cityLine]){ var c=parseAddress(d[cf.cityLine]); parts.City=c.City||c.Street; parts.State=parts.State||c.State; } }

/* A ticket can cover more than one plate: 3G and 4G is the usual pair.
   w.positions holds them on the welder's side; each becomes its own
   record when the Finished Ticket comes in. w.position stays the first,
   so everything that reads one position keeps working. */
function posList(w){ return w.positions&&w.positions.length ? w.positions.slice() : (w.position?[w.position]:[]); }

/* Tap a position to add it or take it off. A combined tile ("3G+4G" —
   both plates on one record) stands alone. */
function togglePos(list,v){
  list=(list||[]).slice();
  if(!v) return [];
  if(/\+/.test(v)) return list.indexOf(v)>-1 ? [] : [v];
  list=list.filter(function(x){ return !/\+/.test(x); });
  var i=list.indexOf(v); if(i>-1) list.splice(i,1); else list.push(v);
  var order=["1G","2G","3G","4G","5G","6G","1F","2F","3F","4F"];
  return list.sort(function(a,b){ return order.indexOf(a)-order.indexOf(b); });
}
function isVertical(pos){ return /3G|5G|6G|3F/.test(pos||""); }

function dec(s){ try{ var b=s.replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4)b+="="; return JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){ return null; } }
function frac(n){
  if(n==null||n===""||(typeof n=="number"&&isNaN(n)))return ""; var v=parseFloat(n); if(isNaN(v))return String(n);
  var map=[[0.0625,'1/16'],[0.125,'1/8'],[0.1875,'3/16'],[0.25,'1/4'],[0.3125,'5/16'],[0.375,'3/8'],[0.4375,'7/16'],[0.5,'1/2'],[0.625,'5/8'],[0.75,'3/4'],[0.875,'7/8']];
  var w=Math.floor(v), rem=+(v-w).toFixed(4), best=null;
  for(var i=0;i<map.length;i++) if(Math.abs(map[i][0]-rem)<0.002) best=map[i][1];
  if(rem===0) return w+'"';
  if(best) return (w?w+" ":"")+best+'"';

function tVal(w){
  var t=w.thickness=="custom"?parseFloat(w.thicknessCustom):parseFloat(w.thickness);
  return isNaN(t)&&w.product=="pipe" ? parseFloat(w.pipeWall) : t;
}

/* ---------- qualified range drafts ----------
   Everything here is a draft the inspector edits and verifies against
   the code book; nothing prints without the checkbox. */
var POS_MAP={ "groove-plate":{"1G":"F","2G":"F, H","3G":"F, H, V","4G":"F, OH","3G+4G":"F, H, V, OH (all)"},
  "groove-pipe":{"1G":"F","2G":"F, H","5G":"F, V, OH","6G":"F, H, V, OH (all)","2G+5G":"F, H, V, OH (all)"},
  "fillet":{"1F":"F","2F":"F, H","3F":"F, H, V","4F":"F, H, OH","3F+4F":"F, H, V, OH (all)"} };
/* Fillet positions a groove test qualifies (D1.1 Table 6.10). */
var FILLET_FROM_GROOVE={ "1G":"F","2G":"F, H","3G":"F, H, V","4G":"F, H, OH","3G+4G":"F, H, V, OH (all)",
  "5G":"F, V, OH","6G":"F, H, V, OH (all)","2G+5G":"F, H, V, OH (all)" };
/* D1.1 base metal groups (Table 5.3) and filler specs, for the record's
   base-metals table and filler rows. Anything not listed prints blank. */
var METAL_GROUP={ "A36":"I","A572 Gr. 50":"II","A992":"II","A500 Gr. B/C":"I / II","A1011":"I" };
var FILLER_SPEC={ "E6010":"A5.1","E6011":"A5.1","E7018":"A5.1","E7018-H4R":"A5.1","E308L-16":"A5.4",
  "ER70S-2":"A5.18","ER70S-3":"A5.18","ER70S-6":"A5.18","ER308LSi":"A5.9","ER308L":"A5.9","ER316L":"A5.9",
  "E71T-1C":"A5.20","E71T-9C":"A5.20","E70T-1":"A5.20","E71T-11":"A5.20","E71T-8":"A5.20","E70T-4":"A5.20","E81T1-Ni1":"A5.29" };
/* The AWS filler spec (the "book") for a classification: the table above,
   else the classification's own pattern. Typed-in fillers get it too. */
function fillerSpecFor(cls){
  cls=String(cls||"").trim().toUpperCase(); if(!cls) return "";
  if(FILLER_SPEC[cls]) return FILLER_SPEC[cls];
  if(/^E\d{2}T/.test(cls))   return /-(NI|K|B|W|D)\d/.test(cls)||/^E[89]\dT|^E1[01]\dT/.test(cls) ? "A5.29" : "A5.20";  // FCAW: low-alloy vs carbon
  if(/^E3\d{2}[A-Z]{0,3}T/.test(cls)) return "A5.22";   // FCAW stainless (E308LT1-1, E309LMoT…)
  if(/^ER3\d{2}/.test(cls))  return "A5.9";    // GMAW/GTAW stainless
  if(/^ER[67]\dS/.test(cls)) return "A5.18";   // GMAW/GTAW carbon
  if(/^ER[89]\dS|^ER1\d{2}S/.test(cls)) return "A5.28";  // GMAW/GTAW low-alloy
  if(/^E3\d{2}[A-Z]{0,3}-\d/.test(cls)) return "A5.4";    // SMAW stainless (E308L-16, E309LMo-15)
  if(/^E[67]0\d{2}$/.test(cls)) return "A5.1"; // SMAW carbon
  if(/^E[67]0\d{2}-|^E[89]0\d{2}|^E1\d0\d{2}/.test(cls)) return "A5.5";  // SMAW low-alloy
  return "";
}
/* SMAW electrode groups (Table 6.12): a test with a higher F-number
   qualifies the lower ones. */
var F_NUMBER={ "E6010":"F3","E6011":"F3","E7018":"F4","E7018-H4R":"F4","E308L-16":"F5" };
var F_RANGE={ "F1":"F1","F2":"F1, F2","F3":"F1, F2, F3","F4":"F1, F2, F3, F4","F5":"F5" };
function suggest(w){
  var groove=w.weldType!="fillet", pipe=w.product=="pipe";
  if(!isD11(recCode(w))) return { positions:"", filletPositions:"", thickMin:"", thickMax:"", diameter:"", filletThick:"",
    process: w.process||"", backing:"", joints:"", base:"", filler:"", other:true };
  var key = groove ? ("groove-"+w.product) : "fillet";
  var pos=(POS_MAP[key]||{})[w.position]||"";
  var fpos= groove ? (FILLET_FROM_GROOVE[w.position]||"") : pos;
  var t=tVal(w), tMin="", tMax="";
  if(!isNaN(t)&&t>0){ tMin = t<0.125?frac(t):'1/8"'; tMax = t>=1?"Unlimited":frac(t*2); }
  var dia="";
  if(pipe){ var od=parseFloat(w.pipeOD); if(!isNaN(od)) dia = od>=24?"All diameters":frac(od)+" OD and larger — verify"; }
  else dia='24" Min';
  var filler=w.filler=="Other"?w.fillerOther:w.filler, fn=F_NUMBER[filler];
  return { positions:pos, filletPositions:fpos, thickMin:tMin, thickMax:tMax, diameter:dia,
    grooveThick: groove&&tMin ? tMin+" to "+tMax : "",
    filletThick: groove ? (pipe ? "Unlimited" : '1/8" Min') : (tMin ? tMin+" to Unlimited" : ""),
    process: w.process ? w.process+(w.transfer?" ("+w.transfer+")":"") : "",
    backing: groove ? (w.backing=="with" ? "With, or with backgouge" : "With or without") : "N/A",
    joints: groove ? "Groove, fillet, plug, slot (PJP T-, K-, Y- groove)" : "Fillet, plug, slot",
    base: METAL_GROUP[w.base] ? "Any D1.1 qualified base metal" : "",
    filler: fn ? F_RANGE[fn] : fillerRange(filler) };
}
/* What a non-SMAW filler qualifies, written the shop's way: E71T-1C → E7xT-xx. */
function fillerRange(f){
  f=String(f||""); if(!f) return "";
  var m=f.match(/^E(\d)\dT/i); if(m) return "E"+m[1]+"xT-xx";
  return f.replace(/-.*$/,"-X");
}

/* Each frame keeps everything its screen reads, so coming back to a
   half-filled form finds it as it was left. */
var FRAME=["screen","coId","wpsId","recId","step","draft","viewWps","pdf","copySrc"];
function go(screen, opts){
  flushSave();
  var f={}; FRAME.forEach(function(k){ f[k]=S[k]; }); S.stack.push(f);
  S.screen=screen; Object.assign(S,opts||{}); render();
}
function back(){
  flushSave();
  if(S.screen=="pdfview"&&S.pdf&&S.pdf.url) URL.revokeObjectURL(S.pdf.url);
  var p=S.stack.pop(); if(!p){ S.screen="home"; S.draft={}; } else { Object.assign(S,p); }
  if(S.screen=="inspect"&&S.recId){ var rec=getRow("records",S.recId); if(rec){ S.w=Object.assign(blankW(),rec.w); S.r=Object.assign(blankR(),rec.r); } }
  render();
}

var app=document.getElementById("view"), scroller=document.getElementById("app"), bar=document.getElementById("bar");
function render(o){
  var keep = o && o.keepScroll;
  var y = keep ? scroller.scrollTop : 0;
  var v = VIEWS[S.screen] || VIEWS.home;
  var out = v();
  var focused = document.activeElement, aid = focused && focused.dataset ? (focused.dataset.k||focused.dataset.r||focused.dataset.d||focused.dataset.c) : null;
  app.innerHTML = out.body;
  bar.innerHTML = out.bar ? '<div class="inner">'+out.bar+'</div>' : "";
  bar.style.display = out.bar ? "block" : "none";
  if(keep){
    scroller.scrollTop=y;
    if(aid){
      var back = app.querySelector('[data-k="'+aid+'"],[data-r="'+aid+'"],[data-d="'+aid+'"],[data-c="'+aid+'"]');
      if(back && back.focus){ try{ back.focus({preventScroll:true}); if(back.setSelectionRange && back.value) back.setSelectionRange(back.value.length,back.value.length); }catch(e){} }
    }
  } else {
    scroller.scrollTop=0;
  }
}

/* The card a welder sees: what the WPS calls for. Also shown to the
   inspector on the ticket screen so there are no surprises. */
function wpsCard(p, title){
  if(!p) return "";
  var groove=(p.weldType||"CJP groove")!="Fillet";
  var joint=groove ? [p.jointDesig, p.groove, p.angle, p.rootOpening?"root "+p.rootOpening:"", p.backing].filter(Boolean).join(", ")
                   : ["Fillet", p.filletSize].filter(Boolean).join(" ");
  var rows = [
    ["Joint", joint],
    ["Process", p.process ? p.process+(p.transfer?" — "+p.transfer:"") : ""],
    ["Filler", (p.filler||"")+(p.fillerDia?" × "+p.fillerDia:"")],
    ["Gas", p.gas ? p.gas+(p.flow?" @ "+p.flow+" CFH":"") : ""],
    ["Base metal", p.base],
    ["Thickness", p.thickRange],
    ["Positions", [p.positions, p.progression].filter(Boolean).join(" · ")],
    ["Amps / volts", [p.amps, p.volts].filter(Boolean).join(" / ")],
    ["Polarity", p.polarity], ["Preheat", p.preheat], ["Travel", p.travel?p.travel+" ipm":""]
  ].filter(function(r){return r[1]});
  var h='<div class="card wps-card"><h3>'+esc(title||"Weld to this procedure")+' <small>'+esc(wpsLabel(p))+(p.basis?" · "+esc(p.basis):"")+'</small></h3>'
    +(p.title?'<p style="margin:-6px 0 12px;font-size:.9rem;color:#C6D2DB">'+esc(p.title)+'</p>':'')+'<dl class="kv">';
  rows.forEach(function(r){ h+='<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'; });
  h+='</dl><p style="margin:12px 0 0"><button class="mini" data-act="viewwps" data-wps-id="'+esc(p.id||"")+'">See the whole WPS</button></p></div>';
  return h;
}

/* ---------- D1.1 Clause 5: is this prequalified WPS within the rules? ----------
   Table 5.5 (D1.1:2025) lists what a prequalified WPS must state and how
   far the welding variables may range. 5.2.1: a range on the WPS has to
   sit inside the tolerance around one value, so 160–200 A is ±11% about
   180 — wider than the ±10% allowed. The check only speaks when something
   is off, and every finding is advice: the inspector decides. */
var TOL55={ amps:{t:.10,label:"Amperage",item:22}, volts:{t:.15,label:"Voltage",item:23}, wfs:{t:.10,label:"Wire feed speed",item:24},
  travel:{t:.25,label:"Travel speed",item:25} };
function numRange(v){
  var m=String(v||"").replace(/,/g,"").match(/(\d+(?:\.\d+)?)\s*(?:–|—|-|to)\s*(\d+(?:\.\d+)?)/);
  if(m){ var a=+m[1], b=+m[2]; return { lo:Math.min(a,b), hi:Math.max(a,b), dec:/\./.test(m[1]+m[2]) }; }
  var one=String(v||"").match(/^\s*(\d+(?:\.\d+)?)\s*$/); return one ? { lo:+one[1], hi:+one[1], dec:/\./.test(one[1]) } : null;
}
function fmtNum(v,dec){ return dec ? (Math.round(v*10)/10).toString() : String(Math.round(v)); }
/* The widest range Table 5.5 allows about this range's middle, rounded
   inward so it stays inside. */
function tolFix(r,t){
  var mid=(r.lo+r.hi)/2, step=r.dec?.1:1;
  var lo=Math.ceil(mid*(1-t)/step)*step, hi=Math.floor(mid*(1+t)/step)*step;
  return fmtNum(lo,r.dec)+"–"+fmtNum(hi,r.dec);
}
function wireOrGas(proc){ return proc=="GMAW"||proc=="FCAW-G"||proc=="FCAW-S"; }
function wpsChecks(p){
  if(isPqr(p)||p.basis!="Prequalified"||!isD11(p.code||CFG.code)) return [];
  var out=[], proc=p.process, wire=wireOrGas(proc), gas=proc=="GMAW"||proc=="FCAW-G";
  var groove=(p.weldType||"CJP groove")!="Fillet";
  // Ranges, Table 5.5 items 22–26.
  Object.keys(TOL55).forEach(function(k){
    var T=TOL55[k]; if(!wire) return;   // 22–25 apply to SAW, FCAW, GMAW
    var r=numRange(p[k]); if(!r||r.lo==r.hi) return;
    var mid=(r.lo+r.hi)/2, half=(r.hi-r.lo)/2/mid;
    if(half>T.t+1e-9) out.push({ msg:T.label+" "+p[k]+" is ±"+Math.round(half*100)+"% about "+fmtNum(mid,r.dec)+". Table 5.5 ("+T.item+") allows ±"+Math.round(T.t*100)+"%.",
      fix:{ key:k, val:tolFix(r,T.t) } });
  });
  if(gas){ var g=numRange(p.flow);
    if(g&&g.lo!=g.hi&&g.hi>g.lo*2+1e-9) out.push({ msg:"Gas flow "+p.flow+" is wider than Table 5.5 (26) allows: +50% / −25% about one value.", fix:{ key:"flow", val:fmtNum(g.lo,g.dec)+"–"+fmtNum(g.lo*2,g.dec) } }); }
  // What a prequalified WPS has to say, Table 5.5 items 1–21.
  var need=[["process","welding process"],["positions","positions"],["preheat","preheat (category, Table 5.11)"],
    ["filler","filler classification"],["fillerDia","electrode diameter"],["polarity","current and polarity"],["travel","travel speed"],
    ["weldType","weld type"],["pwhtTemp","PWHT (write None if none)"]];
  if(wire) need.push(["amps","amperage"],["volts","voltage"],["wfs","wire feed speed"]);
  if(proc=="GMAW") need.push(["transfer","mode of transfer"]);
  if(gas) need.push(["gas","shielding gas"],["flow","gas flow rate"]);
  if(groove) need.push(["groove","groove type"],["angle","groove angle"],["rootOpening","root opening"]);
  var miss=need.filter(function(n){ return !String(p[n[0]]||"").trim(); }).map(function(n){ return n[1]; });
  if(miss.length) out.push({ msg:"Table 5.5 says a prequalified WPS must state: "+miss.join(", ")+"." });
  if(p.base&&!METAL_GROUP[p.base]) out.push({ msg:"Base metal "+p.base+" must be one listed in Table 5.6 (5.3). Check it's there." });
  // 5.8.1.1 — vertical is uphill, except tubulars.
  var tub=/pipe|tube|tubular|"/i.test(p.diaRange||"")&&!/^plate$/i.test(p.diaRange||"");
  if(p.progression=="Downhill"&&/All|V/.test(p.positions||"")&&!tub) out.push({ msg:"Vertical welding on a prequalified WPS must progress upward (5.8.1.1). Downhill is only for undercut repair, or tubulars.", fix:{ key:"progression", val:"Uphill" } });
  // 5.4.1.2 / 5.4.1.3 — one-sided CJP.
  if((p.weldType||"CJP groove")=="CJP groove"){
    var gouged=p.backgouge&&p.backgouge!="None";
    if(p.backing=="No backing"&&!gouged) out.push({ msg:"A CJP groove welded from one side needs steel backing to be prequalified (5.4.1.2) — or backgouge and backweld." });
    if(p.backing=="With backing"&&p.backingMat&&p.backingMat!="Steel"&&!gouged) out.push({ msg:"Backing other than steel is prequalified only when it's removed and the root is backgouged and backwelded (5.4.1.3)." });
  }
  return out;
}
/* ---------- a test record against its WPS ----------
   A test is run to a WPS; a reading or a coupon detail outside it makes a
   record that doesn't match its own procedure. wpsDiffs() lists every
   place the record leaves the WPS it names. A single value on a
   prequalified WPS carries its Table 5.5 tolerance; a range is taken as
   written. Each difference offers what to do: correct a typo, switch to a
   WPS that covers the record, or keep it as tested (the inspector's call). */
var POS_NEEDS={ "1G":["F"],"2G":["H"],"3G":["V"],"4G":["OH"],"5G":["F","V","OH"],"6G":["F","H","V","OH"],"2G+5G":["F","H","V","OH"],
  "3G+4G":["V","OH"],"1F":["F"],"2F":["H"],"3F":["V"],"4F":["OH"],"3F+4F":["V","OH"] };
/* Inches from "3/4", "1 1/4", ".375" or "1"; Infinity for "unlimited". */
function inchVal(t){
  t=String(t||"").trim().toLowerCase(); if(/unlim/.test(t)) return Infinity;
  var m=t.match(/(\d+)\s+(\d+)\/(\d+)/); if(m) return +m[1]+ +m[2]/ +m[3];
  m=t.match(/(\d+)\/(\d+)/); if(m) return +m[1]/ +m[2];
  m=t.match(/\d*\.?\d+/); return m ? parseFloat(m[0]) : NaN;
}
function inchRange(spec){
  var parts=String(spec||"").split(/\s*(?:\bto\b|–|—)\s*|\s+-\s+/i).filter(Boolean);
  if(parts.length<2) return null;
  var lo=inchVal(parts[0]), hi=inchVal(parts[1]); return isNaN(lo)||isNaN(hi) ? null : {lo:lo,hi:hi};
}
function sameText(a,b){ return String(a||"").replace(/[\s"]/g,"").toLowerCase()==String(b||"").replace(/[\s"]/g,"").toLowerCase(); }
function wpsDiffs(w,p){
  p=p||wpsById(w.wpsId); if(!p) return [];
  var out=[], pre=p.basis=="Prequalified";
  // Machine readings against the WPS's ranges.
  function num(key,label,spec,tol,unit,fixKey){
    var v=parseFloat(w[key]), r=numRange(spec); if(isNaN(v)||!r) return;
    var lo=r.lo, hi=r.hi;
    if(lo==hi&&pre&&tol){ lo=r.lo*(1-tol[0]); hi=r.hi*(1+tol[1]); }
    if(v>=lo-1e-9&&v<=hi+1e-9) return;
    var st=r.dec?.1:1, inLo=Math.ceil(lo/st-1e-9)*st, inHi=Math.floor(hi/st+1e-9)*st;   // rounded inward, so the fix is inside
    var want=lo==hi?fmtNum(lo,r.dec):fmtNum(inLo,r.dec)+"–"+fmtNum(inHi,r.dec), to=fmtNum(v<lo?inLo:inHi,r.dec);
    out.push({ key:key, label:label, have:w[key]+(unit?" "+unit:""), want:want+(unit?" "+unit:""), fix:{ k:fixKey||key, v:to } });
  }
  num("wfs","Wire feed speed",p.wfs,[.10,.10],"ipm");
  // Amps worked out from wire speed follow the wire speed; only amps typed off the meter are judged.
  if(!w.ampsAuto) num("amps","Amperage",p.amps,[.10,.10],"A");
  num("volts","Voltage",p.volts,[.15,.15],"V");
  num("flow","Gas flow",p.flow,[.25,.50],"CFH");
  // What was welded against what the WPS calls for.
  function pick(key,label,want,have,fix){ if(want&&have&&!sameText(want,have)) out.push({ key:key, label:label, have:have, want:want, fix:fix }); }
  pick("process","Process",p.process,w.process);
  var filler=w.filler=="Other"?w.fillerOther:w.filler;
  pick("filler","Filler",p.filler,filler,(FILLERS[w.process]||[]).indexOf(p.filler)>-1?{k:"filler",v:p.filler}:null);
  if(p.fillerDia&&w.fillerDia&&!sameText(p.fillerDia,w.fillerDia)){
    var dr=inchRange(p.fillerDia), dv=inchVal(w.fillerDia);
    if(!(dr&&dv>=dr.lo-1e-6&&dv<=dr.hi+1e-6)) out.push({ key:"fillerDia", label:DIAM_LABEL[w.process]||"Diameter", have:w.fillerDia, want:p.fillerDia,
      fix:(DIAMS[w.process]||[]).some(function(d){return d.v==p.fillerDia}) ? {k:"fillerDia",v:p.fillerDia} : null });
  }
  var gas=w.gas=="Other"?w.gasOther:w.gas;
  if(p.gas&&gas&&gas!="None") pick("gas","Shielding gas",p.gas,gas,(GASES[w.process]||[]).indexOf(p.gas)>-1?{k:"gas",v:p.gas}:null);
  if(p.polarity&&w.polarity&&p.polarity!=w.polarity) out.push({ key:"polarity", label:"Polarity", have:w.polarity, want:p.polarity, fix:{k:"polarity",v:p.polarity} });
  if(w.process=="GMAW"&&p.transfer&&w.transfer&&!sameText(p.transfer,w.transfer)) out.push({ key:"transfer", label:"Transfer mode", have:w.transfer, want:p.transfer, fix:{k:"transfer",v:p.transfer} });
  if(p.base&&w.base&&!sameText(p.base,w.base)) out.push({ key:"base", label:"Base metal", have:w.base, want:p.base });
  var tr=inchRange(p.thickRange), t=tVal(w);
  if(tr&&!isNaN(t)&&(t<tr.lo-1e-6||t>tr.hi+1e-6)) out.push({ key:"thickness", label:"Thickness", have:frac(t), want:p.thickRange });
  if(w.position&&p.positions&&!/all/i.test(p.positions)){
    var has=String(p.positions).toUpperCase().split(/[^A-Z]+/), need=POS_NEEDS[w.position]||[];
    var lack=need.filter(function(x){ return has.indexOf(x)<0; });
    if(lack.length) out.push({ key:"position", label:"Position", have:w.position+" ("+need.join(", ")+")", want:p.positions });
  }
  if(isVertical(w.position)&&p.progression&&w.progression&&p.progression!=w.progression) out.push({ key:"progression", label:"Progression", have:w.progression, want:p.progression, fix:{k:"progression",v:p.progression} });
  if(w.weldType!="fillet"&&p.backing&&w.backing){
    var wb=w.backing=="with"?"With backing":"No backing";
    if((p.backing=="With backing")!=(w.backing=="with")) out.push({ key:"backing", label:"Backing", have:wb, want:p.backing, fix:{k:"backing",v:p.backing=="With backing"?"with":"without"} });
  }
  return out;
}
function diffSig(ds){ return ds.map(function(d){ return d.key+"="+d.have; }).join("|"); }
/* Other WPSs this record fits as it stands. */
function wpsThatFit(w){ return wpsOnly().filter(function(q){ return q.id!=w.wpsId&&!wpsDiffs(w,q).length; }).slice(0,3); }
function wpsDiffCard(){
  var w=S.w, p=wpsById(w.wpsId); if(!p) return "";
  var ds=wpsDiffs(w,p); if(!ds.length) return "";
  if(S.r.wpsAck==diffSig(ds)) return '<p class="foot" style="margin:-4px 0 14px;text-align:left">Kept as tested, outside '+esc(wpsLabel(p))+': '
    +esc(ds.map(function(d){ return d.label.toLowerCase()+" "+d.have; }).join(", "))+'. <button class="mini" data-act="wpsunack">Check again</button></p>';
  var fits=wpsThatFit(w);
  var h='<div class="flag" style="border-color:var(--slag);background:rgba(192,83,58,.1)"><b style="color:#E9876F">Outside '+esc(wpsLabel(p))+'</b>'
    +'<p style="margin:6px 0 8px;font-size:.86rem">This record says it was welded to '+esc(wpsLabel(p))+', but:</p><ul style="margin:0 0 10px;padding-left:18px">';
  ds.forEach(function(d,i){
    h+='<li style="margin:0 0 8px"><b style="color:var(--paper)">'+esc(d.label)+'</b> is '+esc(d.have)+' — the WPS says '+esc(d.want)+'.'
      +(d.fix?'<br><button class="mini" data-act="wpsdifffix" data-i="'+i+'" style="padding:2px 0">It was a typo — set to '+esc(d.fix.v=="with"?"with backing":d.fix.v=="without"?"no backing":d.fix.v)+'</button>':'')+'</li>';
  });
  h+='</ul>';
  if(fits.length) h+='<p style="margin:0 0 6px;font-size:.86rem">Or it was welded to a different WPS:</p>'
    +fits.map(function(q){ return '<button class="mini" data-act="wpsswitch" data-wps-id="'+esc(q.id)+'" style="padding:2px 0;display:block">Switch to '+esc(wpsPick(q))+'</button>'; }).join("");
  h+='<p style="margin:8px 0 0"><button class="mini" data-act="wpsack">Keep it as tested</button> <span style="font-size:.8rem;color:var(--muted)">— the readings stay as entered</span></p></div>';
  // Outline the boxes that are off.
  h+='<style>'+ds.map(function(d){ return '[data-k="'+d.key+'"]'; }).join(",")+'{border-color:var(--slag)!important;box-shadow:inset 0 0 0 1px var(--slag)}</style>';
  return h;
}

function wpsCheckCard(p){
  var c=wpsChecks(p); if(!c.length) return "";
  return '<div class="flag"><b>Not prequalified as written — D1.1 Clause 5</b><ul style="margin:8px 0 0;padding-left:18px">'
    +c.map(function(x,i){ return '<li style="margin:0 0 6px">'+esc(x.msg)+(x.fix?' <button class="mini" data-act="wpsfix" data-i="'+i+'" style="padding:0">Make it '+esc(x.fix.val)+'</button>':'')+'</li>'; }).join("")
    +'</ul></div>';
}

function wireProc(p){ return p=="GMAW"||p=="FCAW-G"||p=="FCAW-S"; }
/* Wire feed speed → amps on a CV machine. Points are [ipm, amps] read
   off typical carbon-steel wire charts at normal stickout (solid ER70S
   on Ar/CO2; E71T-1/-9 dual shield; E71T-8/-11 self-shielded). Brand,
   stickout and gas move it 10–20%, so it is an estimate the inspector
   can overwrite, and the screen says so. */
var AMP_CHART={
  "GMAW":{ '.030"':[[100,50],[200,85],[300,120],[400,145],[500,165]],
           '.035"':[[100,60],[200,115],[300,155],[400,180],[500,200]],
           '.045"':[[100,105],[200,190],[300,250],[400,295],[500,325]],
           '.052"':[[100,130],[200,230],[300,290],[400,330]],
           '1/16"':[[100,170],[200,280],[300,350]] },
  "FCAW-G":{ '.035"':[[200,110],[300,145],[400,170],[500,190]],
           '.045"':[[150,145],[200,170],[250,190],[300,210],[400,245],[500,275]],
           '.052"':[[150,180],[200,215],[300,265],[400,305]],
           '1/16"':[[100,190],[150,240],[200,280],[250,315]],
           '5/64"':[[100,250],[150,310],[200,360]] },
  "FCAW-S":{ '.045"':[[70,90],[100,115],[150,150],[200,175]],
           '.052"':[[70,105],[100,135],[150,170],[200,200]],
           '.068"':[[100,165],[150,210],[200,250],[250,280]],
           '.072"':[[100,175],[150,220],[200,260]],
           '5/64"':[[100,190],[150,235],[200,275]],
           '3/32"':[[100,230],[150,285]] } };
/* Straight-line between chart points; past either end, the nearest
   segment's slope carries on. Rounded to 5 A. null when there's no chart
   for the wire or no usable speed. */
function ampsFromWfs(w){
  var pts=(AMP_CHART[w.process]||{})[w.fillerDia], v=parseFloat(w.wfs);
  if(!pts||isNaN(v)||v<=0) return null;
  var i=1; while(i<pts.length-1&&v>pts[i][0]) i++;
  var a=pts[i-1], b=pts[i], amps=a[1]+(v-a[0])*(b[1]-a[1])/(b[0]-a[0]);
  return Math.max(5,Math.round(amps/5)*5);
}
/* Recompute amps from wire speed unless the inspector typed their own. */
function syncAmps(w){
  if(!wireProc(w.process)) return;
  if(w.amps&&!w.ampsAuto) return;
  var est=ampsFromWfs(w);
  if(est!=null){ w.amps=String(est); w.ampsAuto=true; }
  else if(w.ampsAuto){ w.amps=""; }
}
function ampsNote(w){
  if(!wireProc(w.process)) return "";
  var est=ampsFromWfs(w);
  if(!w.wfs) return "Enter the wire feed speed and the amps fill in.";
  if(est==null) return w.fillerDia ? "No chart for "+w.fillerDia+" "+w.process+" wire — type the amps off the machine." : "Pick the wire diameter in Test coupon and the amps fill in.";
  if(!w.ampsAuto) return "About "+est+" A is typical for "+w.wfs+" ipm. You typed your own.";
  return "About "+est+" A is typical for "+w.wfs+" ipm of "+w.fillerDia+" "+w.process+" wire. Your wire's chart, stickout and gas can move it 10–20% — change it if the meter says different.";
}

/* Pages are drawn with pdf.js, fetched the first time a preview opens.
   Without signal it falls back to the browser's own viewer. */
var PDFJS_SRC="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
var PDFJS_WORKER="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
var pdfjsLoading=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsLoading) return pdfjsLoading;
  pdfjsLoading=new Promise(function(ok,no){ var sc=document.createElement("script"); sc.src=PDFJS_SRC;
    sc.onload=function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; ok(window.pdfjsLib); };
    sc.onerror=function(){ pdfjsLoading=null; no(new Error("pdf.js")); }; document.head.appendChild(sc); });
  return pdfjsLoading;
}
function drawPdfPages(){
  var box=document.getElementById("pdfpages"), v=S.pdf; if(!box||!v) return;
  var z=v.zoom||1, token=v.drawn=(v.drawn||0)+1;
  loadPdfJs().then(function(lib){
    if(!v.bytes) v.bytes=new Uint8Array(v.doc.output("arraybuffer"));
    return lib.getDocument({data:v.bytes.slice()}).promise;
  }).then(function(pdf){
    if(v.drawn!=token||!document.getElementById("pdfpages")) return;
    box.innerHTML="";
    var cssW=(box.clientWidth-16)*z, dpr=Math.min(window.devicePixelRatio||1,3);
    var chain=Promise.resolve();
    for(var n=1;n<=pdf.numPages;n++) (function(n){ chain=chain.then(function(){ return pdf.getPage(n); }).then(function(pg){
      var base=pg.getViewport({scale:1}), sc=cssW/base.width, vp=pg.getViewport({scale:sc*dpr});
      var c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
      c.style.width=Math.floor(cssW)+"px"; c.style.height=Math.floor(base.height*sc)+"px";
      box.appendChild(c);
      return pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    }); })(n);
    return chain;
  }).catch(function(){
    if(!document.getElementById("pdfpages")) return;
    box.innerHTML='<iframe class="pdfframe" src="'+esc(v.url)+'#view=FitH" title="PDF preview"></iframe>';
  });
}
function showPdf(doc,name,title,note){
  var url=URL.createObjectURL(doc.output("blob"));
  go("pdfview",{ pdf:{ doc:doc, name:name, url:url, title:title, note:note, pages:doc.internal.getNumberOfPages() } });
}
function needPdf(){
  if(pdfReady()) return true;
  toast("Still loading the PDF tool — try again in a second."); loadPdfLib().catch(function(){ toast("Couldn't load the PDF tool. Check your signal."); });
  return false;
}

/* ---------- welder intake ---------- */

function stepList(){

function lastStep(){ return S.step==stepList().length-1; }
function previewBar(){

VIEWS.intake = function(){

    + '<div class="shop">'+esc(CFG.shop)+' &nbsp;·&nbsp; '+esc(CFG.city)+'</div>'
    + '<h1>Weld test ticket<span>Fill this out before you strike an arc. It writes your test record for you.</span></h1>'

function fld(label,key,type,ph,req){

}
function stepWelder(){

function stepTest(){
  var w=S.w;
  var h='<h2 class="step">What are you welding?</h2><p class="hint">'+(S.wps?'Your inspector set the procedure. The matching choices are already picked — check them against your coupon.':'Pick what the coupon actually is.')+'</p>';
  h+=wpsCard(S.wps, "Weld to this procedure");

  h+=productField();
  h+='<div class="field"><label>Process <span class="req">*</span></label>'+tiles(PROCESSES,w.process,false,"w:process")+'</div>';
  if(w.process=="GMAW") h+=transferField();
  h+='<div class="field"><label>Base metal</label>'+tiles(BASE_METALS,w.base,false,"w:base")+'</div>';
  h+=thicknessField()+pipeFields();
  if(w.weldType=="groove") h+='<div class="field"><label>Backing</label>'+tiles([{v:"with",d:"With backing"},{v:"without",d:"No backing"}],w.backing,false,"w:backing")+'</div>';

}
function productField(){ return '<div class="field"><label>Plate or pipe <span class="req">*</span></label>'+tiles([{v:"plate",d:""},{v:"pipe",d:"or tube"}],S.w.product,false,"w:product")+'</div>'; }
function transferField(){
  return '<div class="field"><label>Transfer mode <span class="req">*</span></label>'
    +tiles([{v:"Spray"},{v:"Globular"},{v:"Short circuit",d:"GMAW-S"},{v:"Pulsed"}],S.w.transfer,false,"w:transfer")
    +(S.w.transfer=="Short circuit"?'<p class="err">Short circuit needs a qualified WPS — check with the inspector.</p>':'')+'</div>';
}
function thicknessField(){
  var w=S.w, h='<div class="field"><label>'+(w.product=="pipe"?"Wall thickness":"Material thickness")+' <span class="req">*</span></label>'+tiles(THICKNESSES,w.thickness,false,"w:thickness");
  if(w.thickness=="custom") h+='<div style="margin-top:8px"><input type="number" step="0.001" data-k="thicknessCustom" value="'+esc(w.thicknessCustom)+'" placeholder="Decimal inches, e.g. 0.625"></div>';
  return h+'</div>';
}
function pipeFields(){
  var w=S.w; if(w.product!="pipe") return "";

}
/* Uphill or downhill matters on anything vertical, and the record prints
   it. Asked only when the position is vertical and the WPS didn't say. */
function progressionField(){
  var w=S.w; if(!anyVertical(w)) return "";
  if(S.wps&&S.wps.progression) return "";
  return '<div class="field"><label>Vertical progression <span class="req">*</span></label>'
    +tiles([{v:"Uphill",d:"Vertical up"},{v:"Downhill",d:"Vertical down"}],w.progression,false,"w:progression")+'</div>';
}
function positionField(withHeading){
  var w=S.w;

  var h = withHeading ? '' : '<div class="field"><label>Test position <span class="req">*</span></label>';
  h+='<p style="margin:-2px 0 10px;font-size:.86rem;color:var(--muted)">Welding more than one plate? Tap each position — 3G and 4G, say. Each one gets its own record.</p>';
  h+=tiles(list,posList(w),true,"w:positions");

/* The draft range for each position picked. */
function posRanges(w,style){
  var ps=posList(w); if(!ps.length) return "";
  var lines=ps.map(function(pos){ var r=suggest(Object.assign({},w,{position:pos})).positions; return r ? '<b>'+esc(pos)+'</b> typically qualifies '+esc(r) : ""; }).filter(Boolean);
  if(!lines.length) return "";
  return '<div class="flag" style="'+(style||"")+'"><b>Draft range</b> — if you pass: '+lines.join("; ")+'. The inspector confirms it against the code book before signing.</div>';
}
function stepPosition(){
  return '<h2 class="step">Test position</h2><p class="hint">This decides more of what you get qualified for than anything else on this form.</p>'+positionField(true)+progressionField();
}
/* The one middle step when a WPS is attached. Everything the WPS fixes
   is already on the record; this asks only about the coupon itself. */
function stepCoupon(){
  var w=S.w, p=S.wps, locked=S.lockedPos;
  var h='<h2 class="step">Your coupon</h2><p class="hint">The procedure below is set by your inspector. If what\'s on the rack doesn\'t match it, tell them — don\'t guess.</p>';
  h+=wpsCard(p, "Weld to this procedure");
  if(locked) h+='<div class="card"><h3>Test position'+(posList(w).length>1?'s':'')+'</h3><dl class="kv"><dt>'+(posList(w).length>1?'Plates':'Position')+'</dt><dd>'+esc(posList(w).join(" and "))+' · '+esc(w.product)+'</dd></dl>'
    +posRanges(w,"margin:12px 0 0")+'</div>';
  else h+=productField()+positionField(false);
  h+=progressionField();
  if(w.process=="GMAW"&&!(p&&p.transfer)) h+=transferField();
  h+=thicknessField()+pipeFields();
  // Anything the WPS left blank that the record still needs.
  var fl=FILLERS[w.process]||["Other"], gs=GASES[w.process]||["Other"], dia=DIAMS[w.process]||[];
  var gaps='';
  if(!w.process) gaps+='<div class="field"><label>Process <span class="req">*</span></label>'+tiles(PROCESSES,w.process,false,"w:process")+'</div>';
  if(w.process&&!w.filler) gaps+='<div class="field"><label>'+(w.process=="SMAW"?"Electrode":"Filler")+' classification <span class="req">*</span></label>'+tiles(fl,w.filler,false,"w:filler")+'</div>';
  if(w.filler=="Other"&&!w.fillerOther) gaps+='<div class="field"><input type="text" data-k="fillerOther" value="'+esc(w.fillerOther)+'" placeholder="Type the AWS classification"></div>';
  if(dia.length&&!w.fillerDia) gaps+='<div class="field"><label>'+esc(DIAM_LABEL[w.process]||"Filler diameter")+' <span class="req">*</span></label>'+tiles(dia,w.fillerDia,false,"w:fillerDia")+'</div>';
  if(gs[0]!="None"&&!w.gas) gaps+='<div class="field"><label>Shielding gas <span class="req">*</span></label>'+tiles(gs,w.gas,false,"w:gas")+'</div>';
  if(w.gas&&w.gas!="None"&&w.gas!="Other"&&!w.flow) gaps+='<div class="field"><label>Flow rate</label>'+tiles(FLOWS,w.flow,false,"w:flow")+'</div>';
  if(gaps) h+='<div class="card"><h3>What did you pull off the rack?</h3><p style="margin:-6px 0 12px;font-size:.86rem;color:var(--muted)">The WPS leaves these open or gives a range. Pick what is actually on the machine.</p>'+gaps+'</div>';
  h+='<div class="field"><label>Anything the inspector should know</label><textarea data-k="notes" placeholder="Optional">'+esc(w.notes)+'</textarea></div>';
  return h;
}
function stepMachine(){
  var w=S.w, fl=FILLERS[w.process]||["Other"], gs=GASES[w.process]||["Other"];
  var dia=DIAMS[w.process]||[], dlabel=DIAM_LABEL[w.process]||"Filler diameter";
  var h='<h2 class="step">Filler and gas</h2><p class="hint">What you actually pulled off the rack. Tap, don\'t type.</p>';
  h+='<div class="field"><label>'+(w.process=="SMAW"?"Electrode":"Filler")+' classification <span class="req">*</span></label>'+tiles(fl,w.filler,false,"w:filler")+'</div>';
  if(w.filler=="Other") h+='<div class="field"><input type="text" data-k="fillerOther" value="'+esc(w.fillerOther)+'" placeholder="Type the AWS classification"></div>';
  if(dia.length) h+='<div class="field"><label>'+esc(dlabel)+' <span class="req">*</span></label>'+tiles(dia,w.fillerDia,false,"w:fillerDia")+'</div>';
  if(gs[0]!="None"||gs.length>1){
    h+='<div class="field"><label>Shielding gas <span class="req">*</span></label>'+tiles(gs,w.gas,false,"w:gas")+'</div>';
    if(w.gas&&w.gas!="None"&&w.gas!="Other") h+='<div class="field"><label>Flow rate</label>'+tiles(FLOWS,w.flow,false,"w:flow")+'</div>';

function stepReview(){

  h+='<div class="card"><h3>Welder</h3><dl class="kv">'+kv("Name",w.name)+kv("Employer",w.company)+kv("Date",fmtDate(w.date))+kv("Stamp",w.stamp||"To be assigned")+'</dl></div>';
  h+='<div class="card"><h3>Test coupon</h3><dl class="kv">'
    +kv("Type",(w.weldType=="fillet"?"Fillet":"Groove")+" on "+w.product)
    +kv("Process",w.process+(w.transfer?" — "+w.transfer:""))+kv(posList(w).length>1?"Plates":"Position",posList(w).join(" and "))+kv("Base metal",w.base)
    +kv("Thickness",frac(tVal(w)))
    +(w.product=="pipe"&&w.pipeOD?kv("Pipe OD",w.pipeOD+'"'):"")

    +(w.weldType=="groove"?kv("Backing",w.backing=="with"?"With backing":"No backing"):"")+'</dl></div>';
  h+='<div class="card"><h3>Filler and gas</h3><dl class="kv">'

    +kv("Gas",(w.gas=="Other"?(w.gasOther||"Other"):w.gas)+(w.flow?" @ "+w.flow+" CFH":""))
    +kv("WPS",w.wps)+'</dl></div>';
  if(S.wps) h+=wpsCard(S.wps, "Your procedure");
  var m=missing();

function kv(k,v){ return v?'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>':""; }
function missing(){
  var w=S.w,m=[];
  if(!w.name)m.push("name");
  if(!w.process)m.push("process");
  if(w.process=="GMAW"&&!w.transfer)m.push("transfer mode");
  if(!posList(w).length)m.push("position");
  if(anyVertical(w)&&!w.progression)m.push("uphill or downhill");
  if(w.product=="pipe"&&!w.pipeOD)m.push("pipe OD");
  if(!w.thickness||(w.thickness=="custom"&&!w.thicknessCustom))m.push("thickness");
  if(!w.filler)m.push("filler metal");
  if((DIAMS[w.process]||[]).length && !w.fillerDia)m.push((DIAM_LABEL[w.process]||"filler diameter").toLowerCase());
  if((GASES[w.process]||[])[0]!="None" && !w.gas)m.push("shielding gas");
  return m;
}
/* The welder's answers go back the way the ticket came: as a link,
   sealed to the inspector's key when the ticket brought one. Built when
   the welder taps Send (sealing is async), kept in S.returnLink. */
function buildReturn(){
  var payload={ tid:S.ticketId||"", w:S.w }, t=S.wticket||{};
  var pk=t.pk ? Promise.resolve(t.pk) : (S.preview ? myKeys().then(function(k){ return k.pub; }) : Promise.resolve(null));
  return pk.then(function(key){
    return key ? seal(payload,key).then(function(c){ return linkDir()+"done.html#f="+c; })
               : linkBase()+"#t="+enc(payload);
  }).then(function(link){ S.returnLink=link; return link; });
}

/* Plain-text and printed forms of a WPS. */
function wpsText(p){
  var out=[CFG.shop+" — "+wpsLabel(p)+(p.basis?" ("+p.basis+")":""), p.title||""].filter(Boolean);
  wpsSections(p).forEach(function(sc){
    out.push(""); out.push(sc.title.toUpperCase());

/* =========================================================
   The PDFs — WPQR and WPS
   Built here with jsPDF instead of the browser's print dialog. A
   phone's print engine lays the page out at its own width and the
   sheet ran long; here every box goes at a fixed spot on a letter
   page, so it is one page on anything, and the result is a file the
   share sheet can take. Both are laid out like the shop's paper forms.
   ========================================================= */
var PDF_SRC=["https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js",
             "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"];
var pdfLoading=null;
function pdfReady(){ return !!(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable); }
/* Started at boot so the library is in hand by the time a button is
   tapped: iOS only opens the share sheet from inside the tap itself. */
function loadPdfLib(){
  if(pdfReady()) return Promise.resolve();
  if(pdfLoading) return pdfLoading;
  function one(src){ return new Promise(function(ok,no){ var s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=function(){ no(new Error(src)); }; document.head.appendChild(s); }); }
  pdfLoading=one(PDF_SRC[0]).then(function(){ return one(PDF_SRC[1]); }).catch(function(e){ pdfLoading=null; throw e; });
  return pdfLoading;
}
/* Hand the file over: the share sheet on a phone (Files, Messages,
   AirPrint...), a new tab on a desktop, a download if neither works. */
function deliverPdf(d,name){
  var blob=d.output("blob"), mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  var url=URL.createObjectURL(blob);
  function download(){ var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  var file=null; try{ file=new File([blob],name,{type:"application/pdf"}); }catch(e){}
  if(mobile && file && navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file],title:name}).catch(function(e){ if(!/Abort/.test(String(e&&e.name))) download(); });
  else if(mobile) download();
  else if(!window.open(url,"_blank")) download();
  setTimeout(function(){ URL.revokeObjectURL(url); },120000);
}
function pdfName(s){ return String(s||"sheet").replace(/[^\w.-]+/g,"_")+".pdf"; }

/* Acceptance-criteria clause numbers on the results table. Only the
   editions checked against a book are filled in; any other edition
   prints the part reference and the inspector writes the clause in. */
var CLAUSES={ "2020":{ visual:"6.10.1", bendTest:"6.10.3.1 and Fig. 6.8", bend:"6.10.3.3" } };
function clauseRefs(code){ code=code||CFG.code; var y=(String(code).match(/20\d\d/)||[])[0]; return (isD11(code)&&CLAUSES[y])||{ visual:"Clause 6, Part C", bendTest:"Clause 6, Part C", bend:"Clause 6, Part C" }; }
function accept(v){ return v=="Pass"?"Acceptable":v=="Fail"?"Unacceptable":""; }

/* ---- page geometry and drawing helpers (points; letter is 612 x 792) ---- */
var PG={ w:612, h:792, m:28, gap:5 };
function dash(v){ return v===""||v==null?"—":String(v); }
function boxCell(on){ return { content:"", box:!!on }; }
function pdfDoc(){ var d=new window.jspdf.jsPDF({unit:"pt",format:"letter"}); d.setFont("helvetica","normal"); d.setTextColor(0); return d; }
/* One bordered table. o: x, w, y, head (one row), body, col (column
   styles), bold (body columns set bold), center (center the value
   cells), parse (extra per-cell hook). Returns the y under it. */
function grid(d,o){
  var bold=o.bold||[0];
  d.autoTable({ startY:o.y, margin:{left:o.x,right:PG.w-o.x-o.w,top:PG.m,bottom:PG.m}, tableWidth:o.w,
    head:o.head?[o.head]:undefined, body:o.body, theme:"grid", pageBreak:"avoid",
    styles:{ font:"helvetica", fontSize:7, cellPadding:{top:1.4,bottom:1.4,left:3,right:3}, lineColor:0, lineWidth:.5, textColor:0, fillColor:false, overflow:"linebreak", valign:"middle" },
    headStyles:{ fontStyle:"bold", fillColor:false, textColor:0, halign:"center" },
    alternateRowStyles:{ fillColor:false },
    columnStyles:o.col||{},
    didParseCell:function(c){
      var i=c.column.index;
      if(c.section=="head"){ if(i==0) c.cell.styles.halign="left"; }
      else if(bold.indexOf(i)>-1){ c.cell.styles.fontStyle="bold"; c.cell.styles.halign="left"; }
      else c.cell.styles.halign=o.center?"center":"left";
      var own=c.cell.raw&&c.cell.raw.styles; if(own) Object.assign(c.cell.styles,own);   // a cell's own styles win
      if(o.parse) o.parse(c);
    },
    didDrawCell:function(c){
      var raw=c.cell.raw; if(!raw) return;
      if(raw.sketch){ drawJoint(d,raw.sketch,c.cell.x,c.cell.y,c.cell.width,c.cell.height); return; }
      if(raw.box===undefined) return;
      var s=6, cx=c.cell.x+c.cell.width/2-s/2, cy=c.cell.y+c.cell.height/2-s/2;
      d.setLineWidth(.6); d.rect(cx,cy,s,s);
      if(raw.box){ d.setLineWidth(1); d.line(cx+1.2,cy+3.2,cx+2.6,cy+4.8); d.line(cx+2.6,cy+4.8,cx+5,cy+1.4); }
    } });
  return d.lastAutoTable.finalY;
}
function letterhead(d,title,b){
  b=b||orgBrand();
  var W=PG.w-2*PG.m, rgb=hexRgb(b.color);
  d.setFillColor(138,144,150); d.rect(PG.m,PG.m,W,5,"F");

   6.56 pt body, 10.6 pt rows, text sitting on the bottom rule the way a

   specimen set, and everything under it moves down with it. */

/* Printed form of a value: "-" for nothing, inches as "3/8 in", ranges
   as "1/8 in - 3/4 in", the way the shop writes them. */
function pv(v){

  return String(v).replace(/(\d)"/g,"$1 in").replace(/ to /g," - ");
}
function pdate(s){ var p=String(s||"").split("-"); return p.length==3 ? (+p[1])+"/"+(+p[2])+"/"+p[0] : String(s||""); }
/* One ruled table at fixed positions. cols: x of every vertical rule.
   rows: { h, fill, size, mid, cells:[ text | {t, c:span, a:"l"|"c"|"r",
   b:bold, fill, size, gap} ] }. A gap cell draws nothing — it is the
   white space between the "actual" and "qualified" halves. A cell too
   long for its box shrinks a little, then wraps and the row grows.
   Returns the y under the last row. */
function ruled(d,o){
  var cols=o.cols, y=o.y, PAD=1.8;
  o.rows.forEach(function(row){
    var ci=0, cells=[], h=row.h||WQ.ROW;
    row.cells.forEach(function(c){
      if(c===null||typeof c!="object") c={t:c};
      var span=c.c||1; cells.push({c:c, x0:cols[ci], x1:cols[ci+span]}); ci+=span;
    });
    cells.forEach(function(k){
      var c=k.c; if(c.gap) return;
      var fs=c.size||row.size||WQ.FS, txt=c.t==null?"":String(c.t), room=k.x1-k.x0-2*PAD;
      d.setFont("helvetica", c.b||row.b ? "bold" : "normal");
      var widest=function(){ return Math.max.apply(null, txt.split("\n").map(function(x){ return d.setFontSize(fs).getTextWidth(x); })); };
      while(fs>WQ.FS*.8 && widest()>room) fs-=.2;
      d.setFontSize(fs);
      k.fs=fs; k.lines=txt.indexOf("\n")>-1 ? txt.split("\n") : d.splitTextToSize(txt, room);
      h=Math.max(h, k.lines.length*fs*1.15+1.6);
    });

    cells.forEach(function(k){
      var c=k.c; if(c.gap) return;

      var a=c.a||row.a||"l", tx=a=="c"?(k.x0+k.x1)/2:a=="r"?k.x1-PAD:k.x0+PAD;

      var base=row.mid ? y+h/2-(n-1)*lh/2+k.fs*.33 : y+h-1.6-(n-1)*lh;
      k.lines.forEach(function(ln,i){ d.text(ln, tx, base+i*lh, {align:a=="c"?"center":a=="r"?"right":"left"}); });
    });

/* ---- the joint sketch on the WPS ----
   Drawn from the WPS fields, not scanned from the book: groove type,
   angle, root opening, root face, backing and joint type set the
   shape, and the symbols (a, R, f, T) match the paper's sketch. The
   numbers live in the table next to it; the picture is the shape. */
function inches(s){ s=String(s||"").trim(); var m=s.match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+)/); if(m) return +m[1]/+m[2]; m=s.match(/\d+(?:\.\d+)?/); return m?+m[0]:0; }
function degrees(s,fb){ var m=String(s||"").match(/\d+(?:\.\d+)?/); return m?+m[0]:fb; }
function poly(d,pts,close){
  var segs=[]; for(var i=1;i<pts.length;i++) segs.push([pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]]);
  d.lines(segs, pts[0][0], pts[0][1], [1,1], "S", !!close);
}
/* quarter-ish arc as short segments, from angle a0 to a1 (radians) */
function arcPts(cx,cy,r,a0,a1,n){ var out=[]; for(var i=0;i<=n;i++){ var a=a0+(a1-a0)*i/n; out.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); } return out; }
function drawJoint(d,p,cx,cy,cw,ch){
  var fillet=(p.weldType||"CJP groove")=="Fillet", g=p.groove||"Single V", jt=p.jointType||"Butt";
  var T=20, L=50, R=inches(p.rootOpening)>0?6:0, f=inches(p.rootFace)>0?5:0;
  var ang=degrees(p.angle,45), half=Math.tan(ang/2*Math.PI/180), full=Math.tan(Math.min(ang,80)*Math.PI/180);
  var backing=p.backing=="With backing";
  d.setLineWidth(.7); d.setDrawColor(0); d.setTextColor(0); d.setFont("helvetica","italic"); d.setFontSize(6.5);
  var tick=function(x,y0,y1,label){ d.setLineWidth(.4); d.line(x,y0,x,y1); d.line(x-2,y0,x+2,y0); d.line(x-2,y1,x+2,y1); d.text(label,x+3,(y0+y1)/2+2); d.setLineWidth(.7); };
  var sym=function(t,x,y){ if(t=="α"){ d.setFont("symbol","normal"); d.text("a",x,y,{align:"center"}); d.setFont("helvetica","italic"); } else d.text(t,x,y,{align:"center"}); };

  if(fillet || jt=="T" || jt=="Corner" || jt=="Lap" || jt=="Edge"){
    /* a base plate with a member standing on it (T, corner) or lying on it (lap) */
    var bw=Math.min(cw-40, 120), bx=cx+(cw-bw)/2-8, bt=cy+ch-14, bb=bt+T*.75;
    if(jt=="Lap"){
      var ov=bw*.4, y2=bt-T*.75;
      poly(d,[[bx,bt],[bx+bw*.7,bt],[bx+bw*.7,bb],[bx,bb]],true);
      poly(d,[[bx+bw*.7-ov,y2],[bx+bw,y2],[bx+bw,bt],[bx+bw*.7-ov,bt]],true);
      var lg=T*.6; d.setLineWidth(.5);
      poly(d,[[bx+bw*.7,bt],[bx+bw*.7+lg,bt],[bx+bw*.7,bt+lg]],true);              // at the lower plate's end, under the overhang
      poly(d,[[bx+bw*.7-ov,y2],[bx+bw*.7-ov-lg,bt],[bx+bw*.7-ov,bt]],true);        // at the upper plate's end, on the lower plate
      sym("leg",bx+bw*.7-ov-lg-9,bt-3); tick(bx+bw+6,y2,bt,"T"); return;
    }
    if(jt=="Edge"){
      var ex=cx+cw/2-T-8, et=cy+12, eb=cy+ch-10;
      poly(d,[[ex,et+6],[ex+T,et+6],[ex+T,eb],[ex,eb]],true); poly(d,[[ex+T+R,et+6],[ex+2*T+R,et+6],[ex+2*T+R,eb],[ex+T+R,eb]],true);
      d.setLineWidth(.5); poly(d,[[ex+T-4,et+6],[ex+T+R+4,et+6],[ex+T+R/2,et]],true);
      tick(ex+2*T+R+6,et+6,eb,"T"); return;
    }
    var corner=jt=="Corner";
    var mx=corner? bx+bw-T : bx+bw/2-T/2, mtop=cy+10, mb=bt-R;    // member: x, top, bottom
    poly(d,[[bx,bt],[bx+bw,bt],[bx+bw,bb],[bx,bb]],true);
    if(fillet || g=="Square"){
      poly(d,[[mx,mtop],[mx+T,mtop],[mx+T,mb],[mx,mb]],true);
      d.setLineWidth(.5); var leg=T*.8;
      poly(d,[[mx,bt],[mx-leg,bt],[mx,bt-leg]],true);
      if(!corner) poly(d,[[mx+T,bt],[mx+T+leg,bt],[mx+T,bt-leg]],true);
      sym("leg",mx-leg-9,bt-3); d.setLineWidth(.7);
    } else if(/Double/.test(g)){
      var h2=((T-f)/2)/full;
      poly(d,[[mx,mtop],[mx+T,mtop],[mx+T,mb-h2],[mx+T/2+f/2,mb],[mx+T/2-f/2,mb],[mx,mb-h2]],true);
      sym("α",mx-8,mb-h2-3); sym("α",mx+T+8,mb-h2-3);
    } else {
      var h1=(T-f)/full;                                             // single bevel, root face on the far side
      poly(d,[[mx,mtop],[mx+T,mtop],[mx+T,mb],[mx+T-f,mb],[mx,mb-h1]],true);
      sym("α",mx-8,mb-h1-2); if(f) sym("f",mx+T+6,mb-1);
    }
    if(R){ sym("R",mx+T+8,bt+1); }
    tick(mx+T+(corner?6:22),mtop,mb,"T"); tick(bx-6,bt,bb,"T"); return;
  }

  /* butt joint: two plates in line, the groove between them */
  var midX=cx+cw/2-10, top=cy+ch/2-T/2+4, bot=top+T, gapL=midX-R/2, gapR=midX+R/2, xl=gapL-L, xr=gapR+L;
  var leftFace, rightFace;                                           // top-to-bottom along the groove
  var vee=function(x,sgn,tanA,dbl){                                  // face for one plate; sgn -1 left, +1 right
    if(dbl){ var h=(T-f)/2; return [[x+sgn*tanA*h,top],[x,top+h],[x,bot-h],[x+sgn*tanA*h,bot]]; }
    return [[x+sgn*tanA*(T-f),top],[x,bot-f],[x,bot]];
  };
  var uface=function(x,sgn){ var r=Math.min(7,(T-f)/2), wall=Math.tan(8*Math.PI/180)*(T-f-r);
    return [[x+sgn*(r+wall),top]].concat(arcPts(x,bot-f-r,r,sgn>0?0:Math.PI,Math.PI/2,6)).concat([[x,bot]]); };
  var square=function(x){ return [[x,top],[x,bot]]; };
  if(g=="Single V"){ leftFace=vee(gapL,-1,half); rightFace=vee(gapR,1,half); }
  else if(g=="Double V"){ leftFace=vee(gapL,-1,half,1); rightFace=vee(gapR,1,half,1); }
  else if(g=="Single bevel"){ leftFace=square(gapL); rightFace=vee(gapR,1,full); }
  else if(g=="Double bevel"){ leftFace=square(gapL); rightFace=vee(gapR,1,full,1); }
  else if(g=="U"){ leftFace=uface(gapL,-1); rightFace=uface(gapR,1); }
  else if(g=="J"){ leftFace=square(gapL); rightFace=uface(gapR,1); }
  else { leftFace=square(gapL); rightFace=square(gapR); }
  poly(d,[[xl,top]].concat(leftFace).concat([[xl,bot]]),true);
  poly(d,[[xr,top]].concat(rightFace).concat([[xr,bot]]),true);
  if(backing){ poly(d,[[gapL-12,bot],[gapR+12,bot],[gapR+12,bot+6],[gapL-12,bot+6]],true); }
  /* symbols */
  if(g!="Square"){ var ax=(g=="Single bevel"||g=="Double bevel"||g=="J")?gapR+6:midX; sym("α",ax,top-3); }
  if(R){ d.setLineWidth(.4); d.line(gapL,bot+(backing?9:3),gapL,bot+(backing?15:9)); d.line(gapR,bot+(backing?9:3),gapR,bot+(backing?15:9)); d.setLineWidth(.7); sym("R",midX,bot+(backing?21:14)); }
  if(f&&!/Double/.test(g)){ sym("f",gapR+(g=="Single bevel"||g=="J"?-6:4)+8,bot-f/2+2); }
  tick(xr+7,top,bot,"T");
  d.setFont("helvetica","normal");
}

function wpsPdf(p){

  var manual=(p.process=="SMAW"||p.process=="GTAW")?"Manual":"Semiautomatic";
  var backMat=p.backing=="With backing"?(p.backingMat||""):"";
  var gasProc=p.process!="SMAW"&&p.process!="FCAW-S";
  var d=pdfDoc(), x=PG.m, W=PG.w-2*PG.m, half=(W-PG.gap)/2, xr=x+half+PG.gap;
  var b=wpsBrand(p), y=letterhead(d,"Welding Procedure Specification (WPS)",b);

  /* header strip: a value line with its label under it, like the paper */
  y=grid(d,{x:x,w:W,y:y,bold:[],body:[

/* Clipboard, with the old select-and-copy for browsers that refuse the API. */
function copy(t){
  function legacy(){ var ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} ta.remove(); }
  try{ navigator.clipboard.writeText(t).catch(legacy); }catch(e){ legacy(); }
}
/* A file to keep: the share sheet on a phone, a download elsewhere. */
function saveFile(blob,name){
  var file=null; try{ file=new File([blob],name,{type:blob.type}); }catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file],title:name}).catch(function(){}); return; }
  var url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },60000);
}
/* A backup is the JSON file, or the same thing as copied text. */
function readBackup(txt){
  txt=String(txt||"").trim(); if(!txt) return null;
  var d=null; if(txt.charAt(0)=="{"){ try{ d=JSON.parse(txt); }catch(e){} } else d=dec(txt);
  return d&&Array.isArray(d.records) ? d : null;
}
function importBackup(d){
  if(!d) return false;
  if(!setUp()&&d.cfg){ CFG=Object.assign({},CFG,d.cfg); saveCfg(); }
  TABLES.forEach(function(t){ (d[t]||[]).forEach(function(x){ if(x&&x.id) putRow(t,x); }); });
  if(Array.isArray(d.keys)&&d.keys.length){
    var ring=keyRing(), have=ring.map(function(k){ return k.pub; });
    ring=ring.concat(d.keys.filter(function(k){ return k&&k.pub&&have.indexOf(k.pub)<0; }));
    raw.set(ns("keys"),JSON.stringify(ring)); keysReady=null;
  }
  toast("Backup imported — "+d.records.length+" record"+(d.records.length==1?"":"s")+".");
  S.stack=[]; S.screen="home"; S.draft={}; render();
  return true;
}
