<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16212B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weld Sync">

<link rel="icon" href="icon-192.png">

<title>Weld Sync</title>
<style>
:root{
  --ink:#16212B; --panel:#1E2B36; --panel2:#263644; --line:#3A4C5C;
  --paper:#E9ECEE; --muted:#93A5B3; --arc:#7FB8FF; --gold:#D8A527;
  --slag:#C0533A; --ok:#57A773; --r:10px;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* The page is a column: a scrolling content area and a footer bar that
   never floats. A fixed bar over a scrolling document drifts and hides
   the bottom of forms on iPhone home-screen apps; this doesn't. */
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#app{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:44rem;margin:0 auto;padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px 40px}

/* nav */
.nav{display:flex;align-items:center;gap:10px;padding:14px 0 6px;min-height:52px}
.nav button{background:none;border:0;color:var(--arc);font:inherit;font-size:.95rem;padding:6px 2px;cursor:pointer}
.nav .title{flex:1;text-align:center;font-size:.95rem;color:var(--muted)}
.nav .spacer{width:56px}

/* ticket header */
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:6px 0 20px;overflow:hidden}
.ticket-top{padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.shop{font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
.ticket h1{font-size:1.45rem;line-height:1.15;margin:2px 0 0;font-weight:650;letter-spacing:-.01em}
.ticket h1 span{display:block;font-weight:400;font-size:.92rem;color:var(--muted);letter-spacing:0;margin-top:6px}
.code-chip{flex:none;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:6px 9px;font-size:.72rem;line-height:1.25;text-align:center}
.perf{height:0;border-top:2px dashed var(--line);position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:1px solid var(--line)}
.perf::before{left:-9px}.perf::after{right:-9px}
.ticket-bottom{padding:12px 18px 16px;font-size:.85rem;color:var(--muted)}

/* home menu */
.menu{display:grid;gap:10px;margin:0 0 22px}
.mi{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--paper);font:inherit;text-align:left;width:100%;cursor:pointer}
.mi .ic{flex:none;width:40px;height:40px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.mi b{display:block;font-size:1.02rem;font-weight:600}
.mi span{color:var(--muted);font-size:.85rem}
.mi .go{margin-left:auto;color:var(--muted)}
.mi.hero{background:linear-gradient(180deg,#24455F,#1E3448);border-color:#3C6789}
.mi.hero .ic{background:rgba(127,184,255,.16)}

/* generic */
h2.step{font-size:1.18rem;margin:0 0 4px;font-weight:600}
p.hint{margin:0 0 18px;color:var(--muted);font-size:.9rem}
.field{margin:0 0 18px}
.field>label{display:block;font-size:.9rem;margin-bottom:7px;color:#C6D2DB}
.req{color:var(--gold)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],select,textarea{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--paper);
  border-radius:8px;padding:13px 12px;font-size:17px;font-family:inherit}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--arc);outline-offset:1px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.row{display:flex;gap:10px}.row>*{flex:1}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
.tiles.wide{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:12px 8px;font:inherit;font-size:.95rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:54px;justify-content:center;text-align:center}
.tile small{color:var(--muted);font-size:.72rem;line-height:1.2}
.tile[aria-pressed=true]{border-color:var(--arc);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--arc)}
.tile[aria-pressed=true] small{color:#B9D5F5}
.tile .g1{stroke:var(--muted);stroke-width:2;fill:none}
.tile .g2{stroke:var(--arc);stroke-width:3;fill:none;stroke-linecap:round}
.tile[aria-pressed=true] .g1{stroke:#C6D2DB}

.bar{flex:none;background:var(--ink);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .inner{max-width:44rem;margin:0 auto;display:flex;gap:10px}
button.primary{flex:2;background:var(--arc);color:#0D1720;border:0;border-radius:8px;padding:15px;font:inherit;font-weight:650;font-size:17px;cursor:pointer}
button.ghost{flex:1;background:transparent;color:var(--paper);border:1px solid var(--line);border-radius:8px;padding:15px;font:inherit;font-size:17px;cursor:pointer}
button.primary:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card h3{margin:0 0 12px;font-size:1rem;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.flag{border-left:3px solid var(--gold);background:rgba(216,165,39,.08);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.9rem;margin:0 0 16px}
.flag b{color:var(--gold);font-weight:600}
.check{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px;cursor:pointer;font-size:.92rem}
.check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--arc)}
.res{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.seg{display:flex;gap:6px;flex:none}
.seg button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:8px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed=true]{color:#0D1720;font-weight:650}
.seg button.p[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.seg button.f[aria-pressed=true]{background:var(--slag);border-color:var(--slag);color:#fff}
.linkbox{background:#0F1820;border:1px solid var(--line);border-radius:8px;padding:11px;font-size:.72rem;word-break:break-all;color:var(--muted);max-height:90px;overflow:auto;margin-bottom:12px}
.sub{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:14px;font:inherit;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px}
.sub b{display:block;font-size:1rem;font-weight:600}
.sub span{color:var(--muted);font-size:.84rem}
.sub .go{margin-left:auto;color:var(--muted);flex:none}
.pill{font-size:.72rem;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);flex:none}
.pill.ok{color:var(--ok);border-color:rgba(87,167,115,.5)}
.pill.no{color:var(--slag);border-color:rgba(192,83,58,.5)}
.pill.wait{color:var(--gold);border-color:rgba(216,165,39,.5)}
.mini{background:none;border:0;color:var(--arc);font:inherit;font-size:.88rem;padding:6px 0;cursor:pointer;text-decoration:underline}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin:26px 0 0;line-height:1.6}
.err{color:var(--slag);font-size:.85rem;margin-top:6px}
.empty{text-align:center;color:var(--muted);font-size:.92rem;padding:28px 10px}
.rail{display:flex;gap:5px;margin:0 0 22px}
.rail i{flex:1;height:4px;background:var(--line);border-radius:2px}
.rail i.on{background:var(--arc)}.rail i.done{background:#4a6f93}
#toast{display:none;position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));max-width:44rem;margin:0 auto;background:var(--slag);color:#fff;padding:12px 16px;border-radius:8px;font-size:.9rem;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.wps-card{border-color:#3C6789;background:linear-gradient(180deg,#22405A,#1E3448)}
.wps-card h3{display:flex;align-items:center;gap:8px}
.wps-card h3 small{font-weight:400;color:var(--muted);font-size:.8rem}
.wps-card .kv dd{color:#EAF2FA}
.code-in{letter-spacing:.35em;text-align:center;font-size:26px!important;font-variant-numeric:tabular-nums}
.signin{margin-top:8vh}
.pdfframe{width:100%;height:calc(100vh - 230px);height:calc(100dvh - 230px);min-height:420px;border:1px solid var(--line);border-radius:8px;background:#fff}

</style>
</head>
<body>

<script>
/* =========================================================
   Weld Sync — inspector side + welder ticket links
   One page. Inspectors sign in; their data lives in Supabase,
   scoped to their inspection company. Welders never sign in —
   a ticket link is all they get, and Send files the record.
   ========================================================= */

var VERSION="2026-09-17.2";
var SB_URL="https://xvpypvrlkaryvcpuyudl.supabase.co";
var SB_KEY="sb_publishable_RouDM0y1DwiTMf95JhA81Q_bQLkbEro";
var sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SB_URL, SB_KEY) : null;

/* ---------- local cache ----------
   The views read synchronously from here. The server is the record;
   this is a mirror so the console opens instantly and survives a
   dropped signal. Namespaced by org so two accounts on one phone
   never see each other's rows. */
var mem={};
var raw={ get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},
          set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},
          del:function(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}} };
var AUTH={ user:null, org:null, profile:null };
function ns(k){ return "wq."+(AUTH.org?AUTH.org.id:"anon")+"."+k; }
var db={
  get:function(k,d){ try{ var v=JSON.parse(raw.get(ns(k))||"null"); return v===null?d:v; }catch(e){ return d; } },
  set:function(k,v){ raw.set(ns(k), JSON.stringify(v)); }
};
function hosted(){ return /^https?:/.test(location.origin||""); }
function linkBase(){ return hosted() ? location.origin+location.pathname : ""; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function token(){ var a=new Uint8Array(12); (window.crypto||window.msCrypto).getRandomValues(a);
  var s=""; for(var i=0;i<a.length;i++) s+=(a[i]%36).toString(36); return s; }

/* ---------- settings ----------
   Assembled from the org row and the profile row once signed in. */
var CFG = { shop:"", city:"", address:"", phone:"", logo:"", inspector:"", cert:"", code:"AWS D1.1:2025" };
/* The editions the app knows. The clause numbers on the printed WPQR
   come from CLAUSES, keyed by the year in this string. */
var EDITIONS=["AWS D1.1:2020","AWS D1.1:2025"];
function editionSelect(attr,cur){
  var list=EDITIONS.indexOf(cur)>-1||!cur ? EDITIONS : EDITIONS.concat([cur]);
  return '<select '+attr+'>'+list.map(function(e){return '<option '+(e==cur?"selected":"")+'>'+esc(e)+'</option>';}).join("")+'</select>';
}
function cfgFromAuth(){
  if(!AUTH.org) return;
  CFG={ shop:AUTH.org.name||"", city:AUTH.org.city||"", address:AUTH.org.address||"", phone:AUTH.org.phone||"",
        logo:AUTH.org.logo||"", code:AUTH.org.code||"AWS D1.1:2025", inspector:AUTH.profile.name||"", cert:AUTH.profile.cert||"" };
}
function saveCfg(){
  if(!sb||!AUTH.org) return;
  AUTH.org.name=CFG.shop; AUTH.org.city=CFG.city; AUTH.org.address=CFG.address; AUTH.org.phone=CFG.phone; AUTH.org.logo=CFG.logo; AUTH.org.code=CFG.code;
  AUTH.profile.name=CFG.inspector; AUTH.profile.cert=CFG.cert;
  sb.from("orgs").update({name:CFG.shop,city:CFG.city,code:CFG.code}).eq("id",AUTH.org.id).then(chk);
  sb.from("orgs").update({address:CFG.address,phone:CFG.phone}).eq("id",AUTH.org.id).then(function(res){
    if(res&&res.error) toast("Address and phone didn't save — run supabase/migrations/2026-09-16-org-letterhead.sql on the project.");
  });
  sb.from("orgs").update({logo:CFG.logo||null}).eq("id",AUTH.org.id).then(function(res){
    if(res&&res.error) toast("The logo didn't save — run supabase/migrations/2026-09-17-org-logo.sql on the project.");
  });
  sb.from("profiles").update({name:CFG.inspector,cert:CFG.cert}).eq("user_id",AUTH.user.id).then(chk);
}

/* ---------- sync ----------
   Reads come from the cache. Writes go to the cache first (so the
   screen updates now) and then to the server. */
var TABLES=["companies","wps","records"];
function rowToObj(row){ return Object.assign({id:row.id}, row.data); }
function objToRow(o){ var d=Object.assign({},o); delete d.id; return { org_id:AUTH.org.id, id:o.id, data:d, updated_at:new Date().toISOString() }; }
function loadAll(){
  if(!sb||!AUTH.org) return Promise.resolve();
  var failed=false;
  return Promise.all(TABLES.map(function(t){
    return sb.from(t).select("id,data").order("updated_at",{ascending:false}).then(function(res){
      if(res.error){ if(!failed) toast("Couldn't refresh — "+res.error.message); failed=true; return; }
      var list=res.data.map(rowToObj);
      if(t=="companies") list.sort(function(x,y){return (x.name||"").localeCompare(y.name||"")});
      db.set(t,list);
    });
  }));
}
function putRow(table,obj){
  var all=db.get(table,[]), i=-1;
  for(var k=0;k<all.length;k++) if(all[k].id==obj.id) i=k;
  if(i>-1) all[i]=obj; else all.unshift(obj);
  if(table=="companies") all.sort(function(x,y){return (x.name||"").localeCompare(y.name||"")});
  db.set(table,all);
  if(sb&&AUTH.org) sb.from(table).upsert(objToRow(obj)).then(chk);
}
function delRow(table,id){
  db.set(table, db.get(table,[]).filter(function(x){return x.id!=id}));
  if(sb&&AUTH.org) sb.from(table).delete().eq("org_id",AUTH.org.id).eq("id",id).then(chk);
}
function chk(res){ if(res&&res.error) toast("Didn't save — "+res.error.message); }
var toastT;
function toast(msg){
  var t=document.getElementById("toast"); t.textContent=msg; t.style.display="block";
  clearTimeout(toastT); toastT=setTimeout(function(){ t.style.display="none"; },4200);
}

/* ---------- option data ---------- */
var PROCESSES=[{v:"SMAW",d:"Stick"},{v:"GMAW",d:"MIG"},{v:"FCAW-G",d:"Dual shield"},{v:"FCAW-S",d:"Innershield"},{v:"GTAW",d:"TIG"}];
var FILLERS={ "SMAW":["E6010","E6011","E7018","E7018-H4R","E308L-16","Other"],
  "GMAW":["ER70S-6","ER70S-3","ER308LSi","Other"],
  "FCAW-G":["E71T-1C","E71T-9C","E70T-1","E81T1-Ni1","Other"],
  "FCAW-S":["E71T-11","E71T-8","E70T-4","Other"],
  "GTAW":["ER70S-2","ER70S-6","ER308L","ER316L","Other"] };
var GASES={ "SMAW":["None"], "GMAW":["75% Ar / 25% CO2","90% Ar / 10% CO2","100% CO2","98% Ar / 2% O2","Other"],
  "FCAW-G":["75% Ar / 25% CO2","100% CO2","Other"], "FCAW-S":["None"], "GTAW":["100% Argon","Ar / He mix","Other"] };
var DIAMS={
  "SMAW":[{v:'3/32"'},{v:'1/8"'},{v:'5/32"'},{v:'3/16"'},{v:'1/4"'}],
  "GMAW":[{v:'.030"'},{v:'.035"'},{v:'.045"'},{v:'.052"'},{v:'1/16"'}],
  "FCAW-G":[{v:'.035"'},{v:'.045"'},{v:'.052"'},{v:'1/16"'},{v:'5/64"'}],
  "FCAW-S":[{v:'.045"'},{v:'.052"'},{v:'.068"'},{v:'.072"'},{v:'5/64"'},{v:'3/32"'}],
  "GTAW":[{v:'1/16"'},{v:'3/32"'},{v:'1/8"'},{v:'5/32"'}]
};
var DIAM_LABEL={ "SMAW":"Rod diameter", "GMAW":"Wire diameter", "FCAW-G":"Wire diameter",
  "FCAW-S":"Wire diameter", "GTAW":"Filler rod diameter" };
var FLOWS=[{v:"25",d:"CFH"},{v:"30",d:"CFH"},{v:"35",d:"CFH"},{v:"40",d:"CFH"},{v:"45",d:"CFH"},{v:"50",d:"CFH"}];
var BASE_METALS=["A36","A572 Gr. 50","A992","A500 Gr. B/C","A1011","304/304L","316/316L","Other"];
var THICKNESSES=[{v:"0.125",d:'1/8"'},{v:"0.1875",d:'3/16"'},{v:"0.25",d:'1/4"'},{v:"0.375",d:'3/8"'},{v:"0.5",d:'1/2"'},{v:"0.75",d:'3/4"'},{v:"1.0",d:'1"'},{v:"custom",d:"Other"}];
var GROOVE_PLATE=[{v:"1G",d:"Flat"},{v:"2G",d:"Horizontal"},{v:"3G",d:"Vertical"},{v:"4G",d:"Overhead"},{v:"3G+4G",d:"Vert + OH"}];
var GROOVE_PIPE=[{v:"1G",d:"Rotated"},{v:"2G",d:"Horizontal"},{v:"5G",d:"Fixed horiz."},{v:"6G",d:"45° fixed"},{v:"2G+5G",d:"Both"}];
var FILLET_POS=[{v:"1F",d:"Flat"},{v:"2F",d:"Horizontal"},{v:"3F",d:"Vertical"},{v:"4F",d:"Overhead"},{v:"3F+4F",d:"Vert + OH"}];

function icon(k){

  if(k=="1G")s+='<path class="g1" d="M3 17h28"/><path class="g2" d="M13 14h8"/>';

/* ---------- helpers ---------- */
function today(){ var d=new Date(), z=function(n){return (n<10?"0":"")+n}; return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function fmtDate(s){ if(!s)return ""; var p=String(s).split("-"); return p.length==3?p[1]+"/"+p[2]+"/"+p[0]:s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function enc(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function dec(s){ try{ var b=s.replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4)b+="="; return JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){ return null; } }
function frac(n){
  if(n==null||n===""||(typeof n=="number"&&isNaN(n)))return ""; var v=parseFloat(n); if(isNaN(v))return String(n);
  var map=[[0.0625,'1/16'],[0.125,'1/8'],[0.1875,'3/16'],[0.25,'1/4'],[0.3125,'5/16'],[0.375,'3/8'],[0.4375,'7/16'],[0.5,'1/2'],[0.625,'5/8'],[0.75,'3/4'],[0.875,'7/8']];
  var w=Math.floor(v), rem=+(v-w).toFixed(4), best=null;
  for(var i=0;i<map.length;i++) if(Math.abs(map[i][0]-rem)<0.002) best=map[i][1];
  if(rem===0) return w+'"';
  if(best) return (w?w+" ":"")+best+'"';
  return v.toFixed(3).replace(/0+$/,"").replace(/\.$/,"")+'"';
}
function tVal(w){ return w.thickness=="custom"?parseFloat(w.thicknessCustom):parseFloat(w.thickness); }

/* ---------- qualified range drafts ----------
   Everything here is a draft the inspector edits and verifies against
   the code book; nothing prints without the checkbox. */
var POS_MAP={ "groove-plate":{"1G":"F","2G":"F, H","3G":"F, H, V","4G":"F, OH","3G+4G":"F, H, V, OH (all)"},
  "groove-pipe":{"1G":"F","2G":"F, H","5G":"F, V, OH","6G":"F, H, V, OH (all)","2G+5G":"F, H, V, OH (all)"},
  "fillet":{"1F":"F","2F":"F, H","3F":"F, H, V","4F":"F, H, OH","3F+4F":"F, H, V, OH (all)"} };
/* Fillet positions a groove test qualifies (D1.1 Table 6.10). */
var FILLET_FROM_GROOVE={ "1G":"F","2G":"F, H","3G":"F, H, V","4G":"F, H, OH","3G+4G":"F, H, V, OH (all)",
  "5G":"F, V, OH","6G":"F, H, V, OH (all)","2G+5G":"F, H, V, OH (all)" };
/* D1.1 base metal groups (Table 5.3) and filler specs, for the record's
   base-metals table and filler rows. Anything not listed prints blank. */
var METAL_GROUP={ "A36":"I","A572 Gr. 50":"II","A992":"II","A500 Gr. B/C":"I / II","A1011":"I" };
var FILLER_SPEC={ "E6010":"A5.1","E6011":"A5.1","E7018":"A5.1","E7018-H4R":"A5.1","E308L-16":"A5.4",
  "ER70S-2":"A5.18","ER70S-3":"A5.18","ER70S-6":"A5.18","ER308LSi":"A5.9","ER308L":"A5.9","ER316L":"A5.9",
  "E71T-1C":"A5.20","E71T-9C":"A5.20","E70T-1":"A5.20","E71T-11":"A5.20","E71T-8":"A5.20","E70T-4":"A5.20","E81T1-Ni1":"A5.29" };
/* The AWS filler spec (the "book") for a classification: the table above,
   else the classification's own pattern. Typed-in fillers get it too. */
function fillerSpecFor(cls){
  cls=String(cls||"").trim().toUpperCase(); if(!cls) return "";
  if(FILLER_SPEC[cls]) return FILLER_SPEC[cls];
  if(/^E\d{2}T/.test(cls))   return /-(NI|K|B|W|D)\d/.test(cls)||/^E[89]\dT|^E1[01]\dT/.test(cls) ? "A5.29" : "A5.20";  // FCAW: low-alloy vs carbon
  if(/^E3\d{2}[A-Z]{0,3}T/.test(cls)) return "A5.22";   // FCAW stainless (E308LT1-1, E309LMoT…)
  if(/^ER3\d{2}/.test(cls))  return "A5.9";    // GMAW/GTAW stainless
  if(/^ER[67]\dS/.test(cls)) return "A5.18";   // GMAW/GTAW carbon
  if(/^ER[89]\dS|^ER1\d{2}S/.test(cls)) return "A5.28";  // GMAW/GTAW low-alloy
  if(/^E3\d{2}[A-Z]{0,3}-\d/.test(cls)) return "A5.4";    // SMAW stainless (E308L-16, E309LMo-15)
  if(/^E[67]0\d{2}$/.test(cls)) return "A5.1"; // SMAW carbon
  if(/^E[67]0\d{2}-|^E[89]0\d{2}|^E1\d0\d{2}/.test(cls)) return "A5.5";  // SMAW low-alloy
  return "";
}
/* SMAW electrode groups (Table 6.12): a test with a higher F-number
   qualifies the lower ones. */
var F_NUMBER={ "E6010":"F3","E6011":"F3","E7018":"F4","E7018-H4R":"F4","E308L-16":"F5" };
var F_RANGE={ "F1":"F1","F2":"F1, F2","F3":"F1, F2, F3","F4":"F1, F2, F3, F4","F5":"F5" };
function suggest(w){
  var groove=w.weldType!="fillet", pipe=w.product=="pipe";
  var key = groove ? ("groove-"+w.product) : "fillet";
  var pos=(POS_MAP[key]||{})[w.position]||"";
  var fpos= groove ? (FILLET_FROM_GROOVE[w.position]||"") : pos;
  var t=tVal(w), tMin="", tMax="";
  if(!isNaN(t)&&t>0){ tMin = t<0.125?frac(t):'1/8"'; tMax = t>=1?"Unlimited":frac(t*2); }
  var dia="";
  if(pipe){ var od=parseFloat(w.pipeOD); if(!isNaN(od)) dia = od>=24?"All diameters":frac(od)+" OD and larger — verify"; }
  else dia='24" OD and larger';
  var filler=w.filler=="Other"?w.fillerOther:w.filler, fn=F_NUMBER[filler];
  return { positions:pos, filletPositions:fpos, thickMin:tMin, thickMax:tMax, diameter:dia,
    filletThick: groove ? (pipe ? "Unlimited" : '1/8" min, unlimited') : (tMin ? tMin+" to Unlimited" : ""),
    process: w.process ? w.process+(w.transfer?" ("+w.transfer+")":"") : "",
    backing: groove ? (w.backing=="with" ? "With, or with backgouge" : "With or without") : "N/A",
    joints: groove ? "Groove, fillet, plug, slot (PJP T-, K-, Y- groove)" : "Fillet, plug, slot",
    base: METAL_GROUP[w.base] ? "Any D1.1 qualified base metal" : "",
    filler: fn ? F_RANGE[fn] : (filler ? String(filler).replace(/-.*$/,"-X") : "") };
}

/* The card a welder sees: what the WPS calls for. Also shown to the
   inspector on the ticket screen so there are no surprises. */
function wpsCard(p, title){
  if(!p) return "";
  var groove=(p.weldType||"CJP groove")!="Fillet";
  var joint=groove ? [p.jointDesig, p.groove, p.angle, p.rootOpening?"root "+p.rootOpening:"", p.backing].filter(Boolean).join(", ")
                   : ["Fillet", p.filletSize].filter(Boolean).join(" ");
  var rows = [
    ["Joint", joint],
    ["Process", p.process ? p.process+(p.transfer?" — "+p.transfer:"") : ""],
    ["Filler", (p.filler||"")+(p.fillerDia?" × "+p.fillerDia:"")],
    ["Gas", p.gas ? p.gas+(p.flow?" @ "+p.flow+" CFH":"") : ""],
    ["Base metal", p.base],
    ["Thickness", p.thickRange],
    ["Positions", [p.positions, p.progression].filter(Boolean).join(" · ")],
    ["Amps / volts", [p.amps, p.volts].filter(Boolean).join(" / ")],
    ["Polarity", p.polarity], ["Preheat", p.preheat], ["Travel", p.travel?p.travel+" ipm":""]
  ].filter(function(r){return r[1]});
  var h='<div class="card wps-card"><h3>'+esc(title||"Weld to this procedure")+' <small>'+esc(wpsLabel(p))+(p.basis?" · "+esc(p.basis):"")+'</small></h3>'
    +(p.title?'<p style="margin:-6px 0 12px;font-size:.9rem;color:#C6D2DB">'+esc(p.title)+'</p>':'')+'<dl class="kv">';
  rows.forEach(function(r){ h+='<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'; });
  h+='</dl><p style="margin:12px 0 0"><button class="mini" data-act="viewwps" data-wps-id="'+esc(p.id||"")+'">See the whole WPS</button></p></div>';
  return h;
}

/* The whole WPS, read-only. Welders open it from the card on their
   ticket; the inspector opens it from the library to see what they get. */
function wpsSections(p){
  var groove=(p.weldType||"CJP groove")!="Fillet";
  function sec(title,rows){ rows=rows.filter(function(r){return r[1]}); return rows.length?{title:title,rows:rows}:null; }
  return [
    sec("Joint design",[["Weld type",p.weldType],["Joint",p.jointType],["Prequalified joint",groove?p.jointDesig:""],["Groove",groove?p.groove:""],["Groove angle",groove?p.angle:""],
      ["Root opening",groove?p.rootOpening:""],["Root face",groove?p.rootFace:""],["Backing",groove?p.backing:""],
      ["Backing material",p.backing=="With backing"?p.backingMat:""],["Backgouging",groove?p.backgouge:""],["Fillet size",groove?"":p.filletSize]]),
    sec("Base metal",[["Base material",p.base],["Welded to",p.baseTo],["Thickness",p.thickRange],["Diameter",p.diaRange]]),
    sec("Process and filler",[["Process",p.process+(p.transfer?" — "+p.transfer:"")],["Filler",p.filler],["AWS spec",fillerSpecFor(p.filler)||p.fillerSpec],["Diameter",p.fillerDia],["Manufacturer",p.fillerMfr]]),
    sec("Shielding",[["Gas",p.gas],["Flow",p.flow?p.flow+" CFH":""],["Nozzle",p.nozzle],["Contact tip to work",p.ctwd]]),
    sec("Electrical",[["Amps",p.amps],["Volts",p.volts],["Polarity",p.polarity],["Wire feed",p.wfs?p.wfs+" ipm":""],["Power source",p.powerSource]]),
    sec("Preheat, interpass, PWHT",[["Preheat, min",p.preheat],["Interpass",p.interpass],["PWHT temperature",p.pwhtTemp],["PWHT time",p.pwhtTime]]),
    sec("Technique",[["Positions",p.positions],["Progression",p.progression],["Travel speed",p.travel?p.travel+" ipm":""],["Bead",p.bead],["Passes",p.passes],["Cleaning",p.cleaning],["Peening",p.peening]])
  ].filter(Boolean);
}

/* ---------- welder intake ---------- */
/* With a WPS on the ticket the welder isn't asked what the WPS already
   fixes; the middle three steps collapse to one. */
function stepList(){
  return S.wps
    ? [["Welder",stepWelder],["Coupon",stepCoupon],["Review",stepReview]]
    : [["Welder",stepWelder],["Test",stepTest],["Position",stepPosition],["Machine",stepMachine],["Review",stepReview]];
}
function lastStep(){ return S.step==stepList().length-1; }
function previewBar(){
  return S.preview ? '<div class="nav"><button data-act="exitpreview">'+"\u2039"+' Console</button>'
    + '<div class="title">Welder\'s view — preview</div><div class="spacer"></div></div>' : "";
}
VIEWS.intake = function(){
  var w=S.w;
  var h = previewBar() + '<div class="ticket"><div class="ticket-top"><div>'
    + '<div class="shop">'+esc(CFG.shop)+' &nbsp;·&nbsp; '+esc(CFG.city)+'</div>'
    + '<h1>Weld test ticket<span>Fill this out before you strike an arc. It writes your test record for you.</span></h1>'
    + '</div>'+codeChip()+'</div><div class="perf"></div>'

function fld(label,key,type,ph,req){

}
function stepWelder(){
  var w=S.w;
  return '<h2 class="step">Who is testing?</h2><p class="hint">This goes on the certificate exactly as you type it.</p>'
    + fld("Full legal name","name","text","First M. Last",1)
    + (w.companyId? '<div class="field"><label>Employer</label><input type="text" value="'+esc(w.company)+'" data-k="company"></div>' : fld("Employer","company","text","Company on the certificate"))

    + '<div class="field"><label>Test date</label><input type="date" value="'+esc(w.date)+'" data-k="date"></div></div>'
    + fld("Welder ID or stamp you use","stamp","text","Leave blank if we assign one");
}
function stepTest(){
  var w=S.w;
  var h='<h2 class="step">What are you welding?</h2><p class="hint">'+(S.wps?'Your inspector set the procedure. The matching choices are already picked — check them against your coupon.':'Pick what the coupon actually is.')+'</p>';
  h+=wpsCard(S.wps, "Weld to this procedure");
  h+='<div class="field"><label>Weld type <span class="req">*</span></label>'+tiles([{v:"groove",d:"Groove / CJP"},{v:"fillet",d:"Fillet"}],w.weldType,false,"w:weldType")+'</div>';
  h+=productField();
  h+='<div class="field"><label>Process <span class="req">*</span></label>'+tiles(PROCESSES,w.process,false,"w:process")+'</div>';
  if(w.process=="GMAW") h+=transferField();
  h+='<div class="field"><label>Base metal</label>'+tiles(BASE_METALS,w.base,false,"w:base")+'</div>';
  h+=thicknessField()+pipeFields();
  if(w.weldType=="groove") h+='<div class="field"><label>Backing</label>'+tiles([{v:"with",d:"With backing"},{v:"without",d:"No backing"}],w.backing,false,"w:backing")+'</div>';
  return h;
}
function productField(){ return '<div class="field"><label>Plate or pipe <span class="req">*</span></label>'+tiles([{v:"plate",d:""},{v:"pipe",d:"or tube"}],S.w.product,false,"w:product")+'</div>'; }
function transferField(){
  return '<div class="field"><label>Transfer mode <span class="req">*</span></label>'
    +tiles([{v:"Spray"},{v:"Globular"},{v:"Short circuit",d:"GMAW-S"},{v:"Pulsed"}],S.w.transfer,false,"w:transfer")
    +(S.w.transfer=="Short circuit"?'<p class="err">Short circuit needs a qualified WPS — check with the inspector.</p>':'')+'</div>';
}
function thicknessField(){
  var w=S.w, h='<div class="field"><label>Material thickness <span class="req">*</span></label>'+tiles(THICKNESSES,w.thickness,false,"w:thickness");
  if(w.thickness=="custom") h+='<div style="margin-top:8px"><input type="number" step="0.001" data-k="thicknessCustom" value="'+esc(w.thicknessCustom)+'" placeholder="Decimal inches, e.g. 0.625"></div>';
  return h+'</div>';
}
function pipeFields(){
  var w=S.w; if(w.product!="pipe") return "";
  return '<div class="row"><div class="field"><label>Pipe OD (in)</label><input type="number" step="0.01" data-k="pipeOD" value="'+esc(w.pipeOD)+'"></div>'
    +'<div class="field"><label>Wall (in)</label><input type="number" step="0.001" data-k="pipeWall" value="'+esc(w.pipeWall)+'"></div></div>';
}
function positionField(withHeading){
  var w=S.w;
  var list = w.weldType=="fillet"?FILLET_POS:(w.product=="pipe"?GROOVE_PIPE:GROOVE_PLATE);
  var h = withHeading ? '' : '<div class="field"><label>Test position <span class="req">*</span></label>';
  h+=tiles(list,w.position,true,"w:position");
  if(w.position) h+='<div class="flag" style="margin-top:18px"><b>Draft range</b> — if you pass, this position typically qualifies you for '+esc(suggest(w).positions)+'. The inspector confirms it against the code book before signing.</div>';
  return h + (withHeading ? '' : '</div>');
}
function stepPosition(){
  return '<h2 class="step">Test position</h2><p class="hint">This decides more of what you get qualified for than anything else on this form.</p>'+positionField(true);
}
/* The one middle step when a WPS is attached. Everything the WPS fixes
   is already on the record; this asks only about the coupon itself. */
function stepCoupon(){
  var w=S.w, p=S.wps, locked=S.lockedPos;
  var h='<h2 class="step">Your coupon</h2><p class="hint">The procedure below is set by your inspector. If what\'s on the rack doesn\'t match it, tell them — don\'t guess.</p>';
  h+=wpsCard(p, "Weld to this procedure");
  if(locked) h+='<div class="card"><h3>Test position</h3><dl class="kv"><dt>Position</dt><dd>'+esc(w.position)+' · '+esc(w.product)+'</dd></dl>'
    +'<div class="flag" style="margin:12px 0 0"><b>Draft range</b> — if you pass, this position typically qualifies you for '+esc(suggest(w).positions)+'. The inspector confirms it against the code book before signing.</div></div>';
  else h+=productField()+positionField(false);
  if(w.process=="GMAW"&&!(p&&p.transfer)) h+=transferField();
  h+=thicknessField()+pipeFields();
  // Anything the WPS left blank that the record still needs.
  var fl=FILLERS[w.process]||["Other"], gs=GASES[w.process]||["Other"], dia=DIAMS[w.process]||[];
  var gaps='';
  if(!w.process) gaps+='<div class="field"><label>Process <span class="req">*</span></label>'+tiles(PROCESSES,w.process,false,"w:process")+'</div>';
  if(w.process&&!w.filler) gaps+='<div class="field"><label>'+(w.process=="SMAW"?"Electrode":"Filler")+' classification <span class="req">*</span></label>'+tiles(fl,w.filler,false,"w:filler")+'</div>';
  if(w.filler=="Other"&&!w.fillerOther) gaps+='<div class="field"><input type="text" data-k="fillerOther" value="'+esc(w.fillerOther)+'" placeholder="Type the AWS classification"></div>';
  if(dia.length&&!w.fillerDia) gaps+='<div class="field"><label>'+esc(DIAM_LABEL[w.process]||"Filler diameter")+' <span class="req">*</span></label>'+tiles(dia,w.fillerDia,false,"w:fillerDia")+'</div>';
  if(gs[0]!="None"&&!w.gas) gaps+='<div class="field"><label>Shielding gas <span class="req">*</span></label>'+tiles(gs,w.gas,false,"w:gas")+'</div>';
  if(w.gas&&w.gas!="None"&&w.gas!="Other"&&!w.flow) gaps+='<div class="field"><label>Flow rate</label>'+tiles(FLOWS,w.flow,false,"w:flow")+'</div>';
  if(gaps) h+='<div class="card"><h3>What did you pull off the rack?</h3><p style="margin:-6px 0 12px;font-size:.86rem;color:var(--muted)">The WPS leaves these open or gives a range. Pick what is actually on the machine.</p>'+gaps+'</div>';
  h+='<div class="field"><label>Anything the inspector should know</label><textarea data-k="notes" placeholder="Optional">'+esc(w.notes)+'</textarea></div>';
  return h;
}
function stepMachine(){
  var w=S.w, fl=FILLERS[w.process]||["Other"], gs=GASES[w.process]||["Other"];
  var dia=DIAMS[w.process]||[], dlabel=DIAM_LABEL[w.process]||"Filler diameter";
  var h='<h2 class="step">Filler and gas</h2><p class="hint">What you actually pulled off the rack. Tap, don\'t type.</p>';
  h+='<div class="field"><label>'+(w.process=="SMAW"?"Electrode":"Filler")+' classification <span class="req">*</span></label>'+tiles(fl,w.filler,false,"w:filler")+'</div>';
  if(w.filler=="Other") h+='<div class="field"><input type="text" data-k="fillerOther" value="'+esc(w.fillerOther)+'" placeholder="Type the AWS classification"></div>';
  if(dia.length) h+='<div class="field"><label>'+esc(dlabel)+' <span class="req">*</span></label>'+tiles(dia,w.fillerDia,false,"w:fillerDia")+'</div>';
  if(gs[0]!="None"||gs.length>1){
    h+='<div class="field"><label>Shielding gas <span class="req">*</span></label>'+tiles(gs,w.gas,false,"w:gas")+'</div>';
    if(w.gas&&w.gas!="None"&&w.gas!="Other") h+='<div class="field"><label>Flow rate</label>'+tiles(FLOWS,w.flow,false,"w:flow")+'</div>';
    if(w.gas=="Other") h+='<div class="field"><input type="text" data-k="gasOther" value="'+esc(w.gasOther||"")+'" placeholder="What is on the bottle"></div>';
  }
  if(!w.wpsId) h+='<div class="field"><label>WPS number, if you were given one</label><input type="text" data-k="wps" value="'+esc(w.wps)+'" placeholder="e.g. WPS-01"></div>';
  h+='<div class="field"><label>Anything the inspector should know</label><textarea data-k="notes" placeholder="Optional">'+esc(w.notes)+'</textarea></div>';
  return h;
}
function stepReview(){
  var w=S.w;
  var h='<h2 class="step">Check it before you send</h2><p class="hint">This becomes your test record. Typos become typos on the certificate.</p>';
  h+='<div class="card"><h3>Welder</h3><dl class="kv">'+kv("Name",w.name)+kv("Employer",w.company)+kv("Date",fmtDate(w.date))+kv("Stamp",w.stamp||"To be assigned")+'</dl></div>';
  h+='<div class="card"><h3>Test coupon</h3><dl class="kv">'
    +kv("Type",(w.weldType=="fillet"?"Fillet":"Groove")+" on "+w.product)
    +kv("Process",w.process+(w.transfer?" — "+w.transfer:""))+kv("Position",w.position)+kv("Base metal",w.base)
    +kv("Thickness",frac(tVal(w)))
    +(w.product=="pipe"?kv("Pipe",w.pipeOD+'" OD × '+w.pipeWall+'" wall'):"")
    +(w.weldType=="groove"?kv("Backing",w.backing=="with"?"With backing":"No backing"):"")+'</dl></div>';
  h+='<div class="card"><h3>Filler and gas</h3><dl class="kv">'
    +kv("Filler",(w.filler=="Other"?w.fillerOther:w.filler)+(w.fillerDia?" × "+w.fillerDia:""))
    +kv("Gas",(w.gas=="Other"?(w.gasOther||"Other"):w.gas)+(w.flow?" @ "+w.flow+" CFH":""))
    +kv("WPS",w.wps)+'</dl></div>';
  if(S.wps) h+=wpsCard(S.wps, "Your procedure");
  var m=missing();
  if(m.length) h+='<div class="flag"><b>Still needed</b> — '+esc(m.join(", "))+'</div>';
  h+='<p id="senderr" class="err" style="display:none"></p>';
  return h;
}
function kv(k,v){ return v?'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>':""; }
function missing(){
  var w=S.w,m=[];
  if(!w.name)m.push("name");
  if(!w.process)m.push("process");
  if(w.process=="GMAW"&&!w.transfer)m.push("transfer mode");
  if(!w.position)m.push("position");
  if(!w.thickness||(w.thickness=="custom"&&!w.thicknessCustom))m.push("thickness");
  if(!w.filler)m.push("filler metal");
  if((DIAMS[w.process]||[]).length && !w.fillerDia)m.push((DIAM_LABEL[w.process]||"filler diameter").toLowerCase());
  if((GASES[w.process]||[])[0]!="None" && !w.gas)m.push("shielding gas");
  return m;
}

/* Plain-text and printed forms of a WPS. */
function wpsText(p){
  var out=[CFG.shop+" — "+wpsLabel(p)+(p.basis?" ("+p.basis+")":""), p.title||""].filter(Boolean);
  wpsSections(p).forEach(function(sc){
    out.push(""); out.push(sc.title.toUpperCase());

/* =========================================================
   The PDFs — WPQR and WPS
   Built here with jsPDF instead of the browser's print dialog. A
   phone's print engine lays the page out at its own width and the
   sheet ran long; here every box goes at a fixed spot on a letter
   page, so it is one page on anything, and the result is a file the
   share sheet can take. Both are laid out like the shop's paper forms.
   ========================================================= */
var PDF_SRC=["https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js",
             "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"];
var pdfLoading=null;
function pdfReady(){ return !!(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable); }
/* Started at boot so the library is in hand by the time a button is
   tapped: iOS only opens the share sheet from inside the tap itself. */
function loadPdfLib(){
  if(pdfReady()) return Promise.resolve();
  if(pdfLoading) return pdfLoading;
  function one(src){ return new Promise(function(ok,no){ var s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=function(){ no(new Error(src)); }; document.head.appendChild(s); }); }
  pdfLoading=one(PDF_SRC[0]).then(function(){ return one(PDF_SRC[1]); }).catch(function(e){ pdfLoading=null; throw e; });
  return pdfLoading;
}
/* Hand the file over: the share sheet on a phone (Files, Messages,
   AirPrint...), a new tab on a desktop, a download if neither works. */
function deliverPdf(d,name){
  var blob=d.output("blob"), mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  var url=URL.createObjectURL(blob);
  function download(){ var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  var file=null; try{ file=new File([blob],name,{type:"application/pdf"}); }catch(e){}
  if(mobile && file && navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file],title:name}).catch(function(e){ if(!/Abort/.test(String(e&&e.name))) download(); });
  else if(mobile) download();
  else if(!window.open(url,"_blank")) download();
  setTimeout(function(){ URL.revokeObjectURL(url); },120000);
}
function pdfName(s){ return String(s||"sheet").replace(/[^\w.-]+/g,"_")+".pdf"; }

/* Acceptance-criteria clause numbers on the results table. Only the
   editions checked against a book are filled in; any other edition
   prints the part reference and the inspector writes the clause in. */
var CLAUSES={ "2020":{ visual:"6.10.1", bendTest:"6.10.3.1 and Fig. 6.8", bend:"6.10.3.3" } };
function clauseRefs(){ var y=(String(CFG.code).match(/20\d\d/)||[])[0]; return CLAUSES[y]||{ visual:"Clause 6, Part C", bendTest:"Clause 6, Part C", bend:"Clause 6, Part C" }; }
function accept(v){ return v=="Pass"?"Acceptable":v=="Fail"?"Unacceptable":""; }

/* ---- page geometry and drawing helpers (points; letter is 612 x 792) ---- */
var PG={ w:612, h:792, m:30, gap:8 };
function dash(v){ return v===""||v==null?"—":String(v); }
function boxCell(on){ return { content:"", box:!!on }; }
function pdfDoc(){ var d=new window.jspdf.jsPDF({unit:"pt",format:"letter"}); d.setFont("helvetica","normal"); d.setTextColor(0); return d; }
/* One bordered table. o: x, w, y, head (one row), body, col (column
   styles), bold (body columns set bold), center (center the value
   cells), parse (extra per-cell hook). Returns the y under it. */
function grid(d,o){
  var bold=o.bold||[0];
  d.autoTable({ startY:o.y, margin:{left:o.x,right:PG.w-o.x-o.w,top:PG.m,bottom:PG.m}, tableWidth:o.w,
    head:o.head?[o.head]:undefined, body:o.body, theme:"grid", pageBreak:"avoid",
    styles:{ font:"helvetica", fontSize:7.2, cellPadding:{top:1.7,bottom:1.7,left:3,right:3}, lineColor:0, lineWidth:.5, textColor:0, fillColor:false, overflow:"linebreak", valign:"middle" },
    headStyles:{ fontStyle:"bold", fillColor:false, textColor:0, halign:"center" },
    alternateRowStyles:{ fillColor:false },
    columnStyles:o.col||{},
    didParseCell:function(c){
      var i=c.column.index;
      if(c.section=="head"){ if(i==0) c.cell.styles.halign="left"; }
      else if(bold.indexOf(i)>-1){ c.cell.styles.fontStyle="bold"; c.cell.styles.halign="left"; }
      else c.cell.styles.halign=o.center?"center":"left";
      var own=c.cell.raw&&c.cell.raw.styles; if(own) Object.assign(c.cell.styles,own);   // a cell's own styles win
      if(o.parse) o.parse(c);
    },
    didDrawCell:function(c){
      var raw=c.cell.raw; if(!raw||raw.box===undefined) return;
      var s=6, cx=c.cell.x+c.cell.width/2-s/2, cy=c.cell.y+c.cell.height/2-s/2;
      d.setLineWidth(.6); d.rect(cx,cy,s,s);
      if(raw.box){ d.setLineWidth(1); d.line(cx+1.2,cy+3.2,cx+2.6,cy+4.8); d.line(cx+2.6,cy+4.8,cx+5,cy+1.4); }
    } });
  return d.lastAutoTable.finalY;
}
function letterhead(d,title){
  var W=PG.w-2*PG.m;
  d.setFillColor(138,144,150); d.rect(PG.m,PG.m,W,5,"F");
  if(CFG.logo){ try{ var pr=d.getImageProperties(CFG.logo), lh=44, lw=lh*pr.width/pr.height; if(lw>90){ lw=90; lh=lw*pr.height/pr.width; } d.addImage(CFG.logo,"PNG",PG.m,PG.m+9,lw,lh); }catch(e){} }
  d.setFont("helvetica","bold"); d.setFontSize(15);
  d.text(String(CFG.shop||"").toUpperCase(), PG.w/2, PG.m+23, {align:"center"});
  d.setFontSize(8); var addr=[CFG.address||CFG.city, CFG.phone].filter(Boolean).join("    ·    ");
  if(addr) d.text(addr, PG.w/2, PG.m+34, {align:"center"});
  d.setFontSize(11); d.text(title, PG.w/2, PG.m+52, {align:"center"});
  d.setFont("helvetica","normal");
  return PG.m+60;
}
function sectionTitle(d,y,t){ d.setFont("helvetica","bold"); d.setFontSize(8); d.text(t.toUpperCase(),PG.m,y+9); d.setFont("helvetica","normal"); return y+12; }
function greyBar(d,y,t){
  var W=PG.w-2*PG.m;
  d.setFillColor(138,144,150); d.rect(PG.m,y,W,11,"F");
  d.setTextColor(255); d.setFont("helvetica","bold"); d.setFontSize(8); d.text(t.toUpperCase(),PG.w/2,y+8,{align:"center"});
  d.setTextColor(0); d.setFont("helvetica","normal");
  return y+11+PG.gap;
}
/* Signature block: an optional contractor line on the left, the
   authorized-by and date lines in the middle, the stamp box on the right. */
function signature(d,y,leftName,leftLabel){
  var x=PG.m, W=PG.w-2*PG.m, mid=x+W*.42, stamp=x+W-96;
  d.setLineWidth(.5); d.setDrawColor(0); d.setTextColor(0);
  if(leftLabel){
    d.setFont("helvetica","bold"); d.setFontSize(8.5); d.text(String(leftName||""), x, y+22);
    d.setFont("helvetica","normal"); d.line(x,y+26,x+W*.36,y+26); d.setFontSize(7); d.text(leftLabel, x, y+34);
  }
  d.setFontSize(7);
  d.line(mid,y+26,stamp-14,y+26); d.text("Authorized by — "+[CFG.inspector,CFG.cert].filter(Boolean).join(", "), mid, y+34, {maxWidth:stamp-14-mid});
  d.line(mid,y+52,stamp-14,y+52); d.text("Date", mid, y+60);
  d.setDrawColor(120); d.setLineDashPattern([2,2],0); d.rect(stamp,y,96,62); d.setLineDashPattern([],0);
  d.setTextColor(120); d.text("Inspector stamp", stamp+48, y+56, {align:"center"}); d.setTextColor(0); d.setDrawColor(0);
  return y+64;
}
/* An unverified record prints as a draft, and says so. */
function watermark(d){
  d.saveGraphicsState(); d.setGState(new d.GState({opacity:.12}));
  d.setFont("helvetica","bold"); d.setFontSize(110); d.setTextColor(0);
  d.text("DRAFT", PG.w/2, PG.h/2+40, {align:"center", angle:35});
  d.restoreGraphicsState(); d.setFont("helvetica","normal");
}

/* ---- the WPQR ---- */
function wpqrPdf(draft){
  var w=S.w,r=S.r,s=suggest(w),t=tVal(w),cl=clauseRefs();
  var g=function(k,fb){ return r[k]!==undefined&&r[k]!==""?r[k]:fb; };
  var groove=w.weldType!="fillet", pipe=w.product=="pipe", od=parseFloat(w.pipeOD), small=pipe&&!isNaN(od)&&od<24;
  var wp=wpsById(w.wpsId), wpsNo=w.wps||wpsLabel(wp); wp=wp||{};
  var employer=coName(w.companyId)||w.company;
  var filler=w.filler=="Other"?w.fillerOther:w.filler;
  var gas=w.gas=="Other"?(w.gasOther||"Other"):(w.gas||"None");
  var thick=frac(t), grp=METAL_GROUP[w.base]||"";
  var spec=/^A\d/.test(w.base||"")?"ASTM "+w.base:w.base;
  var jointType=(pipe?"Pipe":"Plate")+" — "+(groove
    ? [wp.groove,"groove"].filter(Boolean).join(" ")+(w.backing=="with"?" w/ backing":" without backing") : "fillet");
  var prog=w.progression=="Downhill"?"Vertical down":w.progression=="Uphill"?"Vertical up":"";
  var manual=(w.process=="SMAW"||w.process=="GTAW")?"Manual":"Semi-automatic";
  var backA=groove?(w.backing=="with"?"With":"Without"):"N/A";
  var vert=/3G|5G|6G|3F/.test(w.position);
  var qPos=g("qPos",s.positions), qFPos=g("qFPos",s.filletPositions);
  var qThick=g("qThick",s.thickMin?s.thickMin+" to "+s.thickMax:""), qFillet=g("qFillet",s.filletThick), qDia=g("qDia",s.diameter);
  var fspec=fillerSpecFor(filler)||wp.fillerSpec||"", fnum=F_NUMBER[filler]||"";
  var IND=" ";

  var d=pdfDoc(), x=PG.m, W=PG.w-2*PG.m, y=letterhead(d,"Welder Performance Qualification Record (WPQR)");
  var lw=Math.round(W*.55), rw=W-lw-PG.gap;
  var y1=grid(d,{x:x,w:lw,y:y,col:{0:{cellWidth:64}},body:[["Name",dash(w.name)],["ID Number",dash(w.stamp)],["Company",dash(employer)],["Division",dash(w.division)]]});
  var y2=grid(d,{x:x+lw+PG.gap,w:rw,y:y,col:{0:{cellWidth:64}},body:[["Test Date",dash(fmtDate(w.date))],["Record No.",dash(r.testNo)],["WPS No.",dash(wpsNo)],["Qualified To",dash([CFG.code,wp.jointDesig].filter(Boolean).join("   "))]]});
  y=Math.max(y1,y2)+PG.gap;

  var mh=["Base Metals","Specification","Type or Grade","AWS Group No.","Thickness"].concat(pipe?["Diameter"]:[]);
  var mrow=function(k){ return [k,dash(spec),"—",dash(grp),dash(thick)].concat(pipe?[dash(!isNaN(od)?frac(od):"")]:[]); };
  y=grid(d,{x:x,w:W,y:y,center:1,head:mh,body:[mrow("Base Material"),mrow("Welded To")]})+PG.gap;

  var av=function(k,a,q){ return [k,dash(a),dash(q)]; }, colAV={0:{cellWidth:160}};
  y=grid(d,{x:x,w:W,y:y,center:1,col:colAV,head:["Variables","Actual Values","Ranges Qualified"],body:[
    av("Type of Weld Joint",jointType,g("qJoint",s.joints)),
    av("Base Metal",grp?"Group "+grp+" to Group "+grp:w.base,g("qBase",s.base))]})+PG.gap;

  y=grid(d,{x:x,w:W,y:y,center:1,col:colAV,head:["Thickness and Diameter","Actual — Groove","Actual — Fillet","Qualified — Groove","Qualified — Fillet"],body:[
    ["Plate Thickness", dash(!pipe&&groove?thick:""), dash(!pipe&&!groove?thick:""), dash(qThick), dash(qFillet)],
    ["Pipe/Tube Thickness", dash(pipe&&groove?thick:""), dash(pipe&&!groove?thick:""), dash(qThick), dash(groove?"Unlimited":qFillet)],
    ["Pipe Diameter", dash(pipe&&groove&&!isNaN(od)?frac(od):""), dash(pipe&&!groove&&!isNaN(od)?frac(od):""), dash(qDia), dash(groove?"Unlimited":qDia)]]})+PG.gap;

  y=grid(d,{x:x,w:W,y:y,center:1,col:colAV,head:["Welding Process",dash(w.process),dash(g("qProc",s.process))],body:[
    av("Type",manual,manual),
    av("Backing",backA,g("qBack",s.backing)),
    av("Filler Metal (AWS Spec.)",fspec,fspec),
    av("AWS Classification",filler,g("qFiller",s.filler)),
    av("F-Number",fnum,fnum),
    av("Position",w.position,""),
    av(IND+"Groove — Plate / Pipe > 24\"", groove&&!small?w.position:"", groove?qPos:""),
    av(IND+"Groove — Pipe < 24\"", groove&&small?w.position:"", groove&&pipe?qPos:""),
    av(IND+"Fillet — Plate and Pipe > 24\"", !groove&&!small?w.position:"", qFPos),
    av(IND+"Fillet — Pipe < 24\"", !groove&&small?w.position:"", qFPos),
    av("Progression", vert?prog:"", vert?prog:""),
    av("GMAW Transfer Mode", w.transfer, w.transfer),
    av("Single or Multiple Electrodes","Single","Single"),
    av("Gas/Flux Type", gas, gas)]})+PG.gap;

  var res=[], push=function(k,crit,v){ res.push([k,dash(crit),dash(accept(v)),""]); };
  push("Visual examination per "+cl.visual, cl.visual, r.visual);
  if(r.method=="bend"){
    if(!isNaN(t)&&t>=0.375){
      var sides=["bendSide1","bendSide2","bendSide3","bendSide4"].map(function(k){return r[k]});
      if(sides.every(function(v){return v==sides[0]})) push("Four side bends per "+cl.bendTest, cl.bend, sides[0]);
      else sides.forEach(function(v,i){ push("Side bend "+(i+1)+" per "+cl.bendTest, cl.bend, v); });
    } else { push("Root bend per "+cl.bendTest, cl.bend, r.bendRootFace1); push("Face bend per "+cl.bendTest, cl.bend, r.bendRootFace2); }
  }
  if(r.method=="rt") push("Radiographic examination","Clause 6, Part C",r.rt);
  if(r.method=="macro") push("Macroetch / fillet break","Clause 6, Part C",r.macro);
  if(r.remarks||w.notes) res.push(["Remarks",{content:r.remarks||w.notes,colSpan:3,styles:{halign:"left"}}]);
  y=sectionTitle(d,y,"Test Results");
  y=grid(d,{x:x,w:W,y:y,center:1,bold:[],col:{0:{cellWidth:230}},head:["Type of Test","Acceptance Criteria","Results","Remarks"],body:res,
    parse:function(c){ if(c.section=="body"&&c.column.index==0){ c.cell.styles.halign="left"; if(c.cell.raw=="Remarks") c.cell.styles.fontStyle="bold"; } }})+PG.gap;

  y=sectionTitle(d,y,"Certification");
  y=grid(d,{x:x,w:W,y:y,col:{0:{cellWidth:110}},body:[
    ["Test Conducted By",dash([CFG.inspector,CFG.cert].filter(Boolean).join(", "))],
    ["Laboratory",dash(CFG.shop)],
    ["Test Number",dash(r.testNo)],
    ["File Number",dash(r.testNo)]]})+6;
  d.setFont("helvetica","bold"); d.setFontSize(9.5); d.text("Result: "+(r.result||"—"),x,y+9); y+=14;
  d.setFont("helvetica","normal"); d.setFontSize(7);
  var stmt=d.splitTextToSize("We, the undersigned, certify that the statements in this record are correct and that the test welds were prepared, welded, and tested in accordance with the requirements of Clause 6 of "+CFG.code+".", W);
  d.text(stmt,x,y+7); y+=stmt.length*8.5+2;
  signature(d,y,employer,"Manufacturer or Contractor");
  if(draft) watermark(d);
  return d;
}

/* ---- the WPS ---- */
function wpsPdf(p){
  var groove=(p.weldType||"CJP groove")!="Fillet", cjp=(p.weldType||"CJP groove")=="CJP groove", pjp=p.weldType=="PJP groove";
  var manual=(p.process=="SMAW"||p.process=="GTAW")?"Manual":"Semiautomatic";
  var backMat=p.backing=="With backing"?(p.backingMat||""):"";
  var gasProc=p.process!="SMAW"&&p.process!="FCAW-S";
  var d=pdfDoc(), x=PG.m, W=PG.w-2*PG.m, half=(W-PG.gap)/2, xr=x+half+PG.gap;
  var y=letterhead(d,"Welding Procedure Specification (WPS)");

  /* header strip: a value line with its label under it, like the paper */
  y=grid(d,{x:x,w:W,y:y,bold:[],body:[
    [dash(CFG.shop),dash(p.no),dash(p.rev),dash(p.date?fmtDate(p.date):"")],
    ["Company Name","WPS No.","Rev. No","Date"],
    [dash(p.contact),{content:dash(p.basis=="Qualified by PQR"?(p.pqr||"PQR"):"Prequalified / "+CFG.code),colSpan:2},dash(p.cvn)],
    ["Company Contact",{content:"Supporting PQR",colSpan:2},"CVN Report"]],
    parse:function(c){
      if(c.row.index%2==0){ c.cell.styles.fontStyle="bold"; c.cell.styles.lineWidth={top:.5,left:.5,right:.5,bottom:0}; c.cell.styles.cellPadding={top:2.5,bottom:0,left:3,right:3}; }
      else { c.cell.styles.fontSize=6; c.cell.styles.lineWidth={top:0,left:.5,right:.5,bottom:.5}; c.cell.styles.cellPadding={top:0,bottom:2,left:3,right:3}; }
    }})+PG.gap;

  var metal=function(k,m){ return [k,dash(m),"—",dash(METAL_GROUP[m]||"")]; };
  var yl=grid(d,{x:x,w:half,y:y,center:1,head:["Base Metals","Specification","Type or Grade","AWS Group No."],
    body:[metal("Base Material",p.base),metal("Welded To",p.baseTo||p.base),metal("Backing Material",backMat),["Other","—","—","—"]]});
  var tr=function(k,v,pw){ return [k,dash(v),dash(pw)]; };
  var yr=grid(d,{x:xr,w:half,y:y,center:1,head:["Base Metal Thickness","As-Welded","With PWHT"],body:[
    tr("CJP Groove Welds", cjp?p.thickRange:"", cjp&&p.pwhtTemp?p.thickRange:""),
    tr("CJP Groove Weld w/CVN", cjp&&p.cvn?p.thickRange:"", ""),
    tr("PJP Groove Welds", pjp?p.thickRange:"", pjp&&p.pwhtTemp?p.thickRange:""),
    tr("Fillet Welds", groove?"":p.thickRange, !groove&&p.pwhtTemp?p.thickRange:""),
    tr("Diameter (If Applicable)", p.diaRange, "")]});
  y=Math.max(yl,yr)+PG.gap;

  var jt=groove ? [p.groove,"groove",p.jointType?p.jointType.toLowerCase()+" joint":""].filter(Boolean).join(" ")
                : "Fillet, "+(p.jointType||"")+(p.filletSize?" — "+p.filletSize:"");
  yl=grid(d,{x:x,w:half,y:y,col:{0:{cellWidth:96}},head:[{content:"Joint Details",colSpan:2}],body:[
    ["Groove Type",dash(jt)],["Groove Angle",dash(groove?p.angle:"")],["Root Opening",dash(groove?p.rootOpening:"")],["Root Face",dash(groove?p.rootFace:"")],
    ["Backing",dash(groove?[p.backing,backMat].filter(Boolean).join(" — "):"")],["Backgouging Method",dash(p.backgouge||"None")],
    ["PWHT Temperature",dash(p.pwhtTemp)],["PWHT Time at Temp.",dash(p.pwhtTime)]]});
  var desc=(p.title?p.title+"\n":"")+(groove
    ? [p.jointType,p.groove,p.angle,p.rootOpening?"root opening "+p.rootOpening:"",p.rootFace?"root face "+p.rootFace:"",p.backing].filter(Boolean).join("  ·  ")
    : "Fillet "+(p.filletSize||""));
  yr=grid(d,{x:xr,w:half,y:y,col:{0:{cellWidth:150}},head:[{content:"Joint Details",colSpan:2}],body:[
    [{content:desc,colSpan:2,styles:{halign:"center",minCellHeight:52,fontStyle:"normal"}}],
    ["Pre-Qualified per "+CFG.code, boxCell(p.basis!="Qualified by PQR")],
    ["Pre-Qualified Joint Designation", dash(p.jointDesig)]],
    parse:function(c){ if(c.section=="body"&&c.row.index>0&&c.column.index==1) c.cell.styles.halign="center"; }});
  y=greyBar(d,Math.max(yl,yr)+PG.gap,"Procedure");

  var yL=y, yR=y, lab={0:{cellWidth:110}};
  yL=grid(d,{x:x,w:half,y:yL,col:lab,body:[["Process",dash(p.process)],["Type",manual],["Position",dash(p.positions)],["Progression",dash(p.progression)]]})+PG.gap;
  yL=grid(d,{x:x,w:half,y:yL,col:lab,head:[{content:"Electrical Characteristics",colSpan:2}],body:[
    ["Current Type & Polarity",dash(p.polarity)],["Transfer Mode",dash(p.transfer)],["Amps",dash(p.amps)],["Voltage",dash(p.volts)],
    ["Wire Feed Speed",dash(p.wfs?p.wfs+" ipm":"")],["Travel Speed",dash(p.travel?p.travel+" ipm":"")],["Power Source",dash(p.powerSource)]]})+PG.gap;
  if(gasProc) yL=grid(d,{x:x,w:half,y:yL,col:lab,head:["Shielding Gas (Composition)",dash(p.gas)],body:[
    ["Flow Rate",dash(p.flow?p.flow+" cfh":"")],["Nozzle Size",dash(p.nozzle)],["Contact Tube to Work Distance",dash(p.ctwd)]]})+PG.gap;

  yR=grid(d,{x:xr,w:half,y:yR,col:lab,head:["Filler Metal (AWS Spec.)",dash(fillerSpecFor(p.filler)||p.fillerSpec)],body:[
    ["AWS Classification",dash(p.filler)],["Electrode Diameter",dash(p.fillerDia)],["Manufacturer Name",dash(p.fillerMfr)]]})+PG.gap;
  yR=grid(d,{x:xr,w:half,y:yR,bold:[0,2],col:{1:{cellWidth:24},3:{cellWidth:24}},head:[{content:"Technique",colSpan:4}],body:[
    ["Multi Pass",boxCell(p.passes=="Multiple pass"),"Single Pass",boxCell(p.passes=="Single pass")],
    ["Stringer",boxCell(p.bead=="Stringer"||p.bead=="Either"),"Weave",boxCell(p.bead=="Weave"||p.bead=="Either")],
    ["Peening",{content:dash(p.peening||"None"),colSpan:3}],
    ["Interpass Cleaning",{content:dash(p.cleaning),colSpan:3}]]})+PG.gap;
  yR=grid(d,{x:xr,w:half,y:yR,col:lab,head:["Preheat Temperature",dash(p.preheat)],body:[["Interpass Temperature",dash(p.interpass)]]})+PG.gap;
  y=Math.max(yL,yR);
  if(p.notes) y=grid(d,{x:x,w:W,y:y,bold:[],head:["Notes"],body:[[p.notes]]})+PG.gap;
  signature(d,y,"",null);
  return d;
}

function copy(t){ try{ navigator.clipboard.writeText(t); }catch(e){} }

function openRecord(id){
  var r=records().filter(function(x){return x.id==id})[0]; if(!r) return;
  S.w=Object.assign(blankW(),r.w); S.r=Object.assign(blankR(),r.r); S.recId=r.id; go("inspect");
}
function startIntake(pre,preview,wps){
  S.w=blankW(); S.r=blankR(); S.step=0; S.preview=!!preview; S.wps=wps||null;
  if(pre){ if(pre.companyId){S.w.companyId=pre.companyId;} if(pre.company||pre.companyLabel){S.w.company=pre.company||pre.companyLabel;}
    if(pre.name)S.w.name=pre.name; if(pre.wpsId)S.w.wpsId=pre.wpsId; if(pre.wps||pre.wpsLabel)S.w.wps=pre.wps||pre.wpsLabel;
    if(pre.position){ S.w.position=pre.position; if(/F$/.test(pre.position))S.w.weldType="fillet"; if(["5G","6G","2G+5G"].indexOf(pre.position)>-1)S.w.product="pipe"; }
    if(pre.process)S.w.process=pre.process; }
  S.lockedPos=!!(pre&&pre.position);
  if(wps) prefillFromWps(wps);
  if(pre&&pre.position){ S.w.position=pre.position; if(/F$/.test(pre.position))S.w.weldType="fillet"; }
  S.stack=[]; S.screen="intake"; render();
}
/* Only pre-pick what the form has a tile for; anything else stays a
   blank the welder fills. The card still shows the full WPS. */
function prefillFromWps(p){
  var w=S.w;
  if(p.process) w.process=p.process;
  if(p.transfer) w.transfer=p.transfer;
  var fl=FILLERS[w.process]||[], gs=GASES[w.process]||[];
  if(p.filler){ if(fl.indexOf(p.filler)>-1) w.filler=p.filler; else { w.filler="Other"; w.fillerOther=p.filler; } }
  // A WPS may give a range (".045\" to 1/16\"", "30–40"); then the welder picks the one they pulled.
  if(p.fillerDia && (DIAMS[w.process]||[]).some(function(d){return d.v==p.fillerDia})) w.fillerDia=p.fillerDia;
  if(gs[0]=="None") w.gas="None";
  else if(p.gas){ if(gs.indexOf(p.gas)>-1) w.gas=p.gas; else { w.gas="Other"; w.gasOther=p.gas; } }
  if(p.flow && FLOWS.some(function(f){return f.v==String(p.flow)})) w.flow=String(p.flow);
  if(p.base) w.base=p.base;
  if(p.weldType) w.weldType = p.weldType=="Fillet" ? "fillet" : "groove";
  if(p.backing) w.backing = p.backing=="No backing" ? "without" : "with";
  if(p.progression) w.progression=p.progression;
  if(!w.wps) w.wps=wpsLabel(p);
}

/* ---------- server round trips ---------- */
function createTicket(btn){
  var d=S.draft;
  if(!sb||!AUTH.org){ toast("Not signed in."); return; }
  var p=wpsById(d.wpsId);
  var t={ id:token(), org_id:AUTH.org.id,
    data:{ companyId:d.companyId||"", company:coName(d.companyId), name:d.name||"",
           wpsId:d.wpsId||"", wps:wpsLabel(p), position:d.position||"", process:d.process||"" },
    wps: p ? Object.assign({},p) : null,
    org_info:{ shop:CFG.shop, city:CFG.city, inspector:CFG.inspector, code:CFG.code } };
  if(t.wps) delete t.wps._demo;
  btn.disabled=true; btn.textContent="Creating…";
  sb.from("tickets").insert(t).then(function(res){
    if(res.error){ btn.disabled=false; btn.textContent="Create link"; toast("Couldn't create the ticket — "+res.error.message); return; }
    S.ticket=t; go("ticketlink");
  });
}
function sendIntake(btn){
  if(S.preview||!S.ticketId){ S.screen="sent"; render(); return; }
  btn.disabled=true; btn.textContent="Sending…";
  sb.rpc("submit_ticket",{ tid:S.ticketId, payload:S.w }).then(function(res){
    var er=document.getElementById("senderr");
    if(res.error){ btn.disabled=false; btn.textContent="Send to inspector"; if(er){ er.textContent="Didn't go through — "+res.error.message+". Check your signal and try again."; er.style.display="block"; } return; }
    if(res.data=="closed"){ S.screen="closed"; S.draft={title:"Already sent",msg:"This ticket was already submitted. If something is wrong on it, tell the inspector."}; render(); return; }
    if(res.data!="ok"){ S.screen="closed"; S.draft={title:"Ticket not found",msg:"Ask the inspector to send a new link."}; render(); return; }
    S.screen="sent"; render();
  });
}
function welderBoot(tid){
  S.screen="loading"; S.draft={msg:"Opening your ticket…"}; render();
  if(!sb){ S.screen="closed"; S.draft={title:"Can't reach the server",msg:"Check your signal and reopen the link."}; render(); return; }
  sb.rpc("get_ticket",{tid:tid}).then(function(res){
    var t=res.data;
    if(res.error||!t){ S.screen="closed"; S.draft={title:"Ticket not found",msg:"This link doesn't match a ticket. Ask the inspector to send it again."}; render(); return; }
    CFG=Object.assign({},CFG,t.org||{});
    if(t.status!="open"){ S.ticket=t; S.wps=t.wps||null; S.screen="myticket"; render(); return; }
    S.ticketId=t.id; startIntake(t.data||{}, false, t.wps||null);
  });
}

/* ---------- inspector sign-in ---------- */
function authErr(msg){ var e=document.getElementById("autherr"); if(e){ e.textContent=msg; e.style.display="block"; } }
function authFields(needPass){
  var email=(S.draft.email||"").trim(), pw=S.draft.password||"";
  if(!/^\S+@\S+\.\S+$/.test(email)){ authErr("That doesn't look like an email address."); return null; }
  if(needPass && pw.length<8){ authErr("Password needs to be at least 8 characters."); return null; }
  return { email:email, password:pw };
}
function signIn(){
  var f=authFields(true); if(!f) return;
  sb.auth.signInWithPassword(f).then(function(res){
    if(res.error){ authErr(/invalid/i.test(res.error.message)?"Wrong email or password.":res.error.message); return; }
    afterSignIn();
  });
}
function signUp(){
  var f=authFields(true); if(!f) return;
  sb.auth.signUp({ email:f.email, password:f.password, options:{ emailRedirectTo:linkBase() } }).then(function(res){
    if(res.error){ authErr(res.error.message); return; }
    if(res.data&&res.data.session){ afterSignIn(); return; }
    // Email confirmation is on for this project: they confirm, then sign in.
    S.draft={email:f.email,mode:"in",note:"Check your email for a confirmation link, then sign in here."}; render();
  });
}
function sendReset(){
  var f=authFields(false); if(!f) return;
  sb.auth.resetPasswordForEmail(f.email,{ redirectTo:linkBase() }).then(function(res){
    if(res.error){ authErr(res.error.message); return; }
    S.draft={email:f.email,mode:"in",note:"Reset link sent. Open it on this device and you'll be asked for a new password."}; render();
  });
}
function setPassword(){
  var pw=S.draft.password||"";
  if(pw.length<8){ authErr("Password needs to be at least 8 characters."); return; }
  sb.auth.updateUser({ password:pw }).then(function(res){
    if(res.error){ authErr(res.error.message); return; }
    afterSignIn();
  });
}
function finishOnboard(){
  var d=S.draft;
  if(!d.shop||!d.inspector){ authErr("The company name and your name are needed for the certificate header."); return; }
  sb.rpc("create_org",{ p_name:d.shop, p_city:d.city||"", p_code:d.code||"AWS D1.1:2025", p_inspector:d.inspector, p_cert:d.cert||"" }).then(function(res){
    if(res.error){ authErr(res.error.message); return; }
    afterSignIn();
  });
}
/* The session itself is kept by supabase-js in localStorage and renewed
   in the background, so a returning inspector is already signed in.
   The profile + org are cached too, so a bad signal on open shows the
   console from cache instead of bouncing to the sign-in screen. */
function afterSignIn(){
  S.screen="loading"; S.draft={msg:"Loading your records…"}; render();
  sb.auth.getSession().then(function(res){
    var sess=res.data&&res.data.session;
    AUTH.user=sess&&sess.user;
    if(!AUTH.user){ S.screen="login"; S.draft={}; render(); return; }
    var cached=null; try{ cached=JSON.parse(raw.get("wq.profile."+AUTH.user.id)||"null"); }catch(e){}
    function enter(profile, org){
      AUTH.profile=profile; AUTH.org=org; cfgFromAuth();
      raw.set("wq.profile."+AUTH.user.id, JSON.stringify({profile:profile, org:org}));
      S.stack=[]; S.screen="home"; S.draft={}; render();
      return loadAll().then(function(){ if(!S.preview) render({keepScroll:true}); });
    }
    return sb.from("profiles").select("*, orgs(*)").eq("user_id",AUTH.user.id).maybeSingle().then(function(res){
      if(res.error){
        if(cached&&cached.org){ toast("No signal — showing what's saved on this phone."); return enter(cached.profile, cached.org); }
        S.screen="login"; S.draft={note:"Couldn't reach the server. Check your signal and try again."}; render(); return;
      }
      if(!res.data){ S.screen="onboard"; S.draft={code:"AWS D1.1:2025"}; render(); return; }
      return enter(res.data, res.data.orgs);
    });
  });
}

function pick(v,group){
  if(group=="tpos"){ S.draft.position=v; render({keepScroll:true}); return; }
  if(group=="tproc"||group=="wproc"){ S.draft.process=v; render({keepScroll:true}); return; }
  if(group&&group.slice(0,2)=="d:"){
    var k=group.slice(2); S.draft[k]=(S.draft[k]===v?"":v);
    if(k=="filler"){ var sp=fillerSpecFor(S.draft.filler); if(sp) S.draft.fillerSpec=sp; }
    render({keepScroll:true}); return;
  }
  var w=S.w;
  if(group&&group.slice(0,2)=="w:"){
    var key=group.slice(2);
    w[key]=v;
    if(key=="weldType"||key=="product") w.position="";
    if(key=="process"){ w.filler=""; w.gas=""; w.transfer=""; w.fillerDia=""; w.flow=""; }
  }
  render({keepScroll:true});
}

function onField(e){
  var t=e.target;
  if(t.dataset.k){ S.w[t.dataset.k]=t.value; if(S.screen=="intake"&&lastStep()) render({keepScroll:true}); else if(t.tagName=="SELECT") render({keepScroll:true}); else refreshBar(); }
  else if(t.dataset.r){ S.r[t.dataset.r]=(t.type=="checkbox")?t.checked:t.value; if(t.type=="checkbox"||t.tagName=="SELECT") render({keepScroll:true}); else refreshBar(); }
  else if(t.dataset.d){ S.draft[t.dataset.d]=t.value; if(t.tagName=="SELECT") render({keepScroll:true}); }
  else if(t.dataset.c){ CFG[t.dataset.c]=t.value; }
}
/* Safari on iOS fires only "change" for select and checkbox, never "input" */
document.addEventListener("input", function(e){
  var t=e.target; if(t.tagName=="SELECT"||t.type=="checkbox") return;
  onField(e);
});
document.addEventListener("change", function(e){
  var t=e.target;
  if(t.id=="logofile"&&t.files&&t.files[0]){ readLogo(t.files[0], function(d){ CFG.logo=d; render({keepScroll:true}); }); return; }
  if(t.tagName=="SELECT"||t.type=="checkbox") onField(e);
});
/* Shrink a chosen image to a small PNG data URL for the letterhead. */
function readLogo(file, done){
  var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){
    var max=360, sc=Math.min(1, max/Math.max(img.width,img.height));
    var c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); done(c.toDataURL("image/png"));
  };
  img.onerror=function(){ URL.revokeObjectURL(url); toast("Couldn't read that image."); };
  img.src=url;
}
/* Enter in a sign-in field presses the button under it */
document.addEventListener("keydown", function(e){
  if(e.key!="Enter" || ["login","newpass","onboard"].indexOf(S.screen)<0 || e.target.tagName!="INPUT") return;
  var b=app.querySelector("button.primary"); if(b){ e.preventDefault(); b.click(); }
});
function refreshBar(){
  var p=bar.querySelector('button.primary[data-act=pdfrec]'); if(p) p.disabled=!(S.r.verified&&S.r.result);
  var n=bar.querySelector('[data-act=isend]'); if(n) n.disabled=missing().length>0;
}

/* ---------- boot ----------
   ?t=<ticket>  → a welder opened their link. No sign-in, no console.
   otherwise    → inspector. Session in hand → console; none → sign in.
   Supabase puts its own tokens in the hash after a magic link; the
   client library consumes them on load. */
(function(){
  loadPdfLib().catch(function(){});
  var tid=new URLSearchParams(location.search).get("t");
  if(tid){ welderBoot(tid); return; }
  if(!sb){ S.screen="closed"; S.draft={title:"Can't reach the server",msg:"Check your connection and reload."}; render(); return; }
  S.screen="loading"; S.draft={msg:"Signing in…"}; render();
  sb.auth.getSession().then(function(res){
    if(res.data&&res.data.session) afterSignIn();
    else { S.screen="login"; S.draft={}; render(); }
  });
  sb.auth.onAuthStateChange(function(ev){
    if(ev=="PASSWORD_RECOVERY"){ S.screen="newpass"; S.draft={}; render(); return; }
    if(ev=="SIGNED_IN" && S.screen=="login") afterSignIn();
  });
  // Coming back to the app is when a welder's ticket is most likely to
  // have landed. Refetch quietly on the console screens.
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState!="visible" || !AUTH.org) return;
    if(["home","records","company","companies"].indexOf(S.screen)>-1) loadAll().then(function(){ render({keepScroll:true}); });
  });
})();
</script>
