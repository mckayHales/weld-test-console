<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16212B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weld Sync">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Weld Sync</title>
<style>
:root{
  --ink:#16212B; --panel:#1E2B36; --panel2:#263644; --line:#3A4C5C;
  --paper:#E9ECEE; --muted:#93A5B3; --arc:#7FB8FF; --gold:#D8A527;
  --slag:#C0533A; --ok:#57A773; --r:10px;
  --bar:#5896DC;   /* chart bars: arc blue a step deeper, so it doesn't glare on the dark cards */
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* The page is a column: a scrolling content area and a footer bar that
   never floats. A fixed bar over a scrolling document drifts and hides
   the bottom of forms on iPhone home-screen apps; this doesn't. */
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#app{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:44rem;margin:0 auto;padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px 40px}

/* nav */
.nav{display:flex;align-items:center;gap:10px;padding:14px 0 6px;min-height:52px}
.nav button{background:none;border:0;color:var(--arc);font:inherit;font-size:.95rem;padding:6px 2px;cursor:pointer}
.nav .title{flex:1;text-align:center;font-size:.95rem;color:var(--muted)}
.nav .spacer{width:56px}

/* ticket header */
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:6px 0 20px;overflow:hidden}
.ticket-top{padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.shop{font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
.ticket h1{font-size:1.45rem;line-height:1.15;margin:2px 0 0;font-weight:650;letter-spacing:-.01em}
.ticket h1 span{display:block;font-weight:400;font-size:.92rem;color:var(--muted);letter-spacing:0;margin-top:6px}
.code-chip{flex:none;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:6px 9px;font-size:.72rem;line-height:1.25;text-align:center}
.perf{height:0;border-top:2px dashed var(--line);position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:1px solid var(--line)}
.perf::before{left:-9px}.perf::after{right:-9px}
.ticket-bottom{padding:12px 18px 16px;font-size:.85rem;color:var(--muted)}

/* home menu */
.menu{display:grid;gap:10px;margin:0 0 22px}
.mi{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--paper);font:inherit;text-align:left;width:100%;cursor:pointer}
.mi .ic{flex:none;width:40px;height:40px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.mi b{display:block;font-size:1.02rem;font-weight:600}
.mi span{color:var(--muted);font-size:.85rem}
.mi .go{margin-left:auto;color:var(--muted)}
.mi.hero{background:linear-gradient(180deg,#24455F,#1E3448);border-color:#3C6789}
.mi.hero .ic{background:rgba(127,184,255,.16)}

/* generic */
h2.step{font-size:1.18rem;margin:0 0 4px;font-weight:600}
p.hint{margin:0 0 18px;color:var(--muted);font-size:.9rem}
.field{margin:0 0 18px}
.field>label{display:block;font-size:.9rem;margin-bottom:7px;color:#C6D2DB}
.req{color:var(--gold)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],select,textarea{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--paper);
  border-radius:8px;padding:13px 12px;font-size:17px;font-family:inherit}
textarea{min-height:76px;resize:vertical}
/* iOS gives a date box a built-in width that won't shrink; in a two-up
   row it pushed into the field beside it. */
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;min-height:50px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--arc);outline-offset:1px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
.tiles.wide{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:12px 8px;font:inherit;font-size:.95rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:54px;justify-content:center;text-align:center}
.tile small{color:var(--muted);font-size:.72rem;line-height:1.2}
.tile[aria-pressed=true]{border-color:var(--arc);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--arc)}
.tile[aria-pressed=true] small{color:#B9D5F5}
.tile .g1{stroke:var(--muted);stroke-width:2;fill:none}
.tile .g2{stroke:var(--arc);stroke-width:3;fill:none;stroke-linecap:round}
.tile[aria-pressed=true] .g1{stroke:#C6D2DB}

.bar{flex:none;background:var(--ink);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .inner{max-width:44rem;margin:0 auto;display:flex;gap:10px}
button.primary{flex:2;background:var(--arc);color:#0D1720;border:0;border-radius:8px;padding:15px;font:inherit;font-weight:650;font-size:17px;cursor:pointer}
button.ghost{flex:1;background:transparent;color:var(--paper);border:1px solid var(--line);border-radius:8px;padding:15px;font:inherit;font-size:17px;cursor:pointer}
button.primary:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card h3{margin:0 0 12px;font-size:1rem;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.flag{border-left:3px solid var(--gold);background:rgba(216,165,39,.08);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.9rem;margin:0 0 16px}
.flag b{color:var(--gold);font-weight:600}
.check{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px;cursor:pointer;font-size:.92rem}
.check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--arc)}
.res{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.seg{display:flex;gap:6px;flex:none}
.seg button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:8px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed=true]{color:#0D1720;font-weight:650}
.seg button.p[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.seg button.f[aria-pressed=true]{background:var(--slag);border-color:var(--slag);color:#fff}
.linkbox{background:#0F1820;border:1px solid var(--line);border-radius:8px;padding:11px;font-size:.72rem;word-break:break-all;color:var(--muted);max-height:90px;overflow:auto;margin-bottom:12px}
.sub{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:14px;font:inherit;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px}
.sub b{display:block;font-size:1rem;font-weight:600}
.sub span{color:var(--muted);font-size:.84rem}
.sub .go{margin-left:auto;color:var(--muted);flex:none}
.pill{font-size:.72rem;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);flex:none}
.pill.ok{color:var(--ok);border-color:rgba(87,167,115,.5)}
.pill.no{color:var(--slag);border-color:rgba(192,83,58,.5)}
.pill.wait{color:var(--gold);border-color:rgba(216,165,39,.5)}
.mini{background:none;border:0;color:var(--arc);font:inherit;font-size:.88rem;padding:6px 0;cursor:pointer;text-decoration:underline}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin:26px 0 0;line-height:1.6}
.err{color:var(--slag);font-size:.85rem;margin-top:6px}
.empty{text-align:center;color:var(--muted);font-size:.92rem;padding:28px 10px}
.rail{display:flex;gap:5px;margin:0 0 22px}
.rail i{flex:1;height:4px;background:var(--line);border-radius:2px}
.rail i.on{background:var(--arc)}.rail i.done{background:#4a6f93}
#toast{display:none;position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:44rem;margin:0 auto;background:var(--panel2);border:1px solid var(--line);color:var(--paper);padding:12px 16px;border-radius:8px;font-size:.9rem;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.4);align-items:center;gap:12px}
.controw{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.controw:first-of-type{border-top:0}
#toast.bad{background:var(--slag);border-color:var(--slag);color:#fff}
#toast.bad button{color:#fff;text-decoration:underline;font-weight:700}
#toast span{flex:1}
#toast button{background:none;border:0;color:var(--arc);font:inherit;font-weight:650;padding:4px 2px;cursor:pointer}
/* Swipe a row left for Delete, the way Messages and Mail do it. */
.sw{position:relative;overflow:hidden;border-radius:8px;margin-bottom:8px}
.sw>.sub{margin:0;position:relative;z-index:1;touch-action:pan-y;transition:transform .22s ease;will-change:transform}
.sw.drag>.sub{transition:none}
.sw-act{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;justify-content:flex-end;background:var(--slag);border-radius:8px}
.sw-act button{width:88px;background:none;border:0;color:#fff;font:inherit;font-weight:650;font-size:.95rem;cursor:pointer}
.wps-card{border-color:#3C6789;background:linear-gradient(180deg,#22405A,#1E3448)}
.wps-card h3{display:flex;align-items:center;gap:8px}
.wps-card h3 small{font-weight:400;color:var(--muted);font-size:.8rem}
.wps-card .kv dd{color:#EAF2FA}
.code-in{letter-spacing:.35em;text-align:center;font-size:26px!important;font-variant-numeric:tabular-nums}
.signin{margin-top:8vh}
.lhead{display:flex;gap:6px;font-size:.7rem;color:var(--muted);margin-bottom:4px;padding:0 2px}
.lrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.lrow input,.lrow select{padding:8px 6px;font-size:14px;min-width:0;flex:1}
.invline{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--panel2)}
.invline>textarea{width:100%;font-size:15px;padding:9px 10px;min-height:0;height:auto;resize:vertical;line-height:1.35}
.lmini{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);flex:1;min-width:0}
.lmini input{width:100%}
.lamt{flex:1.2;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;align-self:flex-end;padding-bottom:9px}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.rates input{padding:9px 8px;font-size:15px}
/* Invoices | Earnings, and the Earnings tab */
.seg.tabs{margin:0 0 14px}
.seg.tabs button{flex:1;padding:10px 8px;font-size:.92rem}
.seg.tabs button[aria-pressed=true]{background:var(--arc);border-color:var(--arc)}
.seg.per{margin:22px 0 12px}
.seg.per button{flex:1;padding:8px 4px;font-size:.84rem}
.seg.per button[aria-pressed=true]{color:var(--arc);border-color:var(--arc);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .kl{display:block;font-size:.8rem;color:var(--muted)}
.kpi b{display:block;font-size:1.45rem;font-weight:650;letter-spacing:-.01em;margin:2px 0}
.kpi .kd{display:block;font-size:.76rem;color:var(--muted);line-height:1.3}
.kd .up{color:var(--ok)}.kd .dn{color:var(--slag)}
.etake{margin:-4px 0 12px;font-size:.9rem;color:#C6D2DB;line-height:1.45}
.enote{margin:4px 0 0;font-size:.82rem;color:var(--muted);line-height:1.45}
.elabel{margin:16px 0 8px;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sub .eright{flex:none;text-align:right;font-weight:600;font-size:.98rem;color:var(--paper);font-variant-numeric:tabular-nums}
.sub .eright small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.elist>.erow:first-child{border-top:0;padding-top:2px}
.erow{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--paper);font:inherit;padding:12px 0}
button.erow{cursor:pointer}
.etop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.etop b{font-weight:600;font-size:.98rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.etop .eamt{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.ebar{height:8px;margin:8px 0 6px}
.ebar i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.esub{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:12px;font-size:.82rem;color:var(--muted)}
.esub span:last-child{margin-left:auto}
.hrsbox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mplot{position:relative;height:140px;margin:10px 0 0 48px}
.mgrid{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line);font-style:normal}
.mgrid span{position:absolute;right:calc(100% + 6px);top:-.6em;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mcols{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:flex-end;gap:2px}
.mcol{flex:1;height:100%;min-width:0;display:flex;align-items:flex-end;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
.mcol i{display:block;width:min(24px,70%);background:var(--bar);border-radius:4px 4px 0 0}
.mcol:hover i,.mcol:focus-visible i,.mcol[aria-pressed=true] i{background:var(--arc)}
.mmax{position:absolute;transform:translate(-50%,-4px);font-style:normal;font-size:.72rem;color:var(--paper);white-space:nowrap;pointer-events:none}
.mmax.l{transform:translate(-20%,-4px)}.mmax.r{transform:translate(-80%,-4px)}
.mtip{position:absolute;z-index:2;transform:translate(-50%,-100%);background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.78rem;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.mtip b{display:block;font-size:.95rem;font-weight:650}
.mtip span{display:block;color:var(--muted)}
.mx{display:flex;gap:2px;margin:6px 0 4px 48px}
.mx span{flex:1;min-width:0;text-align:center;font-size:.7rem;color:var(--muted);white-space:nowrap}
.mtable{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:6px;font-variant-numeric:tabular-nums}
.mtable th,.mtable td{padding:6px 4px;border-top:1px solid var(--line);text-align:right}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable th{color:var(--muted);font-weight:500;border-top:0}
.pdfframe{width:100%;height:calc(100vh - 230px);height:calc(100dvh - 230px);min-height:420px;border:1px solid var(--line);border-radius:8px;background:#fff}
/* The PDF preview: every page drawn to the screen's width, whole page in
   view. A pinch scales the wrapper (instant, on the GPU) and the sizer
   holds the scroll room open while the fingers are down; the pages are
   redrawn at the settled scale so the text ends up sharp. */
.pdfzoom{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
.pdfzoom button{background:var(--panel2);border:1px solid var(--line);color:var(--paper);border-radius:6px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.pdfzoom button[aria-pressed=true]{border-color:var(--arc);color:var(--arc)}
.pdfpages{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:8px;background:#55606b;padding:8px;touch-action:pan-x pan-y;overscroll-behavior:contain}
.pdfsizer{width:max-content;min-width:100%}
.pdfzoomwrap{width:max-content;min-width:100%;transform-origin:0 0}
.pdfpages canvas{display:block;background:#fff;margin:0 auto 8px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pdfpages canvas:last-child{margin-bottom:0}
/* Printing: only the page images, one per sheet, edge to edge on letter.
   The app's own layout (a fixed-height column) is switched off. */
#printpages{display:none}
@media print{
  @page{size:letter portrait;margin:0}
  html,body{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
  body>*{display:none!important}
  #printpages{display:block!important}
  #printpages img{display:block;width:100%;height:auto;max-height:10.4in;object-fit:contain;margin:0 auto;break-after:page;page-break-after:always}
  #printpages img:last-child{break-after:auto;page-break-after:auto}
}

</style>
</head>
<body>
<div id="app"><div class="wrap" id="view"></div></div>
<div class="bar" id="bar"></div>
<div id="toast"></div>
<div id="printpages" aria-hidden="true"></div>
<script>
/* =========================================================
   Weld Sync — inspector side + welder ticket links
   One page, no server. The inspector's data lives on this phone.
   A ticket goes out as a link with everything the welder needs in
   it; the welder's answers come back as a link the same way.
   ========================================================= */

var VERSION="2026-11-26.1";

/* ---------- storage ----------
   Everything is in localStorage on this device. Export a backup from
   Settings now and then — there is no other copy. */
var mem={};
var raw={ get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},
          set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},
          del:function(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}} };
function ns(k){ return "wq.local."+k; }
var db={
  get:function(k,d){ try{ var v=JSON.parse(raw.get(ns(k))||"null"); return v===null?d:v; }catch(e){ return d; } },
  set:function(k,v){ raw.set(ns(k), JSON.stringify(v)); }
};
function hosted(){ return /^https?:/.test(location.origin||""); }
function linkBase(){ return hosted() ? location.origin+location.pathname : ""; }
/* The folder the app is served from; the two link pages sit beside it. */
function linkDir(){ return hosted() ? location.origin+location.pathname.replace(/[^\/]*$/,"") : ""; }

/* ---------- the link codec ----------
   A link carries its data after the #, which never leaves the phone that
   opens it (browsers don't send it to the server). Both links are
   deflated so they run about half as long. The finished ticket is also
   sealed to the inspector's key: ECDH P-256 with a one-time key from the
   welder's phone, AES-GCM over the data. Only the inspector's phone —
   or a backup of it — can open it. */
function b64u(u8){ var s=""; for(var i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(str){ var b=String(str).replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="="; var r=atob(b), u=new Uint8Array(r.length); for(var i=0;i<r.length;i++) u[i]=r.charCodeAt(i); return u; }
function joinBytes(list){ var n=0; list.forEach(function(a){ n+=a.length; }); var u=new Uint8Array(n), o=0; list.forEach(function(a){ u.set(a,o); o+=a.length; }); return u; }
/* Older phones (iOS before 16.4) lack the built-in compressor; they get
   pako from the CDN instead. */
var pakoLoading=null;
function loadPako(){
  if(window.pako) return Promise.resolve(window.pako);
  if(pakoLoading) return pakoLoading;
  pakoLoading=new Promise(function(ok,no){ var sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js";
    sc.onload=function(){ ok(window.pako); }; sc.onerror=function(){ pakoLoading=null; no(new Error("pako")); }; document.head.appendChild(sc); });
  return pakoLoading;
}
function streamThrough(u8,ts){ var w=ts.writable.getWriter(); w.write(u8); w.close(); return new Response(ts.readable).arrayBuffer().then(function(b){ return new Uint8Array(b); }); }

function cityStateZip(c,st,z){ return [c,[st,z].filter(Boolean).join(" ")].filter(Boolean).join(", "); }
/* Best-effort split of "1680 W 1600 S - Springville Utah 84663" or
   "Street, City, ST ZIP" into parts. */
function parseAddress(str){
  var out={Street:"",City:"",State:"",Zip:""}, t=String(str||"").trim(); if(!t) return out;
  var z=t.match(/\b(\d{5})(?:-(\d{4}))?\s*$/); if(z){ out.Zip=z[1]+(z[2]?"-"+z[2]:""); t=t.slice(0,z.index).trim().replace(/,$/,""); }
  var low=t.toLowerCase(), names=Object.keys(STATE_NAMES).sort(function(a,b){return b.length-a.length});
  for(var i=0;i<names.length;i++){ var n=names[i]; if(low.slice(-n.length)==n&&(low.length==n.length||/[\s,]/.test(low.charAt(low.length-n.length-1)))){ out.State=STATE_NAMES[n]; t=t.slice(0,t.length-n.length).trim(); break; } }
  if(!out.State){ var m=t.match(/[\s,]([A-Za-z]{2})$/); if(m&&STATES.indexOf(m[1].toUpperCase())>-1){ out.State=m[1].toUpperCase(); t=t.slice(0,m.index).trim(); } }
  t=t.replace(/[,\-–]\s*$/,"").trim();
  var parts=t.split(/\s*(?:,|\s[-–]\s)\s*/).filter(Boolean);
  if(parts.length>=2){ out.City=parts.pop(); out.Street=parts.join(", "); }

}
function addrInit(pre){

  var parts;
  if(cf.street){ parts=parseAddress(d[cf.line2]||""); parts.Street=d[cf.street]||""; }
  else { parts=parseAddress(d[cf.line]||""); if(cf.cityLine&&!parts.City&&d[cf.cityLine]){ var c=parseAddress(d[cf.cityLine]); parts.City=c.City||c.Street; parts.State=parts.State||c.State; } }
  ["Street","City","State","Zip"].forEach(function(k){ d[pre+k]=parts[k]||""; });

}

    +'<div class="row"><div class="field" style="flex:2.2"><label>City</label><input type="text" data-ad="'+pre+':City" value="'+v("City")+'" autocapitalize="words" autocomplete="address-level2"></div>'

/* A ticket can cover more than one plate: 3G and 4G is the usual pair.
   w.positions holds them on the welder's side; each becomes its own
   record when the Finished Ticket comes in. w.position stays the first,
   so everything that reads one position keeps working. */
function posList(w){ return w.positions&&w.positions.length ? w.positions.slice() : (w.position?[w.position]:[]); }
function anyVertical(w){ return posList(w).some(isVertical); }
/* Tap a position to add it or take it off. A combined tile ("3G+4G" —
   both plates on one record) stands alone. */
function togglePos(list,v){
  list=(list||[]).slice();
  if(!v) return [];
  if(/\+/.test(v)) return list.indexOf(v)>-1 ? [] : [v];
  list=list.filter(function(x){ return !/\+/.test(x); });
  var i=list.indexOf(v); if(i>-1) list.splice(i,1); else list.push(v);
  var order=["1G","2G","3G","4G","5G","6G","1F","2F","3F","4F"];
  return list.sort(function(a,b){ return order.indexOf(a)-order.indexOf(b); });
}
function isVertical(pos){ return /3G|5G|6G|3F/.test(pos||""); }
function fmtDate(s){ if(!s)return ""; var p=String(s).split("-"); return p.length==3?p[1]+"/"+p[2]+"/"+p[0]:s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function enc(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function dec(s){ try{ var b=s.replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4)b+="="; return JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){ return null; } }
function frac(n){
  if(n==null||n===""||(typeof n=="number"&&isNaN(n)))return ""; var v=parseFloat(n); if(isNaN(v))return String(n);
  var map=[[0.0625,'1/16'],[0.125,'1/8'],[0.1875,'3/16'],[0.25,'1/4'],[0.3125,'5/16'],[0.375,'3/8'],[0.4375,'7/16'],[0.5,'1/2'],[0.625,'5/8'],[0.75,'3/4'],[0.875,'7/8']];
  var w=Math.floor(v), rem=+(v-w).toFixed(4), best=null;
  for(var i=0;i<map.length;i++) if(Math.abs(map[i][0]-rem)<0.002) best=map[i][1];
  if(rem===0) return w+'"';

  return v.toFixed(3).replace(/0+$/,"").replace(/\.$/,"")+'"';
}
/* Coupon thickness. On pipe it is the wall; older records kept the wall

function tVal(w){
  var t=w.thickness=="custom"?parseFloat(w.thicknessCustom):parseFloat(w.thickness);

}

/* ---------- qualified range drafts ----------
   Everything here is a draft the inspector edits and verifies against
   the code book; nothing prints without the checkbox. */
var POS_MAP={ "groove-plate":{"1G":"F","2G":"F, H","3G":"F, H, V","4G":"F, OH","3G+4G":"F, H, V, OH (all)"},

  "5G":"F, V, OH","6G":"F, H, V, OH (all)","2G+5G":"F, H, V, OH (all)" };
/* D1.1 base metal groups (Table 5.6 in D1.1:2025; it was Table 5.3 in 2020)

   group with thickness: metalGroup(). Anything not listed prints blank. */
var METAL_GROUP={ "A36":"I","A572 Gr. 50":"II","A992":"II","A500 Gr. B/C":"I / II","A1011":"I" };
var FILLER_SPEC={ "E6010":"A5.1","E6011":"A5.1","E7018":"A5.1","E7018-H4R":"A5.1","E308L-16":"A5.4",
  "ER70S-2":"A5.18","ER70S-3":"A5.18","ER70S-6":"A5.18","ER308LSi":"A5.9","ER308L":"A5.9","ER316L":"A5.9",
  "E71T-1C":"A5.20","E71T-1C/1M":"A5.20","E71T-1M":"A5.20","E71T-9C/9M":"A5.20","E71T-9C":"A5.20","E70T-1":"A5.20","E71T-11":"A5.20","E71T-8":"A5.20","E70T-4":"A5.20","E81T1-Ni1":"A5.29" };
/* The AWS filler spec (the "book") for a classification: the table above,
   else the classification's own pattern. Typed-in fillers get it too. */
function fillerSpecFor(cls){
  cls=String(cls||"").trim().toUpperCase(); if(!cls) return "";
  if(FILLER_SPEC[cls]) return FILLER_SPEC[cls];
  if(/^E\d{2}T/.test(cls))   return /-(NI|K|B|W|D)\d/.test(cls)||/^E[89]\dT|^E1[01]\dT/.test(cls) ? "A5.29" : "A5.20";  // FCAW: low-alloy vs carbon
  if(/^E3\d{2}[A-Z]{0,3}T/.test(cls)) return "A5.22";   // FCAW stainless (E308LT1-1, E309LMoT…)
  if(/^ER3\d{2}/.test(cls))  return "A5.9";    // GMAW/GTAW stainless

  if(/^E[67]0\d{2}$/.test(cls)) return "A5.1"; // SMAW carbon

/* SMAW electrode groups (D1.1:2025 Table 6.14): a test with a higher
   F-number qualifies the lower ones (Table 6.13, row 2). */
var F_NUMBER={ "E6010":"F3","E6011":"F3","E7018":"F4","E7018-H4R":"F4","E308L-16":"F5" };
var F_RANGE={ "F1":"F1","F2":"F1, F2","F3":"F1, F2, F3","F4":"F1, F2, F3, F4","F5":"F5" };
function suggest(w){
  var groove=w.weldType!="fillet", pipe=w.product=="pipe";
  if(!isD11(recCode(w))) return { positions:"", filletPositions:"", thickMin:"", thickMax:"", diameter:"", filletThick:"",
    process: w.process||"", backing:"", joints:"", base:"", filler:"", other:true };
  var key = groove ? ("groove-"+w.product) : "fillet";
  var pos=(POS_MAP[key]||{})[w.position]||"";
  var fpos= groove ? (FILLET_FROM_GROOVE[w.position]||"") : pos;
  var t=tVal(w), od=parseFloat(w.pipeOD), tMin="", tMax="", dia="";
  if(!isNaN(t)&&t>0){

      // Table 10.12, CJP groove butt: 1/8" to 3/4", or unlimited on pipe over 4" with wall over 3/8".
      if(!isNaN(od)){ tMin='1/8"'; tMax = od>4&&t>0.375+1e-9 ? "Unlimited" : '3/4"'; }
    } else { tMin = t<0.125?frac(t):'1/8"'; tMax = t>=1?"Unlimited":frac(t*2); }   // Table 6.12
  }
  if(pipe){ if(!isNaN(od)) dia = od<=4 ? '3/4" to 4" OD' : frac(Math.max(od/2,4))+" OD and up"; }   // Table 10.12 fn f
  else dia = groove ? '24" OD and up, with backing or backgouging only' : "Any";                   // Table 6.11 fn b
  var filler=w.filler=="Other"?w.fillerOther:w.filler, fn=F_NUMBER[filler]||fNumberOf(filler);
  return { positions:pos, filletPositions:fpos, thickMin:tMin, thickMax:tMax, diameter:dia,
    grooveThick: groove&&tMin ? tMin+" to "+tMax : "",
    filletThick: groove ? "Any" : (tMin ? tMin+" to Unlimited" : ""),
    process: qualProcess(w),
    backing: groove ? (w.backing=="with" ? "With backing, or backgouged" : "With or without") : "N/A",
    joints: groove ? "CJP and PJP groove, fillet, plug, slot, tack" : "Fillet, plug, slot, tack",
    base: NOT_LIMIT,

/* Table 6.13 lists no base metal, filler classification (other than the
   SMAW F-number), gas or filler diameter. They go on the record as tested,
   never as a limit. */
var NOT_LIMIT="Any - not a welder variable (Table 6.13)";
var AS_TESTED="As tested - not a limit (Table 6.13)";
/* The process a test qualifies. FCAW-G and FCAW-S are both FCAW; GMAW-S
   (short circuit) is its own process (Table 6.13, row 1). */
function qualProcess(w){
  var p=w.process||""; if(!p) return "";
  if(/^FCAW/.test(p)) return "FCAW";
  if(p=="GMAW") return /short/i.test(w.transfer||"") ? "GMAW-S" : "GMAW (not GMAW-S)";
  return p;
}
function transferRange(w){

}
/* F-number by pattern, Table 6.14, for a classification not in F_NUMBER. */
function fNumberOf(cls){
  var m=String(cls||"").toUpperCase().match(/^E\d{2}(\d{2})/); if(!m) return "";
  var n=m[1];
  if(/^(15|16|18|48)$/.test(n)) return "F4";
  if(/^(10|11)$/.test(n)) return "F3";

/* "AWS D1.1/D1.1M:2025, Clause 6" — welders qualify to the clause, not to a

function qualifiedTo(code,w){

  var y=(c.match(/20\d\d/)||[""])[0];

/* The test joint, from the WPS: designation, groove angle, root opening. */
function testJoint(wp){

}
/* Test numbers: 2026-001 and on, given the first time a WPQR is saved. */
function nextLabNo(){
  var y=String(new Date().getFullYear()), top=0;
  records().forEach(function(x){ var m=String(x.r&&x.r.labNo||"").match(/^(\d{4})-(\d+)$/); if(m&&m[1]==y) top=Math.max(top,+m[2]); });
  var n=top+1; return y+"-"+(n<10?"00":n<100?"0":"")+n;

/* ---------- the same welder, more than one test ----------
   A welder's tests line up by name and company. Table 6.11: passing 3G
   and 4G (or 3F and 4F) together qualify all positions; Table 10.8: 2G
   and 5G on pipe. Each record still certifies its own plate, so the pair
   is noted on both, not merged. */
function welderKey(w){ return String(w.name||"").trim().toLowerCase().replace(/\s+/g," ")+"|"+(w.companyId||String(w.company||"").trim().toLowerCase()); }
function procFam(w){ var p=w.process||""; if(/^FCAW/.test(p)) return "FCAW"; if(p=="GMAW"&&/short/i.test(w.transfer||"")) return "GMAW-S"; return p; }
var PAIRS=[["3G","4G","plate","groove"],["3F","4F","","fillet"],["2G","5G","pipe","groove"]];
function combinedWith(w,id){
  if(!w.name||!w.position) return null;
  var k=welderKey(w), fam=procFam(w), mine=null;
  PAIRS.forEach(function(pr){ if(pr.indexOf(w.position)>-1&&pr.indexOf(w.position)<2&&(w.weldType||"groove")==pr[3]&&(!pr[2]||w.product==pr[2])) mine=pr; });
  if(!mine) return null;
  var other=mine[0]==w.position?mine[1]:mine[0];
  var hit=records().filter(function(x){ return x.id!=id&&x.r.result=="Qualified"&&x.w.position==other&&welderKey(x.w)==k&&procFam(x.w)==fam
    &&(x.w.weldType||"groove")==(w.weldType||"groove")&&(!mine[2]||x.w.product==w.product); })
    .sort(function(a,b){ return (b.w.date||"").localeCompare(a.w.date||""); })[0];
  return hit ? { rec:hit, pos:other, table:mine[2]=="pipe"?"Table 10.8":"Table 6.11" } : null;
}

/* ---------- continuity ----------
   6.2.3.1: a welder's qualification stays in effect until they go more
   than six months without welding in that process, or there's a reason
   to question it. No expiry date. The log is the dates you saw them weld
   with it, kept on their latest qualified record (r.cont). */
function addMonths(s,n){ var p=String(s||"").split("-"); if(p.length<3) return ""; var d=new Date(+p[0],+p[1]-1+n,+p[2]);
  if(d.getDate()!=+p[2]) d.setDate(0); return ymd(d); }
function continuity(){
  var by={};
  records().filter(function(x){ return x.r.result=="Qualified"&&x.w.name; }).forEach(function(x){
    var k=welderKey(x.w)+"|"+procFam(x.w), g=by[k]||(by[k]={ key:k, name:x.w.name, company:coName(x.w.companyId)||x.w.company||"", proc:procFam(x.w), recs:[], last:"", tested:"" });
    g.recs.push(x);
    if((x.w.date||"")>g.tested) g.tested=x.w.date||"";
    [x.w.date].concat(x.r.cont||[]).forEach(function(d){ if(d&&d>g.last) g.last=d; });
  });
  return Object.keys(by).map(function(k){ var g=by[k];
    g.recs.sort(function(a,b){ return (b.w.date||"").localeCompare(a.w.date||""); });
    g.until=addMonths(g.last,6); g.lapsed=g.until&&g.until<today();
    return g; }).sort(function(a,b){ return a.name.localeCompare(b.name)||a.proc.localeCompare(b.proc); });
}
function lapsingSoon(){ var soon=addMonths(today(),1); return continuity().filter(function(g){ return !g.lapsed&&g.until<=soon; }); }

/* ---------- what keeps a record from printing as final ----------
   block: Save WPQR refuses until it's settled. warn: shown, never blocks. */
function recordChecks(w,r){
  var out=[], t=tVal(w), pipe=w.product=="pipe";
  if(isNaN(t)||t<=0) out.push({ block:1, msg:"No test "+(pipe?"wall ":"")+"thickness. Every range on the record comes from it ("+(pipe?"Table 10.12":"Table 6.12")+") — enter it in Test coupon." });
  if(pipe&&isNaN(parseFloat(w.pipeOD))) out.push({ block:1, msg:"No pipe OD. Table 10.12 sets the diameter and thickness qualified from it — enter it in Test coupon." });
  if(r.method=="rt"&&w.process=="GMAW"&&/short/i.test(w.transfer||"")) out.push({ block:1, msg:"RT can't stand in for the bend tests on GMAW-S (6.18.1.1). Bend this one." });
  // Fig. 6.21: the coupon's α and R are maximums unless it's a prequalified detail.
  var wp=wpsById(w.wpsId);
  if(wp&&w.weldType!="fillet"&&!pipe){
    var A=angleRange(wp.angle), R=rootRange(wp.rootOpening), backed=w.backing=="with";
    var preq=wp.basis=="Prequalified"&&wp.jointDesig&&!fig51Check(wp).some(function(x){ return x.k=="rule"||x.k=="info"; });
    var amax=backed?45:60, rmax=backed?1/4:3/16;
    if(!preq&&((A&&A.hi>amax+1e-6)||(R&&R.hi>rmax+1e-6)))
      out.push({ msg:"Fig. 6.21: a welder's coupon "+(backed?"with":"without")+" backing is "+amax+"° and "+frac(rmax)+" root at most, unless it's a prequalified Fig. 5.1 detail. "+wpsLabel(wp)+" calls for "+[wp.angle,wp.rootOpening?"R "+wp.rootOpening:""].filter(Boolean).join(", ")+" — check the coupon's actual bevel." });
  }
  return out;
}
function recordChecksCard(){
  var c=recordChecks(S.w,S.r); if(!c.length) return "";
  var hard=c.some(function(x){ return x.block; });
  return '<div class="flag"'+(hard?' style="border-color:var(--slag);background:rgba(192,83,58,.1)"':'')+'><b'+(hard?' style="color:#E9876F"':'')+'>'+(hard?"Before this record can be saved":"Check the coupon")+'</b><ul style="margin:8px 0 0;padding-left:18px">'
    +c.map(function(x){ return '<li style="margin:0 0 6px">'+esc(x.msg)+'</li>'; }).join("")+'</ul></div>';
}
/* What a non-SMAW filler qualifies, written the shop's way: E71T-1C → E7xT-xx. */
function fillerRange(f){
  f=String(f||""); if(!f) return "";
  var m=f.match(/^E(\d)\dT/i); if(m) return "E"+m[1]+"xT-xx";
  return f.replace(/-.*$/,"-X");
}

/* ---------- earnings ----------

   worth the inspector's time. Billed counts an invoice on its date and
   before tax; collected counts it on the day it was paid. "Waiting on
   you" is right now and ignores the period: overdue invoices, finished
   tests on no invoice (only since the first invoice kept here — earlier
   tests were billed some other way), regulars who've gone quiet, and
   welders about to lapse. Per hour comes from how long the inspector
   says one of each job takes (CFG.hrs_<svc>); nothing is timed. */
/* byQty: a line's quantity counts the things done (3 tests); otherwise
   each line is one (a visit billed by the hour, a trip billed by the mile). */
var EARN_GROUPS=[
  {k:"tests", label:"Welder tests", low:"welder tests", one:"test", many:"tests", byQty:1, svcs:["bendpass","bendfail","visual","retest"]},
  {k:"onsite", label:"On-site inspection", low:"on-site inspection", one:"visit", many:"visits", svcs:["onsite"]},
  {k:"wps", label:"WPS", low:"WPSs", one:"WPS", many:"WPSs", byQty:1, svcs:["wps"]},
  {k:"pqr", label:"PQR", low:"PQRs", one:"PQR", many:"PQRs", byQty:1, svcs:["pqr"]},
  {k:"travel", label:"Travel", low:"travel", one:"trip", many:"trips", svcs:["travel"]},
  {k:"other", label:"Other", low:"other work", one:"item", many:"items", svcs:[]}];
function earnGroup(svc){ for(var i=0;i<EARN_GROUPS.length-1;i++) if(EARN_GROUPS[i].svcs.indexOf(svc)>-1) return EARN_GROUPS[i]; return EARN_GROUPS[EARN_GROUPS.length-1]; }
var EARN_PERIODS=[{k:"90d",label:"90 days"},{k:"ytd",label:"This year"},{k:"12m",label:"12 months"},{k:"all",label:"All"}];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function parseYmd(s){ var p=String(s||"").split("-"); return p.length==3 ? new Date(+p[0],+p[1]-1,+p[2]) : null; }
function daysBetween(a,b){ var A=parseYmd(a), B=parseYmd(b); return A&&B ? Math.round((B-A)/864e5) : NaN; }
function addDays(s,n){ var d=parseYmd(s); if(!d) return ""; d.setDate(d.getDate()+n); return ymd(d); }
function median(a){ if(!a.length) return NaN; var s=a.slice().sort(function(x,y){ return x-y; }), m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
function money0(n){ return money(Math.round(n)).replace(/\.00$/,""); }
function pct(a,b){ if(!(b>0)) return ""; var p=Math.round(a/b*100); return p==0&&a>0 ? "<1%" : p+"%"; }
function fmtShort(s){ var p=String(s||"").split("-"); return p.length==3 ? p[1]+"/"+p[2]+"/"+p[0].slice(2) : String(s||""); }
function plural(n,one,many){ return n+" "+(n==1?one:many); }
function howOften(d){ return d<14 ? "every ~"+Math.max(1,Math.round(d))+" days" : d<60 ? "every ~"+Math.round(d/7)+" weeks" : "every ~"+Math.round(d/30)+" months"; }
function howLong(d){ return d<91 ? Math.round(d/7)+" weeks" : Math.round(d/30)+" months"; }
function monthName(ym){ return MON[+ym.slice(5,7)-1]+" "+ym.slice(0,4); }
/* The stretch the numbers cover, and the one before it to compare with. */
function earnPeriod(k){
  var t=today(), P={ k:k, from:"", to:t, during:"all time" };
  if(k=="90d"){ P.from=addDays(t,-89); P.prevTo=addDays(P.from,-1); P.prevFrom=addDays(P.from,-90); P.vs="vs the 90 days before"; P.during="in the last 90 days"; }
  else if(k=="ytd"){ P.from=t.slice(0,4)+"-01-01"; P.prevFrom=(+t.slice(0,4)-1)+"-01-01"; P.prevTo=addMonths(t,-12); P.vs="vs this time last year"; P.during="this year"; }
  else if(k=="12m"){ P.from=addMonths(t.slice(0,8)+"01",-11); P.prevFrom=addMonths(P.from,-12); P.prevTo=addMonths(t,-12); P.vs="vs the same months a year before"; P.during="in the last 12 months"; }
  return P;
}
function inPer(d,P){ return !!d && (!P.from||d>=P.from) && d<=P.to; }
function earnStats(P){
  var all=invoices(), cos={}, M={ P:P, billed:0, n:0, collected:0, prev:0, first:"", days:[], svc:{}, co:{}, taxed:false };
  companies().forEach(function(c){ cos[c.id]=c; });
  all.forEach(function(v){
    var t=invTotals(v);
    if(v.date&&(!M.first||v.date<M.first)) M.first=v.date;
    if(v.status=="Paid"&&inPer(v.paidDate,P)) M.collected+=t.sub;
    if(P.prevFrom&&v.date>=P.prevFrom&&v.date<=P.prevTo) M.prev+=t.sub;
    if(!inPer(v.date,P)) return;
    M.billed+=t.sub; M.n++; if(t.tax) M.taxed=true;
    (v.lines||[]).forEach(function(ln){
      var g=earnGroup(ln.svc), o=M.svc[g.k]||(M.svc[g.k]={ g:g, amt:0, qty:0, lines:0, hrs:0, hrsAmt:0 });
      var a=lineAmt(ln), q=lineQty(ln), hr=num(CFG["hrs_"+ln.svc]);
      o.amt+=a; o.qty+=q; o.lines++;
      if(hr>0&&q>0&&g.k!="travel"&&g.k!="other"){ o.hrs+=q*hr; o.hrsAmt+=a; }
    });
    var c0=cos[v.coId], key=c0 ? c0.id : "n:"+String(v.billName||"").trim().toLowerCase();
    var c=M.co[key]||(M.co[key]={ coId:c0?c0.id:"", name:c0?c0.name:(v.billName||"No company"), amt:0, n:0, days:[], last:"" });
    c.amt+=t.sub; c.n++; if(v.date>c.last) c.last=v.date;
    if(v.status=="Paid"&&v.paidDate){ var dd=daysBetween(v.date,v.paidDate); if(dd>=0){ M.days.push(dd); c.days.push(dd); } }
  });
  function ranked(o){ return Object.keys(o).map(function(k){ return o[k]; }).filter(function(x){ return x.amt>0; }).sort(function(a,b){ return b.amt-a.amt; }); }
  M.svcList=ranked(M.svc); M.coList=ranked(M.co);
  M.months=earnMonths(P,all);
  return M;
}
/* Each month in the stretch (the last 24 at most), billed and collected. */
function earnMonths(P,all){
  var first=P.from;
  if(!first){ all.forEach(function(v){ if(v.date&&(!first||v.date<first)) first=v.date; }); first=first||P.to; }
  var y=+first.slice(0,4), m=+first.slice(5,7), end=P.to.slice(0,7), out=[], by={};
  for(var i=0;i<1200;i++){ var ym=y+"-"+(m<10?"0":"")+m; out.push(ym); if(ym>=end) break; if(++m>12){ m=1; y++; } }
  out=out.slice(-24);
  out.forEach(function(ym){ by[ym]={ ym:ym, billed:0, n:0, collected:0 }; });
  all.forEach(function(v){
    var b=inPer(v.date,P)&&by[v.date.slice(0,7)], c=v.status=="Paid"&&inPer(v.paidDate,P)&&by[v.paidDate.slice(0,7)];
    if(!b&&!c) return;
    var t=invTotals(v); if(b){ b.billed+=t.sub; b.n++; } if(c) c.collected+=t.sub;
  });
  return out.map(function(ym){ return by[ym]; });
}
/* Finished tests on no invoice, by company, priced at today's rates. */
function earnUnbilled(){
  var from=""; invoices().forEach(function(v){ if(v.date&&(!from||v.date<from)) from=v.date; });
  var out={ from:from, groups:[], noRate:0 }; if(!from) return out;
  var billed=billedRecIds(), cos={}, by={}; companies().forEach(function(c){ cos[c.id]=c; });
  records().forEach(function(r){
    var cid=r.w.companyId; if(!cid||!cos[cid]||!r.r.result||billed[r.id]||(r.w.date||"")<from) return;
    var g=by[cid]||(by[cid]={ coId:cid, name:cos[cid].name, recs:[], est:0 });
    g.recs.push(r); var rate=num(recLine(r).rate); if(rate>0) g.est+=rate; else out.noRate++;
  });
  out.groups=Object.keys(by).map(function(k){ return by[k]; }).sort(function(a,b){ return b.est-a.est||b.recs.length-a.recs.length; });
  return out;
}
/* Companies that used to come back regularly and haven't lately. Work is
   counted by the week (a crew tested over three days is one visit). */
function earnQuiet(){
  var t=today(), yr=addMonths(t,-12), by={};
  companies().forEach(function(c){ by[c.id]={ id:c.id, name:c.name, weeks:{}, last:"", year:0 }; });
  function hit(id,d){ var c=by[id], p=parseYmd(d); if(!c||!p||isNaN(p)||d>t) return; p.setDate(p.getDate()-(p.getDay()+6)%7); c.weeks[ymd(p)]=1; if(d>c.last) c.last=d; }
  records().forEach(function(r){ hit(r.w.companyId,r.w.date); });
  // An invoice for tests is the same visit as the tests; other invoices are the only trace of the work.
  invoices().forEach(function(v){ if(!(v.lines||[]).some(function(ln){ return ln.recId; })) hit(v.coId,v.date);
    if(by[v.coId]&&v.date>=yr&&v.date<=t) by[v.coId].year+=invTotals(v).sub; });
  db.get("inspections",[]).forEach(function(i){ hit(i.clientCoId,i.inspDate||i.date); });
  return Object.keys(by).map(function(k){ var c=by[k], w=Object.keys(c.weeks).sort();
    if(w.length<3) return null;
    var gaps=[]; for(var i=1;i<w.length;i++) gaps.push(daysBetween(w[i-1],w[i]));
    c.gap=median(gaps); c.since=daysBetween(c.last,t); c.visits=w.length;
    return daysBetween(w[0],w[w.length-1])>=30&&c.since>=30&&c.since>=2*c.gap ? c : null;
  }).filter(Boolean).sort(function(a,b){ return b.year-a.year||b.visits-a.visits; });
}
/* Welders about to lapse (6.2.3.1), or lapsed in the last two months, by company. */
function earnLapsing(){
  var t=today(), soon=addMonths(t,1), lately=addMonths(t,-2), by={};
  continuity().forEach(function(g){
    var o=by[g.company]||(by[g.company]={ company:g.company, soon:{}, gone:{}, by:"" });
    if(!g.lapsed&&g.until&&g.until<=soon){ o.soon[g.name]=1; if(g.until>o.by) o.by=g.until; }
    else if(g.lapsed&&g.until>=lately) o.gone[g.name]=1;
  });
  return Object.keys(by).map(function(k){ var o=by[k]; o.nSoon=Object.keys(o.soon).length; o.nGone=Object.keys(o.gone).length; return o; })
    .filter(function(o){ return o.nSoon||o.nGone; }).sort(function(a,b){ return (b.nSoon+b.nGone)-(a.nSoon+a.nGone); });
}
function invTabs(on){

function earnWaiting(anyInv){
  var parts=[], late=invoices().filter(function(v){ return invStatus(v).t=="Overdue"; }).sort(function(a,b){ return dueDate(a).localeCompare(dueDate(b)); });

  var un=earnUnbilled();

      uh+='<button class="sub" data-act="moneybill" data-co-id="'+esc(g.coId)+'"><span style="flex:1;min-width:0"><b>'+esc(g.name)+'</b><span>'+plural(g.recs.length,"finished test","finished tests")+' · tap to start the invoice</span></span>'
        +'<span class="eright">'+(g.est?"~"+money0(g.est):"")+'</span></button>'; });

/* Each frame keeps everything its screen reads, so coming back to a
   half-filled form finds it as it was left. */
var FRAME=["screen","coId","wpsId","recId","step","draft","viewWps","pdf","copySrc"];
function go(screen, opts){
  flushSave();
  var f={}; FRAME.forEach(function(k){ f[k]=S[k]; }); S.stack.push(f);
  S.screen=screen; Object.assign(S,opts||{}); render();
}
function back(){
  flushSave();
  if(S.screen=="pdfview"&&S.pdf&&S.pdf.url) URL.revokeObjectURL(S.pdf.url);
  var p=S.stack.pop(); if(!p){ S.screen="home"; S.draft={}; } else { Object.assign(S,p); }
  if(S.screen=="inspect"&&S.recId){ var rec=getRow("records",S.recId); if(rec){ S.w=Object.assign(blankW(),rec.w); S.r=Object.assign(blankR(),rec.r); } }
  render();
}

var app=document.getElementById("view"), scroller=document.getElementById("app"), bar=document.getElementById("bar");
function render(o){
  var keep = o && o.keepScroll;
  var y = keep ? scroller.scrollTop : 0;
  var v = VIEWS[S.screen] || VIEWS.home;
  var out = v();
  /* Never hand focus back to a <select>. Focusing one re-opens the native
     picker, so tapping an option looked as though the picker had stayed
     up and took a second tap -- or a tap outside -- to be rid of. Blur
     the old box as well, so the picker is dismissed against a node that
     is still in the document rather than orphaned by the innerHTML. */
  var focused = document.activeElement, isSel = !!(focused && focused.tagName=="SELECT");
  var aid = (focused && focused.dataset && !isSel) ? (focused.dataset.k||focused.dataset.r||focused.dataset.d||focused.dataset.c) : null;
  if(isSel && focused.blur) focused.blur();
  app.innerHTML = out.body;
  bar.innerHTML = out.bar ? '<div class="inner">'+out.bar+'</div>' : "";
  bar.style.display = out.bar ? "block" : "none";
  if(keep){
    scroller.scrollTop=y;
    if(aid){
      var back = app.querySelector('[data-k="'+aid+'"],[data-r="'+aid+'"],[data-d="'+aid+'"],[data-c="'+aid+'"]');
      if(back && back.focus){ try{ back.focus({preventScroll:true}); if(back.setSelectionRange && back.value) back.setSelectionRange(back.value.length,back.value.length); }catch(e){} }
    }
  } else {
    scroller.scrollTop=0;
  }
}

/* The card a welder sees: what the WPS calls for. Also shown to the
   inspector on the ticket screen so there are no surprises. */

    ["Process", p.process ? p.process+(p.transfer?" — "+p.transfer:"") : ""],
    ["Filler", (p.filler||"")+(p.fillerDia?" × "+p.fillerDia:"")],
    ["Gas", p.gas ? p.gas+(p.flow?" @ "+p.flow+" CFH":"") : ""],

    ["Polarity", p.polarity], ["Preheat", p.preheat], ["Travel", p.travel?p.travel+" ipm":""]

  return h;
}

/* ---------- D1.1:2025 Clause 5: is this prequalified WPS within the rules? ----------
   Every row and limit below is copied from the pages McKay photographed
   out of his D1.1:2025 book (docs/d1.1-2025/wps-prequalified-checklist.md).
   Anything marked [VERIFY] or [GAP] there is not encoded; where a page
   is missing, the check says to look in the book instead of guessing.
   5.2.1: the Table 5.5 variables shall be on the written WPS and, where
   they have limits, within them.
   Each finding has a kind:
     rule     breaks Clause 5 — blocks Save (unless kept) and a tapped
              tile that would cause one is refused
     missing  Table 5.5 says it has to be stated — blocks Save
     info     look in the book; never blocks
   The inspector decides; every block has a way past it. */
var TOL55={ amps:{t:.10,label:"Amperage",item:22}, volts:{t:.15,label:"Voltage",item:23}, wfs:{t:.10,label:"Wire feed speed",item:24},
  travel:{t:.25,label:"Travel speed",item:25} };
function numRange(v){
  var m=String(v||"").replace(/,/g,"").match(/(\d+(?:\.\d+)?)\s*(?:–|—|-|to)\s*(\d+(?:\.\d+)?)/);
  if(m){ var a=+m[1], b=+m[2]; return { lo:Math.min(a,b), hi:Math.max(a,b), dec:/\./.test(m[1]+m[2]) }; }
  var one=String(v||"").match(/^\s*(\d+(?:\.\d+)?)\s*$/); return one ? { lo:+one[1], hi:+one[1], dec:/\./.test(one[1]) } : null;
}
function fmtNum(v,dec){ return dec ? (Math.round(v*10)/10).toString() : String(Math.round(v)); }
/* The widest range Table 5.5 allows about this range's middle, rounded
   inward so it stays inside. */
function tolFix(r,t){
  var mid=(r.lo+r.hi)/2, step=r.dec?.1:1;
  var lo=Math.ceil(mid*(1-t)/step)*step, hi=Math.floor(mid*(1+t)/step)*step;
  return fmtNum(lo,r.dec)+"–"+fmtNum(hi,r.dec);
}
function wireOrGas(proc){ return proc=="GMAW"||proc=="FCAW-G"||proc=="FCAW-S"; }

/* Positions as a set of F, H, V, OH. "All" is all four. */
var POS4=["F","H","V","OH"];
function posSet(s){
  s=String(s||"").toUpperCase(); if(/ALL/.test(s)) return POS4.slice();
  return POS4.filter(function(x){ return new RegExp("(^|[^A-Z])"+x+"([^A-Z]|$)").test(s); });
}
function posText(a){ return a.length==4 ? "All" : a.join(", "); }
/* Thickest part the WPS covers, in inches; NaN if it can't be read. */
function thickMax(p){
  var r=inchRange(p.thickRange); if(r) return r.hi;
  return inchVal(p.thickRange);
}
function stated(v){ v=String(v==null?"":v).trim(); return !!v&&!/^(—|-|–|n\/?a|tbd|\?)$/i.test(v); }
function hasPwht(p){ var v=String(p.pwhtTemp||"").trim(); return !!v&&!/^(none|n\/?a|no|—|-|0)$/i.test(v); }
/* Root opening as detailed. '3/16" ± 1/16"' reads as its nominal 3/16". */
function rootRange(v){
  var s=String(v||"").split("±")[0].trim(); if(s==="") return null;
  var r=inchRange(s); if(r) return r;
  var n=inchVal(s); return isNaN(n) ? null : {lo:n,hi:n};
}
function angleRange(v){ return numRange(String(v||"").replace(/°/g,"").replace(/deg(rees)?/i,"")); }

/* Fig. 5.1 (pp. 86–87). p: S = SMAW, GF = GMAW/FCAW, SAW. R and a are the
   as-detailed root opening and groove angle; their tolerance is R +1/16"
   −0 and α +10° −0°. gas: FCAW gas shielding required. Square grooves
   (sq) take R from T1, so only thickness and positions are checked. */
var FIG51=[
  {d:"B-U2a",    p:"S",   R:1/4,  a:45, pos:"All"},
  {d:"B-U2a",    p:"S",   R:3/8,  a:30, pos:"F, V, OH"},
  {d:"B-U2a",    p:"S",   R:1/2,  a:20, pos:"F, V, OH"},
  {d:"B-U2a-GF", p:"GF",  R:3/16, a:30, pos:"F, V, OH", gas:1},
  {d:"B-U2a-GF", p:"GF",  R:3/8,  a:30, pos:"F, V, OH"},
  {d:"B-U2a-GF", p:"GF",  R:1/4,  a:45, pos:"F, V, OH"},
  {d:"B-L2a-S",  p:"SAW", R:1/4,  a:30, pos:"F", tmax:2},
  {d:"B-U2-S",   p:"SAW", R:5/8,  a:20, pos:"F"},
  {d:"B-L1a",    p:"S",   sq:1, tmax:1/4, pos:"All"},
  {d:"C-L1a",    p:"S",   sq:1, tmax:1/4, pos:"All"},
  {d:"B-L1a-GF", p:"GF",  sq:1, tmax:3/8, pos:"All"},
  {d:"B-L1b",    p:"S",   sq:1, tmax:1/4, pos:"All"},
  {d:"B-L1b-GF", p:"GF",  sq:1, tmax:3/8, pos:"All"},
  {d:"B-L1-S",   p:"SAW", sq:1, tmax:3/8, pos:"F"},
  {d:"B-L1a-S",  p:"SAW", sq:1, tmax:5/8, pos:"F"},
  {d:"TC-L1b",   p:"S",   sq:1, tmax:1/4, pos:"All"},
  {d:"TC-L1-GF", p:"GF",  sq:1, tmax:3/8, pos:"All"},
  {d:"TC-L1-S",  p:"SAW", sq:1, tmax:3/8, pos:"F"} ];
var PCLASS_NAME={S:"SMAW",GF:"GMAW/FCAW",SAW:"SAW"};
function procClass(proc){ return proc=="SMAW"?"S":wireOrGas(proc)?"GF":proc=="SAW"?"SAW":""; }
/* 5.4.1.5: SMAW joint details may be used for prequalified GMAW and FCAW. */
function rowFits(row,proc){
  var c=procClass(proc); if(!c) return false;
  if(row.p==c) return !(row.gas&&proc=="FCAW-S");
  return row.p=="S"&&c=="GF";
}
function desigKey(s){ return String(s||"").toUpperCase().replace(/\s+/g,""); }
function desigBase(s){ return desigKey(s).replace(/-(GF|S)$/,""); }
function fig51Check(p){
  var out=[]; if((p.weldType||"CJP groove")!="CJP groove") return out;
  var proc=p.process, des=String(p.jointDesig||"").trim(), base=desigBase(des);
  var known=FIG51.filter(function(r){ return desigBase(r.d)==base; });
  if(des&&!known.length){
    out.push({ k:"info", key:"jointDesig", msg:des+" isn't in the app's Fig. 5.1 table yet (it has B-U2a, B-U2a-GF, B-L2a-S, B-U2-S and the square grooves). Check its root opening, angle and positions in the book." });
    return out;
  }
  if(!des){
    if(!(p.groove=="Single V"&&p.backing=="With backing")) return out;
    known=FIG51.filter(function(r){ return desigBase(r.d)=="B-U2A"; });
  }
  if(!proc) return out;
  var rows=known.filter(function(r){ return rowFits(r,proc); });
  if(!rows.length){
    out.push({ k:"rule", key:"jointDesig", ref:"Fig. 5.1", msg:(des||known[0].d)+" is a "+PCLASS_NAME[known[0].p]+" detail in Fig. 5.1, so it isn't prequalified for "+proc+"." });
    return out;
  }
  var A=angleRange(p.angle), R=rootRange(p.rootOpening), tm=thickMax(p), want=posSet(p.positions), label=des||rows[0].d;
  var geo=rows.filter(function(r){
    if(r.sq) return true;
    return A&&R && A.lo>=r.a-1e-6 && A.hi<=r.a+10+1e-6 && R.lo>=r.R-1e-6 && R.hi<=r.R+1/16+1e-6;
  });
  if(!geo.length){
    if(!A||!R) return out;     // Table 5.5 says they're missing
    var combos=rows.filter(function(r){ return !r.sq; }), seen={}, list=[];
    combos.forEach(function(r){ var t=frac(r.R)+" at "+r.a+"°"; if(!seen[t]){ seen[t]=1; list.push(t); } });
    var sameR=combos.filter(function(r){ return Math.abs(r.R-R.lo)<1e-6; })[0];
    var said=String(p.angle).replace(/°?$/,"°");
    out.push({ k:"rule", key:sameR?"angle":"rootOpening", ref:"Fig. 5.1", msg: sameR
        ? "Fig. 5.1 "+label+": a "+frac(sameR.R)+" root opening goes with a "+sameR.a+"° groove angle ("+sameR.a+"° to "+(sameR.a+10)+"° as detailed). "+said+" isn't prequalified."
        : "Fig. 5.1 "+label+" for "+proc+" lists "+list.join(", ")+" (as detailed: R +1/16\" −0, α +10° −0°). "+frac(R.lo)+" at "+said+" isn't one of them.",
      fix: sameR ? {key:"angle", val:sameR.a+"°"} : null });
    return out;
  }
  var thk=geo.filter(function(r){ return !r.tmax||!(tm>r.tmax+1e-6); });
  if(!thk.length){
    out.push({ k:"rule", key:"thickRange", ref:"Fig. 5.1", msg:label+" is limited to "+frac(geo[0].tmax)+" thick (T1) in Fig. 5.1; this WPS goes to "+p.thickRange+"." });
    return out;
  }
  var posOk=thk.filter(function(r){ var s=posSet(r.pos); return want.every(function(x){ return s.indexOf(x)>-1; }); });
  if(want.length&&!posOk.length){
    var best=thk[0];
    out.push({ k:"rule", key:"positions", ref:"Fig. 5.1", msg:label+(best.sq?"":" at "+frac(best.R)+" / "+best.a+"°")+" is prequalified in "+best.pos+" only (Fig. 5.1). "+posText(want)+" isn't.",
      fix:{key:"positions", val:best.pos} });
    return out;
  }
  var use=posOk.length?posOk:thk;
  var exact=use.filter(function(r){ return desigKey(r.d)==desigKey(des); })[0];
  if(!exact){
    var hit=use.filter(function(r){ return r.p==procClass(proc); })[0]||use[0];
    var why = !des ? "This joint matches Fig. 5.1 "+hit.d+". Put the designation on the WPS (Table 5.5, item 20)."
      : hit.p=="S"&&procClass(proc)=="GF" ? "In "+(want.length==4?"all positions":posText(want))+" this joint is prequalified only as the SMAW detail "+hit.d+" (5.4.1.5 lets GMAW and FCAW use SMAW details). "+des+" itself is "+use.concat(thk).filter(function(r){return desigKey(r.d)==desigKey(des);}).map(function(r){return r.pos;})[0]+" only."
      : "For "+proc+" this detail is "+hit.d+" in Fig. 5.1, not "+des+".";
    out.push({ k:des?"rule":"missing", key:"jointDesig", ref:"Fig. 5.1", msg:why, fix:{key:"jointDesig", val:hit.d} });
  }
  return out;
}

/* 5.6.4: on FCAW-G the gas must be the one the electrode was classified
   with. The designator after the usability number says which: C is 100%
   CO2, M is mixed. A dual classification (E71T-1C/1M) carries both. */
function gasDesig(cls){
  var u=String(cls||"").toUpperCase().replace(/\s/g,""), c=false, m=false;
  if(/-M2\d/.test(u)) m=true; if(/-C1\b/.test(u)) c=true;          // A5.36 open classifications
  u.split("/").forEach(function(part){
    var x=part.replace(/-?H\d+R?$/,"").replace(/J$/,"");
    if(/(^|\d)CM$/.test(x)){ c=true; m=true; return; }
    if(/(^|\d|-)C$/.test(x)) c=true;
    if(/(^|\d|-)M$/.test(x)) m=true;
  });
  return { c:c, m:m };
}
function gasKind(g){
  var u=String(g||"").toUpperCase().replace(/\s/g,""); if(!u||u=="NONE") return "";
  if(/^(100%?)?CO2$/.test(u)) return "C";
  if(/AR|ARGON/.test(u)) return "M";
  return "?";
}
/* Table 5.10, GMAW to A5.18. true / false, or null when it can't tell. */
function gmawGasOk(g){
  var u=String(g||"").toUpperCase().replace(/\s/g,"");
  if(/^(100%?)?CO2$/.test(u)) return true;
  var ar=u.match(/(\d+)%?AR/), pct=ar?+ar[1]:NaN;
  if(/CO2/.test(u)&&/AR/.test(u)) return isNaN(pct)?null:pct>=75&&pct<=90;
  if(/O2/.test(u)&&/AR/.test(u)) return isNaN(pct)?null:pct>=95&&pct<=98;
  return null;
}
/* The usability number of an FCAW classification: E71T-1C → "1", E71T-GS → "GS". */
function fcawSuffix(cls){ var m=String(cls||"").toUpperCase().match(/^E\d{2}T-?(GS|G|\d+)/); return m?m[1]:""; }
function lowHydrogen(proc,filler){
  if(wireOrGas(proc)||proc=="SAW") return true;
  if(proc=="SMAW") return /^E\d{2}(15|16|18|48)/i.test(String(filler||""));
  return false;
}
/* Table 5.11 (p. 81), the two categories photographed. Bands are the
   thickest part at the point of welding, in inches, with the minimum
   preheat and interpass in °F. Category C and on, and footnote a, are on
   p. 82 — not photographed, so not here. */
var T511={ A:[[3/4,32],[1.5,150],[2.5,225],[Infinity,300]], B:[[3/4,32],[1.5,50],[2.5,150],[Infinity,225]] };
var T511_BANDS=['1/8" to 3/4"','over 3/4" to 1-1/2"','over 1-1/2" to 2-1/2"','over 2-1/2"'];
/* Category B steels named on the photographed page (A36, A500, A572 Gr
   42/50/55, A709 Gr 36/50/50W "and others"). */
var CAT_B_STEEL=/^(A36|A500|A572(\s*GR\.?\s*(42|50|55))?|A709(\s*GR\.?\s*(36|50W?))?)(\b|$)/i;
function preheatCatFor(p){
  if(!CAT_B_STEEL.test(String(p.base||"").trim())) return "";
  if(p.baseTo&&!CAT_B_STEEL.test(String(p.baseTo).trim())) return "";
  return lowHydrogen(p.process,p.filler) ? "B" : "";
}
function t511(cat,tmax){
  var t=T511[cat]; if(!t||isNaN(tmax)||!isFinite(tmax)) return null;
  for(var i=0;i<t.length;i++) if(tmax<=t[i][0]+1e-9) return { f:t[i][1], band:T511_BANDS[i] };
  return null;
}
/* Base metal group, Table 5.6. A36 is Group I up to 3/4" and Group II at
   any thickness, so a WPS or coupon over 3/4" is Group II. */
function metalGroup(base,t){
  if(String(base||"").trim().toUpperCase()=="A36") return !isNaN(t)&&t>0.75+1e-9 ? "II" : "I";
  return METAL_GROUP[base]||"";
}
var GROUP_NOTE="Table 5.6";

function wpsChecks(p){
  if(isPqr(p)||p.basis!="Prequalified"||!isD11(p.code||CFG.code)) return [];
  var out=[], proc=p.process, wire=wireOrGas(proc), gas=proc=="GMAW"||proc=="FCAW-G";
  var groove=(p.weldType||"CJP groove")!="Fillet", want=posSet(p.positions), tm=thickMax(p);
  var fillerU=String(p.filler||"").toUpperCase();

  // 5.5.1 / 5.5.2 — GMAW-S is not prequalified.
  if(proc=="GMAW"&&/short/i.test(p.transfer||"")) out.push({ k:"rule", key:"transfer", ref:"5.5.1", msg:"GMAW short circuit (GMAW-S) isn't prequalified (5.5.1, 5.5.2). It needs a PQR." });
  // 5.5.4 — CV for GMAW and FCAW.
  if(wire&&p.powerSource=="CC") out.push({ k:"rule", key:"powerSource", ref:"5.5.4", msg:"GMAW and FCAW on a prequalified WPS run on a constant-voltage power source (5.5.4).", fix:{key:"powerSource",val:"CV"} });

    var T=TOL55[k]; if(!wire) return;   // 22–25 apply to SAW, FCAW, GMAW
    var r=numRange(p[k]); if(!r||r.lo==r.hi) return;
    var mid=(r.lo+r.hi)/2, half=(r.hi-r.lo)/2/mid;
    if(half>T.t+1e-9) out.push({ k:"rule", key:k, ref:"Table 5.5", msg:T.label+" "+p[k]+" is ±"+Math.round(half*100)+"% about "+fmtNum(mid,r.dec)+". Table 5.5 ("+T.item+") allows ±"+Math.round(T.t*100)+"%.",
      fix:{ key:k, val:tolFix(r,T.t) } });

  if(gas){ var g=numRange(p.flow);

    else if(gk=="M"&&!gd.m) out.push({ k:"rule", key:"gas", ref:"5.6.4", msg:p.filler+" is classified on 100% CO2 (the C). 5.6.4: to run it on mixed gas the maker has to classify it -M, or dual -C/-M. Use 100% CO2, or a wire labeled -1M or -1C/1M.", fix:{key:"gas",val:"100% CO2"} });
    else if(gk=="C"&&!gd.c) out.push({ k:"rule", key:"gas", ref:"5.6.4", msg:p.filler+" is classified on mixed gas (the M). 5.6.4: to run it on 100% CO2 it needs a C classification.", fix:{key:"gas",val:"75% Ar / 25% CO2"} });

    else if(ok===null) out.push({ k:"info", key:"gas", ref:"Table 5.10", msg:"Check "+p.gas+" against Table 5.10: Ar/CO2 with 75–90% Ar, Ar/O2 with 95–98% Ar, or 100% CO2." });

      if(want.length&&dia>fmax+1e-6) out.push({ k:"rule", key:"fillerDia", ref:"Table 5.4", msg:"Table 5.4 limits FCAW wire to "+frac(fmax)+" "+fwhere+". "+p.fillerDia+" is bigger." });
    }

      var smax=Math.min.apply(null,want.map(function(x){ return lim[x]; }));

  // 5.8.1.1 — vertical is uphill, except tubulars.

  // 5.4.1.2 / 5.4.1.3 — one-sided CJP.
  if((p.weldType||"CJP groove")=="CJP groove"){
    var gouged=p.backgouge&&p.backgouge!="None";

function wpsBlocking(p){ return wpsChecks(p).filter(function(x){ return x.k=="rule"||x.k=="missing"; }); }

function wpsGuard(apply){

  var before=ruleMsgs(d), t=JSON.parse(JSON.stringify(d)); apply(t);

/* ---------- a test record against its WPS ----------
   A test is run to a WPS; a reading or a coupon detail outside it makes a
   record that doesn't match its own procedure. wpsDiffs() lists every
   place the record leaves the WPS it names. A single value on a
   prequalified WPS carries its Table 5.5 tolerance; a range is taken as
   written. Each difference offers what to do: correct a typo, switch to a
   WPS that covers the record, or keep it as tested (the inspector's call). */
var POS_NEEDS={ "1G":["F"],"2G":["H"],"3G":["V"],"4G":["OH"],"5G":["F","V","OH"],"6G":["F","H","V","OH"],"2G+5G":["F","H","V","OH"],
  "3G+4G":["V","OH"],"1F":["F"],"2F":["H"],"3F":["V"],"4F":["OH"],"3F+4F":["V","OH"] };
/* Inches from "3/4", "1 1/4", ".375" or "1"; Infinity for "unlimited". */
function inchVal(t){
  t=String(t||"").trim().toLowerCase(); if(/unlim/.test(t)) return Infinity;
  var m=t.match(/(\d+)\s+(\d+)\/(\d+)/); if(m) return +m[1]+ +m[2]/ +m[3];
  m=t.match(/(\d+)\/(\d+)/); if(m) return +m[1]/ +m[2];
  m=t.match(/\d*\.?\d+/); return m ? parseFloat(m[0]) : NaN;

function inchRange(spec){
  var parts=String(spec||"").split(/\s*(?:\bto\b|–|—)\s*|\s+-\s+/i).filter(Boolean);
  if(parts.length<2) return null;
  var lo=inchVal(parts[0]), hi=inchVal(parts[1]); return isNaN(lo)||isNaN(hi) ? null : {lo:lo,hi:hi};
}
function sameText(a,b){ return String(a||"").replace(/[\s"]/g,"").toLowerCase()==String(b||"").replace(/[\s"]/g,"").toLowerCase(); }
function wpsDiffs(w,p){
  p=p||wpsById(w.wpsId); if(!p) return [];
  var out=[], pre=p.basis=="Prequalified";
  // Machine readings against the WPS's ranges.
  function num(key,label,spec,tol,unit,fixKey){
    var v=parseFloat(w[key]), r=numRange(spec); if(isNaN(v)||!r) return;
    var lo=r.lo, hi=r.hi;
    if(lo==hi&&pre&&tol){ lo=r.lo*(1-tol[0]); hi=r.hi*(1+tol[1]); }
    if(v>=lo-1e-9&&v<=hi+1e-9) return;
    var st=r.dec?.1:1, inLo=Math.ceil(lo/st-1e-9)*st, inHi=Math.floor(hi/st+1e-9)*st;   // rounded inward, so the fix is inside
    var want=lo==hi?fmtNum(lo,r.dec):fmtNum(inLo,r.dec)+"–"+fmtNum(inHi,r.dec), to=fmtNum(v<lo?inLo:inHi,r.dec);
    out.push({ key:key, label:label, have:w[key]+(unit?" "+unit:""), want:want+(unit?" "+unit:""), fix:{ k:fixKey||key, v:to } });
  }
  num("wfs","Wire feed speed",p.wfs,[.10,.10],"ipm");
  // Amps worked out from wire speed follow the wire speed; only amps typed off the meter are judged.
  if(!w.ampsAuto) num("amps","Amperage",p.amps,[.10,.10],"A");
  num("volts","Voltage",p.volts,[.15,.15],"V");
  num("flow","Gas flow",p.flow,[.25,.50],"CFH");
  // What was welded against what the WPS calls for.
  function pick(key,label,want,have,fix){ if(want&&have&&!sameText(want,have)) out.push({ key:key, label:label, have:have, want:want, fix:fix }); }
  pick("process","Process",p.process,w.process);
  var filler=w.filler=="Other"?w.fillerOther:w.filler;
  pick("filler","Filler",p.filler,filler,(FILLERS[w.process]||[]).indexOf(p.filler)>-1?{k:"filler",v:p.filler}:null);
  if(p.fillerDia&&w.fillerDia&&!sameText(p.fillerDia,w.fillerDia)){
    var dr=inchRange(p.fillerDia), dv=inchVal(w.fillerDia);
    if(!(dr&&dv>=dr.lo-1e-6&&dv<=dr.hi+1e-6)) out.push({ key:"fillerDia", label:DIAM_LABEL[w.process]||"Diameter", have:w.fillerDia, want:p.fillerDia,
      fix:(DIAMS[w.process]||[]).some(function(d){return d.v==p.fillerDia}) ? {k:"fillerDia",v:p.fillerDia} : null });
  }
  var gas=w.gas=="Other"?w.gasOther:w.gas;
  if(p.gas&&gas&&gas!="None") pick("gas","Shielding gas",p.gas,gas,(GASES[w.process]||[]).indexOf(p.gas)>-1?{k:"gas",v:p.gas}:null);
  if(p.polarity&&w.polarity&&p.polarity!=w.polarity) out.push({ key:"polarity", label:"Polarity", have:w.polarity, want:p.polarity, fix:{k:"polarity",v:p.polarity} });
  if(w.process=="GMAW"&&p.transfer&&w.transfer&&!sameText(p.transfer,w.transfer)) out.push({ key:"transfer", label:"Transfer mode", have:w.transfer, want:p.transfer, fix:{k:"transfer",v:p.transfer} });
  if(p.base&&w.base&&!sameText(p.base,w.base)) out.push({ key:"base", label:"Base metal", have:w.base, want:p.base });
  var tr=inchRange(p.thickRange), t=tVal(w);
  if(tr&&!isNaN(t)&&(t<tr.lo-1e-6||t>tr.hi+1e-6)) out.push({ key:"thickness", label:"Thickness", have:frac(t), want:p.thickRange });
  if(w.position&&p.positions&&!/all/i.test(p.positions)){
    var has=String(p.positions).toUpperCase().split(/[^A-Z]+/), need=POS_NEEDS[w.position]||[];
    var lack=need.filter(function(x){ return has.indexOf(x)<0; });
    if(lack.length) out.push({ key:"position", label:"Position", have:w.position+" ("+need.join(", ")+")", want:p.positions });
  }
  if(isVertical(w.position)&&p.progression&&w.progression&&p.progression!=w.progression) out.push({ key:"progression", label:"Progression", have:w.progression, want:p.progression, fix:{k:"progression",v:p.progression} });
  if(w.weldType!="fillet"&&p.backing&&w.backing){
    var wb=w.backing=="with"?"With backing":"No backing";
    if((p.backing=="With backing")!=(w.backing=="with")) out.push({ key:"backing", label:"Backing", have:wb, want:p.backing, fix:{k:"backing",v:p.backing=="With backing"?"with":"without"} });
  }
  return out;
}

/* Straight-line between chart points; past either end, the nearest
   segment's slope carries on. Rounded to 5 A. null when there's no chart
   for the wire or no usable speed. */
function ampsFromWfs(w){
  var pts=(AMP_CHART[w.process]||{})[w.fillerDia], v=parseFloat(w.wfs);
  if(!pts||isNaN(v)||v<=0) return null;
  var i=1; while(i<pts.length-1&&v>pts[i][0]) i++;
  var a=pts[i-1], b=pts[i], amps=a[1]+(v-a[0])*(b[1]-a[1])/(b[0]-a[0]);
  return Math.max(5,Math.round(amps/5)*5);
}
/* Recompute amps from wire speed unless the inspector typed their own. */
function syncAmps(w){
  if(!wireProc(w.process)) return;
  if(w.amps&&!w.ampsAuto) return;
  var est=ampsFromWfs(w);
  if(est!=null){ w.amps=String(est); w.ampsAuto=true; }
  else if(w.ampsAuto){ w.amps=""; }
}
function ampsNote(w){
  if(!wireProc(w.process)) return "";
  var est=ampsFromWfs(w);
  if(!w.wfs) return "Enter the wire feed speed and the amps fill in.";
  if(est==null) return w.fillerDia ? "No chart for "+w.fillerDia+" "+w.process+" wire — type the amps off the machine." : "Pick the wire diameter in Test coupon and the amps fill in.";
  if(!w.ampsAuto) return "About "+est+" A is typical for "+w.wfs+" ipm. You typed your own.";
  return "About "+est+" A is typical for "+w.wfs+" ipm of "+w.fillerDia+" "+w.process+" wire. Your wire's chart, stickout and gas can move it 10–20% — change it if the meter says different.";
}

/* Pages are drawn with pdf.js, fetched the first time a preview opens.
   Without signal it falls back to the browser's own viewer. */
var PDFJS_SRC="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
var PDFJS_WORKER="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
var pdfjsLoading=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsLoading) return pdfjsLoading;
  pdfjsLoading=new Promise(function(ok,no){ var sc=document.createElement("script"); sc.src=PDFJS_SRC;
    sc.onload=function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; ok(window.pdfjsLib); };
    sc.onerror=function(){ pdfjsLoading=null; no(new Error("pdf.js")); }; document.head.appendChild(sc); });
  return pdfjsLoading;
}
/* Print the PDF itself, so the sheet is the document and nothing else.
   A web page printed on an iPhone gets the site's address and page
   numbers added at the bottom and its margins push the page onto a
   second sheet; iOS won't let a page turn that off. So:
   - phone: the share sheet with the PDF file — its Print prints the PDF
     clean, one letter sheet a page;
   - computer: the PDF in a hidden frame, printed by the browser's own
     PDF printer;
   - neither works: page images through window.print() (printImages). */
function isPhone(){ return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform=="MacIntel"&&navigator.maxTouchPoints>1); }
function printPdf(btn){
  var v=S.pdf; if(!v||!v.doc) return;
  var blob=v.doc.output("blob"), file=null;
  try{ file=new File([blob],v.name||"document.pdf",{type:"application/pdf"}); }catch(e){}
  if(isPhone()){
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      toast("Tap Print in the menu — it prints the PDF clean, one page a sheet.");
      navigator.share({files:[file],title:v.name}).catch(function(){});
      return;
    }
    printImages(btn); return;
  }
  var url=URL.createObjectURL(blob), fr=document.createElement("iframe");
  fr.style.cssText="position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0";
  fr.src=url; document.body.appendChild(fr);
  fr.onload=function(){
    try{ fr.contentWindow.focus(); fr.contentWindow.print(); }
    catch(e){ fr.remove(); URL.revokeObjectURL(url); printImages(btn); return; }
    setTimeout(function(){ fr.remove(); URL.revokeObjectURL(url); },60000);
  };
}
function printImages(btn){
  var v=S.pdf; if(!v) return;
  var box=document.getElementById("printpages"), label=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="Getting it ready…"; }
  function done(){ if(btn){ btn.disabled=false; btn.textContent=label||"Print"; } }
  loadPdfJs().then(function(lib){
    if(!v.bytes) v.bytes=new Uint8Array(v.doc.output("arraybuffer"));
    return lib.getDocument({data:v.bytes.slice()}).promise;
  }).then(function(pdf){
    box.innerHTML="";
    var chain=Promise.resolve();
    for(var n=1;n<=pdf.numPages;n++) (function(n){ chain=chain.then(function(){ return pdf.getPage(n); }).then(function(pg){
      var vp=pg.getViewport({scale:200/72}), c=document.createElement("canvas");
      c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
      var cx=c.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,c.width,c.height);
      return pg.render({canvasContext:cx,viewport:vp}).promise.then(function(){
        return new Promise(function(ok){ var im=new Image(); im.onload=ok; im.onerror=ok; im.src=c.toDataURL("image/png"); box.appendChild(im); });
      });
    }); })(n);
    return chain;
  }).then(function(){
    done();
    window.print();
  }).catch(function(){
    done(); box.innerHTML="";
    toast("Couldn't get it ready to print — use Save / Share, then Print.",{bad:1});
  });
}
window.addEventListener("afterprint",function(){ var b=document.getElementById("printpages"); if(b) b.innerHTML=""; });

/* ---------- the preview, and zooming it ----------
   iOS draws an iframe'd PDF at full size and clips it, so the pages are
   drawn with pdf.js onto canvases instead -- which means the browser's
   own PDF zoom isn't there to use and this has to supply it.

   Two scales, kept apart. The *display* scale is a CSS transform on
   .pdfzoomwrap: it follows the fingers with no redraw, so a pinch is as
   smooth as the native viewer. A transform doesn't change layout, so
   .pdfsizer is grown to the scaled size at the same time, otherwise
   there is nothing to scroll into and the right-hand side of the page
   can't be reached. The *raster* scale is what pdf.js draws at, and it
   is re-run once the gesture settles, so what you end up looking at is
   sharp text rather than a stretched bitmap. The buttons and a double
   tap go through the same path.

   Every change anchors the point under the fingers (or under the tap,
   or the middle of the box for a button): scroll to cx*r - ax, where cx
   is that point in content coordinates and r is how much the scale
   changed. Without it, zooming walks off the part being looked at. */
var PZ={ min:1, max:6, live:0, d0:0, s:1, mx:0, my:0, sl:0, st:0, natW:0, natH:0, tap:0, tapX:0, tapY:0 };
function pzBox(){ return document.getElementById("pdfpages"); }
function pzDist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
function pzMark(z){
  var row=document.querySelector(".pdfzoom"); if(!row) return;
  [].forEach.call(row.children, function(b){ b.setAttribute("aria-pressed", String(Math.abs((+b.dataset.z)-z)<.01)); });
}
/* ax/ay: the point to hold still, from the box's top-left. sl/st: the
   scroll it was measured against (the pre-gesture one, mid-pinch). */
function pzApply(z,ax,ay,sl,st){
  var v=S.pdf; if(!v) return;
  var old=v.zoom||1;
  z=Math.max(PZ.min,Math.min(PZ.max,z));
  if(Math.abs(z-old)<.01){ pzMark(old); return; }
  var r=z/old, cx=sl+ax, cy=st+ay;
  v.zoom=z; pzMark(z);
  drawPdfPages(function(){
    var b=pzBox(); if(!b) return;
    b.scrollLeft=Math.max(0,cx*r-ax); b.scrollTop=Math.max(0,cy*r-ay);
  });
}
function pzTo(z){
  var box=pzBox(); if(!box) return;
  pzApply(z, box.clientWidth/2, box.clientHeight/2, box.scrollLeft, box.scrollTop);
}
document.addEventListener("touchstart", function(e){
  var box=pzBox(); if(!box||!box.contains(e.target)||e.touches.length!=2) return;
  var w=document.getElementById("pdfzoomwrap"); if(!w) return;
  PZ.live=1; PZ.s=1; PZ.d0=pzDist(e.touches)||1;
  var r=box.getBoundingClientRect();
  PZ.mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
  PZ.my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
  PZ.sl=box.scrollLeft; PZ.st=box.scrollTop;
  PZ.natW=w.offsetWidth; PZ.natH=w.offsetHeight;
  box.style.touchAction="none";
  e.preventDefault();
}, {passive:false});
document.addEventListener("touchmove", function(e){
  if(!PZ.live||e.touches.length!=2) return;
  var box=pzBox(), w=document.getElementById("pdfzoomwrap"), sz=document.getElementById("pdfsizer");
  if(!box||!w||!sz) return;
  var z=(S.pdf&&S.pdf.zoom)||1;
  var s=Math.max(PZ.min/z, Math.min(PZ.max/z, pzDist(e.touches)/PZ.d0));
  PZ.s=s;
  w.style.transform="scale("+s+")";
  sz.style.width=Math.round(PZ.natW*s)+"px";
  sz.style.height=Math.round(PZ.natH*s)+"px";
  box.scrollLeft=Math.max(0,(PZ.sl+PZ.mx)*s-PZ.mx);
  box.scrollTop=Math.max(0,(PZ.st+PZ.my)*s-PZ.my);
  e.preventDefault();
}, {passive:false});
document.addEventListener("touchend", function(e){
  var box=pzBox(); if(!box) return;
  if(PZ.live){
    if(e.touches.length>=2) return;
    PZ.live=0; box.style.touchAction="";
    var w=document.getElementById("pdfzoomwrap"), sz=document.getElementById("pdfsizer");
    if(!w||!sz||!S.pdf) return;
    var s=PZ.s;
    w.style.transform=""; sz.style.width=""; sz.style.height="";
    pzApply((S.pdf.zoom||1)*s, PZ.mx, PZ.my, PZ.sl, PZ.st);
    return;
  }
  /* Double tap, the other way everyone zooms a document. */
  if(!box.contains(e.target)||!e.changedTouches||e.changedTouches.length!=1||e.touches.length) return;
  var t=e.changedTouches[0], now=Date.now();
  if(now-PZ.tap<300&&Math.abs(t.clientX-PZ.tapX)<30&&Math.abs(t.clientY-PZ.tapY)<30){
    PZ.tap=0;
    var r=box.getBoundingClientRect();
    pzApply(((S.pdf&&S.pdf.zoom)||1)>1.01?1:2.5, t.clientX-r.left, t.clientY-r.top, box.scrollLeft, box.scrollTop);
    e.preventDefault(); return;
  }
  PZ.tap=now; PZ.tapX=t.clientX; PZ.tapY=t.clientY;
}, {passive:false});

/* Drawn into a detached sizer and swapped in whole, so changing the zoom
   never blanks the box in the meantime. */
function drawPdfPages(done){
  var box=pzBox(), v=S.pdf; if(!box||!v) return;
  var z=v.zoom||1, token=v.drawn=(v.drawn||0)+1;
  var cssW=((box.clientWidth-16)||320)*z, dpr=Math.min(window.devicePixelRatio||1,3);
  if(cssW*dpr>2800) dpr=Math.max(1,2800/cssW);   /* a phone can't hold a 5x letter page at dpr 3 */
  loadPdfJs().then(function(lib){
    if(!v.bytes) v.bytes=new Uint8Array(v.doc.output("arraybuffer"));
    return lib.getDocument({data:v.bytes.slice()}).promise;
  }).then(function(pdf){
    if(v.drawn!=token||!pzBox()) return;
    var sizer=document.createElement("div"); sizer.id="pdfsizer"; sizer.className="pdfsizer";
    var wrap=document.createElement("div"); wrap.id="pdfzoomwrap"; wrap.className="pdfzoomwrap";
    sizer.appendChild(wrap);
    var chain=Promise.resolve();
    for(var n=1;n<=pdf.numPages;n++) (function(n){ chain=chain.then(function(){ return pdf.getPage(n); }).then(function(pg){
      if(v.drawn!=token) return;
      var base=pg.getViewport({scale:1}), sc=cssW/base.width, vp=pg.getViewport({scale:sc*dpr});
      var c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
      c.style.width=Math.floor(cssW)+"px"; c.style.height=Math.floor(base.height*sc)+"px";
      wrap.appendChild(c);
      return pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    }); })(n);
    return chain.then(function(){
      var b=pzBox(); if(v.drawn!=token||!b) return;
      b.innerHTML=""; b.appendChild(sizer);
      if(done) done();
    });
  }).catch(function(){
    var b=pzBox(); if(!b||v.drawn!=token) return;
    b.innerHTML='<iframe class="pdfframe" src="'+esc(v.url)+'#view=FitH" title="PDF preview"></iframe>';
  });
}
function showPdf(doc,name,title,note,extra){
  var url=URL.createObjectURL(doc.output("blob"));
  go("pdfview",{ pdf:Object.assign({ doc:doc, name:name, url:url, title:title, note:note, pages:doc.internal.getNumberOfPages() }, extra||{}) });
}
function needPdf(){
  if(pdfReady()) return true;
  toast("Still loading the PDF tool — try again in a second."); loadPdfLib().catch(function(){ toast("Couldn't load the PDF tool. Check your signal."); });
  return false;
}
/* Build a WPQR for a record that isn't the one on screen (samples). */
function withRecord(rec, fn){
  var keep={w:S.w,r:S.r,recId:S.recId};
  S.w=Object.assign(blankW(),rec.w); S.r=Object.assign(blankR(),rec.r); S.recId=rec.id;
  try{ return fn(); } finally { S.w=keep.w; S.r=keep.r; S.recId=keep.recId; }
}
